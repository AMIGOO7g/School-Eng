<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICE ENGLISH · Карьера</title>
<link rel="stylesheet" href="fonts.css?v=36"><link rel="stylesheet" href="ui2.css?v=50">
<style>
html,body{height:100%;overflow:hidden}
.sc-over{font-size:12px!important;letter-spacing:.42em!important;opacity:.9!important;color:var(--ink-2)!important}
.grid{position:fixed;z-index:12;left:8.8vw;right:8.8vw;top:30vh;height:50vh;display:grid;grid-template-columns:22vw 1fr 24vw;gap:1.4vw;align-items:end}
.rt,.lad{height:82%}
/* карточка игрока, как коллекционная хоккейная */
.pc{position:relative;height:100%;border-radius:22px;overflow:hidden;background:linear-gradient(160deg,#2a1216,#7a1a20 45%,#16263a);box-shadow:0 0 0 4px #c9d3dd,0 0 0 6px #8a99a8,0 24px 50px rgba(10,20,34,.35);animation:pcin .8s var(--ease) both}
@keyframes pcin{from{opacity:0;transform:rotateY(-25deg) translateY(20px)}}
.pc::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,transparent 0 40px,rgba(255,255,255,.05) 40px 46px),linear-gradient(115deg,transparent 40%,rgba(211,38,46,.65) 40% 52%,transparent 52%)}
.pc img{position:absolute;left:50%;bottom:0;height:88%;transform:translateX(-50%)}
.pc .no{position:absolute;left:18px;top:12px;font-family:var(--head);font-size:clamp(60px,6vw,110px);line-height:.9;color:#fff}
.pc .no small{display:block;font-family:var(--font);font-size:10px;font-weight:800;letter-spacing:.2em}
.pc .lg3{position:absolute;right:16px;top:16px;text-align:center;color:#fff;font-family:var(--head);font-size:13px;line-height:1;width:80px}
.pc .lg3 img{position:static;transform:none;width:46px;height:auto;margin:0 auto 4px;display:block}
.pc .nm{position:absolute;left:0;right:0;bottom:0;padding:40px 20px 16px;background:linear-gradient(transparent,rgba(10,16,24,.85));color:#fff;font-family:var(--head);font-size:clamp(26px,2.4vw,40px);line-height:1}
.pc .nm small{display:block;font-family:var(--font);font-size:11px;font-weight:800;letter-spacing:.22em;margin-top:4px;opacity:.8}
/* рейтинг и навыки */
.rt{border-radius:24px;background:rgba(255,255,255,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 18px 44px rgba(20,44,70,.14);padding:clamp(18px,2.6vh,30px) clamp(18px,1.8vw,30px);display:flex;flex-direction:column;gap:10px;animation:pcin .8s var(--ease) both .1s}
.rt .top3{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.rt .big{font-family:var(--head);font-size:clamp(70px,7vw,120px);line-height:.85;position:relative}
.rt .big::after{content:"";position:absolute;left:0;right:-30px;bottom:-8px;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--red),transparent);transform:rotate(-2deg)}
.rt .txt{font-size:clamp(13px,1vw,16px);color:var(--ink-2);line-height:1.45;border-left:1px solid rgba(31,50,72,.12);padding-left:16px}
.skl{display:grid;gap:8px;margin-top:auto}
.skl .row{display:grid;grid-template-columns:30px 1fr 48px;gap:12px;align-items:center;background:rgba(31,50,72,.05);border-radius:14px;padding:8px 14px}
.skl .ic{font-size:20px;text-align:center}
.skl b{font-size:12px;font-weight:900;letter-spacing:.12em}.skl b small{font-weight:700;color:var(--mute);letter-spacing:.16em;margin-left:6px}
.skl .bar{height:8px;border-radius:8px;background:rgba(31,50,72,.12);overflow:hidden;margin-top:6px}.skl .bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#e63a42,#b51c24);transition:width 1.2s var(--ease) .4s}
.skl .v{font-family:var(--head);font-size:26px;text-align:right}
/* лестница лиг */
.lad{border-radius:24px;background:linear-gradient(160deg,rgba(30,48,70,.72),rgba(16,28,44,.8));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;padding:18px 18px;display:flex;flex-direction:column;justify-content:space-between;position:relative;animation:pcin .8s var(--ease) both .2s}
.lad::before{content:"";position:absolute;left:34px;top:30px;bottom:30px;width:2px;background:rgba(255,255,255,.2)}
.lr{position:relative;display:grid;grid-template-columns:32px 44px 1fr auto;gap:12px;align-items:center;padding:6px 12px;border-radius:12px}
.lr .dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:#16263a;justify-self:center}
.lr img{width:40px;height:auto}
.lr b{font-family:var(--head);font-weight:400;font-size:clamp(14px,1.1vw,18px);line-height:1.1}.lr b small{display:block;font-family:var(--font);font-size:9px;font-weight:800;letter-spacing:.2em;opacity:.65}
.lr .lk{opacity:.6;font-size:14px}
.lr.cur{background:linear-gradient(90deg,#e63a42,#b51c24 70%,rgba(181,28,36,.4));box-shadow:0 10px 26px rgba(211,38,46,.4)}
.lr.cur .dot{border-color:#fff;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.3)}
.lr.done{opacity:.75}.lr.done .dot{background:var(--red);border-color:var(--red)}
/* полка достижений */
.shelf{position:fixed;z-index:12;left:8.8vw;right:8.8vw;bottom:3vh;height:15vh}
.shelf .hd{position:relative;z-index:2;display:flex;align-items:center;gap:10px;margin:0 0 8px 1vw}
.shelf .hd b{font-family:var(--head);font-weight:400;font-size:22px}
.shelf .hd span{font-size:11px;font-weight:800;color:#fff;background:var(--ink);border-radius:999px;padding:3px 10px}
.board3{align-items:center;padding-top:10px;height:calc(100% - 38px);border-radius:16px;background:linear-gradient(180deg,rgba(36,56,79,.85),rgba(18,33,51,.9));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 18px 40px rgba(10,20,34,.3),inset 0 2px 0 rgba(255,255,255,.12);display:grid;grid-template-columns:repeat(8,1fr);align-items:end;padding:0 2vw 10px}
.aw2{display:flex;flex-direction:column;align-items:center;gap:4px;transition:translate .3s var(--ease)}
.aw2:hover{translate:0 -6px}
.aw2 img{height:clamp(34px,5vh,60px);margin-top:0;filter:drop-shadow(0 10px 16px rgba(0,0,0,.4))}
.aw2.lock img{filter:grayscale(.85) brightness(.72) drop-shadow(0 10px 16px rgba(0,0,0,.4))}
.aw2:not(.lock) img{filter:drop-shadow(0 0 22px rgba(255,200,90,.6)) drop-shadow(0 10px 16px rgba(0,0,0,.4))}
.aw2 b{font-family:var(--head);font-weight:400;font-size:clamp(12px,1vw,16px);color:#fff;text-align:center;line-height:1}
.aw2 small{font-size:9px;font-weight:800;letter-spacing:.16em;color:rgba(255,255,255,.6)}
.aw2.lock .lkk{position:relative;margin-top:-28px;margin-bottom:6px;width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:12px}
@media (max-width:1100px){.grid{grid-template-columns:1fr 1fr;left:4vw;right:4vw}.lad{display:none}}
@media (max-height:820px){.grid{top:20vh;height:50vh}.shelf{height:19vh}}
.tb{border:0;background:none;font-family:var(--head);font-size:22px;color:var(--mute);cursor:pointer;display:flex;align-items:center;gap:8px;padding:0 6px}
.tb.on{color:var(--ink)}.tb span{font-family:var(--font);font-size:11px;font-weight:800;color:#fff;background:var(--ink);border-radius:999px;padding:3px 10px}
.board3.ops{grid-template-columns:repeat(10,1fr)}
.op3{display:flex;flex-direction:column;align-items:center;gap:4px}
.op3 img{height:clamp(30px,4.6vh,56px);margin-top:0;filter:drop-shadow(0 10px 16px rgba(0,0,0,.4))}
.op3.lock img{filter:brightness(0) opacity(.5)}
.op3 b{font-family:var(--head);font-weight:400;font-size:clamp(12px,1vw,16px);color:#fff}.op3 small{font-size:9px;font-weight:800;letter-spacing:.14em;color:rgba(255,255,255,.6)}
/* v45: по генерации — полка-доска уже, значки крупнее полки, лестница лиг крупнее, рейтинг огромной цифрой */
.shelf{height:auto!important;bottom:2.4vh!important}
.board3{height:clamp(54px,7vh,76px)!important;align-items:flex-end!important;overflow:visible!important;padding:0 2.5vw 6px!important;
  background:linear-gradient(180deg,#3a4f66 0%,#22364c 40%,#16263a 100%)!important;box-shadow:0 18px 30px rgba(10,20,34,.35),inset 0 2px 0 rgba(255,255,255,.18)!important;border-radius:10px!important}
.aw2 img,.op3 img{height:clamp(50px,8.5vh,120px)!important;margin-top:calc(-1 * clamp(28px,5vh,80px))!important;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.aw2 b,.op3 b{font-size:clamp(11px,.8vw,14px)!important}
.grid{height:53vh!important;top:24vh!important}
.shelf .hd{margin:0 0 calc(clamp(28px,5vh,80px) + 6px) 1vw!important}
.lr{grid-template-columns:32px 64px 1fr auto!important;padding:8px 14px!important}
.lr img{width:58px!important}
.lr b{font-size:clamp(17px,1.4vw,24px)!important}.lr b small{font-size:11px!important}
.top3 .big{font-size:clamp(96px,8.5vw,160px)!important;line-height:.85!important}
@media (max-height:960px){.grid{top:22vh!important;height:52vh!important}.aw2 img,.op3 img{height:7.5vh!important;margin-top:-4vh!important}.shelf .hd{margin-bottom:calc(4vh + 6px)!important}.lr{padding:4px 12px!important}.lr img{width:44px!important}}
.aw2 small,.op3 small{display:none!important}
.aw2 b,.op3 b{color:#fff!important;white-space:nowrap}
/* проба: оформленный фон */
.shelf .hd b{color:#fff!important}
.rt,.lad{box-shadow:0 24px 50px rgba(0,0,0,.35)!important}
.ab-word{top:8vh!important}
.shelf .hd .tb{color:rgba(255,255,255,.55)!important}.shelf .hd .tb.on{color:#fff!important}
.lock2{width:clamp(80px,7vw,120px);height:clamp(80px,7vw,120px);border-radius:24px;background:rgba(31,50,72,.08);display:grid;place-items:center;font-size:clamp(34px,3vw,52px)}
.aw2.lock .lkk{background:rgba(10,20,34,.85)!important;width:20px!important;height:20px!important;font-size:10px!important;margin-top:-22px!important;box-shadow:none!important}
.aw2 img,.op3 img{filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))!important}
.aw2.lock img{filter:grayscale(.85) brightness(.72) drop-shadow(0 8px 10px rgba(0,0,0,.45))!important}
.board3{box-shadow:0 18px 30px rgba(10,20,34,.35)!important}
.pc .pv{position:absolute;left:50%;bottom:0;height:86%;transform:translateX(-50%)}
/* коллекционная карточка: наклон за мышью и голографический блик */
.pc{transform:perspective(900px) rotateX(var(--ry,0deg)) rotateY(var(--rx,0deg));transition:transform .2s ease-out}
.pc .glare{position:absolute;inset:0;pointer-events:none;z-index:5;border-radius:inherit;mix-blend-mode:screen;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.0) 38%,rgba(255,255,255,.45) 47%,rgba(140,220,255,.35) 52%,rgba(255,200,240,.25) 56%,transparent 66%) no-repeat;
  background-size:250% 250%;background-position:var(--gx,0%) var(--gy,0%);animation:glr 6s ease-in-out infinite}
@keyframes glr{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
.pc:hover .glare{animation:none}
.lr{padding-left:14px!important;padding-right:14px!important}
.lad::before{left:calc(18px + 14px + 15px)!important}
.skl .row{background:#fff!important;box-shadow:0 4px 12px rgba(20,44,70,.06)}
.skl b{color:var(--ink)!important;font-size:13px!important}.skl b small{color:var(--ink-2)!important;font-size:11px!important}
.skl .v{color:var(--ink)!important}
.rt{background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(240,246,252,.92))!important}
.rt .txt{color:var(--ink)!important}
.pc{transition:transform .7s cubic-bezier(.2,.8,.2,1)!important}
</style></head>
<body class="dk">
<div id="stage"></div>
<section class="grid">
  <div class="pc" id="pc"></div>
  <div class="rt" id="rt"></div>
  <div class="lad" id="lad"></div>
</section>
<section class="shelf"><div class="hd"><button class="tb on" data-t="aw">МОИ ДОСТИЖЕНИЯ <span id="cnt"></span></button><button class="tb" data-t="op">СОПЕРНИКИ <span id="cnt2"></span></button></div><div class="board3" id="shelf"></div></section>
<div class="veil2"></div>
<script src="data.js?v=45"></script><script src="ui2.js?v=50"></script>
<script>
(() => {
  const $ = id => document.getElementById(id), P = UI2.profile(), st = P.st, cur = P.league.id;
  UI2.header('career');
  const sc = UI2.abstract($('stage'), { theme: 'gold', word: 'КАРЬЕРА', over: `${P.name} · 7 класс · сезон 2026/27`, horizon: .42 });
  $('pc').innerHTML = `<div class="no">7<small>НАПАДАЮЩИЙ</small></div><div class="lg3"><img src="img/${P.league.img}.webp" alt="">${P.league.name}</div>
    <video class="pv" src="img/pl_breath.webm" poster="img/pl_breath.webp" autoplay muted loop playsinline></video><span class="glare"></span><div class="nm">${P.name}<small>${P.league.name} · ${P.league.lvl}</small></div>`;
  const sk = st.skills || { shot: 50, skate: 50, vision: 50, pass: 50 };
  const IC = { shot: '<svg viewBox="0 0 40 40" width="22" height="22"><ellipse cx="20" cy="16" rx="15" ry="7" fill="#16263a"/><path d="M5 16v6c0 4 7 7 15 7s15-3 15-7v-6" fill="#0b1219"/></svg>',
    skate: '<svg viewBox="0 0 40 40" width="22" height="22"><path d="M10 6h9l2 14 9 3c3 1 4 3 4 6H8z" fill="#16263a"/><path d="M6 33h30" stroke="#16263a" stroke-width="3" stroke-linecap="round"/></svg>',
    vision: '<svg viewBox="0 0 40 40" width="22" height="22"><path d="M8 22a12 12 0 0 1 24 0v4H8z" fill="#16263a"/><path d="M12 26v6h16v-6" fill="none" stroke="#16263a" stroke-width="2.5"/></svg>',
    pass: '<svg viewBox="0 0 40 40" width="22" height="22"><path d="M8 6l20 26M32 6L12 32" stroke="#16263a" stroke-width="3.5" stroke-linecap="round"/></svg>' };
  const SK = [['shot', IC.shot, 'БРОСОК', 'грамматика'], ['skate', IC.skate, 'КАТАНИЕ', 'слова'], ['vision', IC.vision, 'ВИДЕНИЕ ПОЛЯ', 'чтение и слух'], ['pass', IC.pass, 'ПАС', 'письмо']];
  $('rt').innerHTML = `<span class="kick">Общий рейтинг</span><div class="top3">${P.rating === '—' ? '<span class="lock2"><svg class="ico" viewBox="0 0 24 24" width="1em" height="1em"><rect x="5" y="10" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></span>' : `<span class="big">${P.rating}</span>`}
    <span class="txt">${P.rating === '—' ? '<b>Рейтинг откроется после первой победы.</b><br>Выиграй урок — и навыки начнут расти.' : 'Ты становишься сильнее с каждым уроком. Продолжай — впереди новые лиги!'}</span></div>
    <div class="skl">${SK.map(([k, ic, n, d]) => `<div class="row"><span class="ic">${ic}</span><span><b>${n}<small>· ${d.toUpperCase()}</small></b><span class="bar"><i data-w="${sk[k]}"></i></span></span><span class="v">${st.skills ? sk[k] : '—'}</span></div>`).join('')}</div>`;
  setTimeout(() => document.querySelectorAll('.skl .bar i').forEach(i => i.style.width = (st.skills ? i.dataset.w : 0) + '%'), 200);
  $('lad').innerHTML = UI2.LEAGUES.slice().reverse().map(l => {
    const s2 = l.id < cur ? 'done' : l.id === cur ? 'cur' : 'lock';
    return `<div class="lr ${s2}"><span class="dot"></span><img src="img/${l.img}.webp" alt=""><b>${l.name}<small>${s2 === 'cur' ? 'ТЕКУЩАЯ ЛИГА' : s2 === 'done' ? 'ПРОЙДЕНА' : l.id === cur + 1 ? 'СЛЕДУЮЩАЯ ЦЕЛЬ' : l.lvl}</small></b><span class="lk">${s2 === 'lock' ? '<svg class="ico" viewBox="0 0 24 24" width="1em" height="1em"><rect x="5" y="10" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>' : ''}</span></div>`;
  }).join('');
  const AW = [['first_goal', 'Первый гол', 'первый выигранный урок'], ['hattrick', 'Хет-трик', '3 урока выиграно'], ['iron', 'Железный человек', '7 дней подряд'], ['sniper', 'Точный пас', 'урок без подсказок'],
              ['reader', 'Мастер чтения', '10 текстов'], ['star', 'Сухой матч', 'урок без ошибок'], ['fighter', 'Отбыл штраф', 'очистил скамейку'], ['summit', 'Покоритель вершин', 'весь сезон']];
  const have = st.awards || [];
  $('cnt').textContent = `${have.length} ИЗ ${AW.length}`;
  $('shelf').innerHTML = AW.map(([id, n, d]) => { const ok = have.includes(id);
    return `<div class="aw2 ${ok ? '' : 'lock'}"><img src="img/badge_${id}.webp" alt="">${ok ? '' : '<span class="lkk"><svg class="ico" viewBox="0 0 24 24" width="1em" height="1em"><rect x="5" y="10" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></span>'}<b>${n}</b><small>${ok ? 'СДЕЛАНО' : d.toUpperCase()}</small></div>`; }).join('');
  // коллекция соперников: выиграл все уроки модуля — карточка соперника твоя
  const TEAMS = ['wolf', 'bear', 'eagle', 'fox', 'lynx', 'deer', 'lion', 'owl', 'shark', 'tiger'], TEAMRU = ['Волки', 'Медведи', 'Орлы', 'Лисы', 'Рыси', 'Олени', 'Львы', 'Совы', 'Акулы', 'Тигры'];
  const beat = ICE_BOOK.map(m => m.lessons.every(l => st.done[l.id]));
  $('cnt2').textContent = `${beat.filter(Boolean).length} ИЗ 10`;
  const awHTML = $('shelf').innerHTML;
  const opHTML = TEAMS.map((t, i) => `<div class="op3 ${beat[i] ? '' : 'lock'}"><img src="img/team_${t}.webp" alt=""><b>${beat[i] ? TEAMRU[i] : '???'}</b><small>${beat[i] ? 'ПОБЕЖДЕНЫ' : 'МАТЧ ' + (i + 1)}</small></div>`).join('');
  document.querySelectorAll('.tb').forEach(b => b.onclick = () => { document.querySelectorAll('.tb').forEach(x => x.classList.toggle('on', x === b));
    const op = b.dataset.t === 'op'; $('shelf').classList.toggle('ops', op); $('shelf').innerHTML = op ? opHTML : awHTML; });
  { const pc = $('pc'); pc.addEventListener('pointermove', e => { const r = pc.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      pc.style.setProperty('--rx', ((x - .5) * 14).toFixed(1) + 'deg'); pc.style.setProperty('--ry', ((.5 - y) * 10).toFixed(1) + 'deg');
      const g = pc.querySelector('.glare'); g.style.setProperty('--gx', (x * 100).toFixed(0) + '%'); g.style.setProperty('--gy', (y * 100).toFixed(0) + '%'); });
    pc.addEventListener('pointerleave', () => { pc.style.setProperty('--rx', '0deg'); pc.style.setProperty('--ry', '0deg'); }); }
  UI2.ready();
  setTimeout(() => { const r0 = document.querySelector('.lr.cur'); if (!r0) return; const r = r0.previousElementSibling || r0, b = r.getBoundingClientRect(), nx = UI2.LEAGUES[cur];
    if (!nx) return; const n = (() => { const lr = document.querySelector('.lad').getBoundingClientRect(), room = innerWidth - lr.right > 210;
      return room ? UI2.note(document.body, `следующая лига —<br>${nx.name}`, lr.right + 14, b.top + b.height / 2 - 66, { x: -20, y: 60, d: 'M30 4 C 20 20, 8 36, -6 52 M-10 40 L-7 53 L5 47' })
                  : UI2.note(document.body, `следующая лига — ${nx.name}`, lr.right - 300, lr.top - 52, { x: 120, y: 26, d: 'M4 4 C 16 10, 24 18, 28 30 M20 22 L28 31 L33 20' }); })(); n.style.position = 'fixed'; n.style.zIndex = 15; }, 900);
})();
</script>
</body></html>
