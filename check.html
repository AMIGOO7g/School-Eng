<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Проверка файлов сайта</title>
<style>body{font:15px/1.5 Arial,sans-serif;margin:40px;color:#24374d}li.ok{color:#2f7b5f}li.bad{color:#d3262e;font-weight:700}</style></head>
<body><h2>Проверка: все ли файлы сайта на месте</h2><p id="sum">Проверяю…</p><ul id="list"></ul>
<script>
const files=['index.html','hub.html','school.html','module.html','lesson.html','homework.html','parent.html','data.js','ice-scene.js','ice-ui.js','ice.css','fonts.css',
'lessons/1a.js','lessons/2b.js','img/modules_sky.webp','img/modules_fg.webp','img/lesson_sky.webp','img/lesson_fg.webp','img/route_morning_sky.webp','img/route_morning_fg.webp',
'img/route_day_sky.webp','img/route_day_fg.webp','img/route_sunset_sky.webp','img/route_sunset_fg.webp','img/route_night_sky.webp','img/route_night_fg.webp',
'fonts/inter-cyrillic-900-normal.woff2','fonts/inter-latin-400-normal.woff2','frames/frame_000.webp','frames/frame_035.webp'];
let bad=0;Promise.all(files.map(f=>fetch(f+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok).catch(()=>false).then(ok=>{if(!ok)bad++;
const li=document.createElement('li');li.className=ok?'ok':'bad';li.textContent=(ok?'✓ ':'✗ НЕТ ФАЙЛА: ')+f;document.getElementById('list').appendChild(li);})))
.then(()=>{document.getElementById('sum').textContent=bad?`Не хватает файлов: ${bad}. Загрузите их в репозиторий с теми же папками.`:'Все файлы на месте. Если сайт выглядит странно — обновите страницу с очисткой кэша (Ctrl+Shift+R).';});
</script></body></html>
