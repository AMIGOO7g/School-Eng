<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ICE ENGLISH · Skate through levels</title>
<style>
:root{--ink:#24374d;--blue:#648ba5;--panel:#ffffffad}
*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:#dbe8f3;color:var(--ink);font-family:Inter,Arial,sans-serif;overflow-x:hidden}
.track{height:780vh}.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;isolation:isolate}
.bg,.grade,.travel,.skater,.top,.bottom{position:absolute}
.bg{inset:-15%;z-index:-4;will-change:background,transform;background:radial-gradient(ellipse at 15% 21%,#b6d4f0,transparent 55%),radial-gradient(ellipse at 83% 76%,#ffe5ce,transparent 63%),#e8edf4}
.bg:after{content:"";position:absolute;inset:-15%;background:radial-gradient(ellipse at 80% 18%,#f8d4cf,transparent 55%),radial-gradient(ellipse at 18% 80%,#bfdede,transparent 60%);opacity:.55;filter:blur(38px)}
.grade{inset:0;z-index:-1;pointer-events:none}.grade-item{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;will-change:opacity,transform;pointer-events:none}
.grade-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;white-space:nowrap;transform:translateY(-3vh)}
.grade-word{font-size:clamp(140px,32vw,520px);line-height:1;font-weight:900;letter-spacing:-.115em;color:#254b70;opacity:.13}.grade-item.school .grade-word{font-size:clamp(100px,20vw,350px);letter-spacing:-.08em}
.grade-label{font-size:clamp(15px,1.75vw,27px);font-weight:800;letter-spacing:.38em;color:#355b7a;opacity:.13;margin-top:-.18em;padding-left:.38em}
.travel{inset:0;z-index:2;pointer-events:none}.panel{position:absolute;left:0;top:0;height:100%;width:100%;will-change:transform,opacity;pointer-events:none}.panel-inner{position:absolute;left:clamp(24px,6.5vw,105px);top:49%;transform:translateY(-50%);width:min(39vw,600px)}
.kicker{font-size:11px;letter-spacing:.23em;font-weight:800;color:#627a8d}.title{font-size:clamp(58px,7.8vw,122px);line-height:.89;font-weight:900;letter-spacing:-.083em;margin:16px 0}.title span{color:var(--blue)}.desc{max-width:350px;color:#4e6578;line-height:1.45;font-size:clamp(14px,1.3vw,18px);margin:15px 0 22px}
.cta{pointer-events:auto;display:inline-flex;align-items:center;gap:17px;background:#263c51;color:#fff;border:0;border-radius:30px;padding:15px 23px;font-weight:750;letter-spacing:.035em;cursor:pointer;font-size:13px;text-decoration:none}.cta:hover{background:#42667e}
.skater{z-index:5;left:51.5%;top:31.5%;width:clamp(115px,14vw,235px);height:clamp(155px,19vw,310px);transform:translate(-50%,-50%);pointer-events:none;will-change:transform}.skater img{display:block;overflow:visible;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 11px 14px #17354d28)}
.shadow{position:absolute;left:50%;bottom:17vh;width:min(30vw,420px);height:26px;transform:translateX(-7%);background:radial-gradient(ellipse at center,#27466038 0%,#27466018 36%,#27466000 72%);filter:blur(10px);z-index:3;pointer-events:none}
.top{z-index:10;top:0;left:0;right:0;padding:26px clamp(24px,5vw,74px);display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand{font-size:13px;letter-spacing:.23em;font-weight:900}.brand span{font-weight:400}.counter{font-size:12px;color:#547086;letter-spacing:.17em;font-weight:700}
.bottom{z-index:10;bottom:26px;left:clamp(24px,5vw,74px);right:clamp(24px,5vw,74px);display:flex;justify-content:space-between;color:#667d8c;font-weight:700;font-size:11px;letter-spacing:.18em;pointer-events:none}.bars{display:flex;gap:5px}.bars i{width:16px;height:3px;background:#2f54615c;border-radius:5px}.bars i.active{background:#253e55}.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);z-index:30;color:#fff;background:#294258;padding:11px 18px;border-radius:16px;font-size:13px;display:none;text-align:center}.alt{position:fixed;right:18px;bottom:17px;padding:9px 15px;border:1px solid #ffffffb5;border-radius:22px;background:#ffffff99;color:#425b70;z-index:20;cursor:pointer;backdrop-filter:blur(8px)}
@media (max-width:900px){.panel-inner{top:50%;left:24px;width:min(72vw,420px)}.title{font-size:clamp(48px,14vw,90px)}.desc{max-width:280px}.grade-center{transform:translateY(-9vh)}.grade-word{font-size:clamp(120px,42vw,260px)}.grade-item.school .grade-word{font-size:clamp(90px,30vw,180px)}.skater{left:57%;top:34%;width:clamp(128px,34vw,220px);height:clamp(170px,46vw,290px)}.shadow{bottom:20vh;width:44vw;transform:translateX(-6%)}}
</style></head>
<body><div id="track" class="track"><main id="stage" class="stage"><div id="bg" class="bg"></div><div id="grades" class="grade"></div><div id="travel" class="travel"></div><div class="shadow"></div><div id="skater" class="skater"><img id="hockeyFrame" src="frames/frame_000.webp" alt="Hockey player"></div><header class="top"><div class="brand">ICE <span>ENGLISH</span></div><div id="counter" class="counter">01 / 07</div></header><footer class="bottom"><div id="bars" class="bars"></div><div>SCROLL TO SKATE</div></footer></main></div><div id="toast" class="toast"></div><button id="restart" class="alt">В начало</button>
<script>(()=>{const data=[
{grade:'',k:'01 / ICE ENGLISH',title:'GLIDE<br><span>IN.</span>',desc:'Плавный вход в обучение. Скроль вниз и выбери свой путь без лишнего шума.'},
{grade:'SCHOOL',kind:'school',k:'02 / ШКОЛЬНАЯ ПРОГРАММА',title:'SCHOOL.<br><span>YOUR WAY.</span>',desc:'Выбирай учебник, изучай текущую тему и закрепляй знания.',btn:'Выбрать учебник',href:'school.html'},
{grade:'A1',k:'03 / BEGINNER',title:'START<br><span>SMALL.</span>',desc:'Первые слова, предложения и уверенные шаги.',btn:'Уровень A1'},
{grade:'A2',k:'04 / ELEMENTARY',title:'KEEP<br><span>GOING.</span>',desc:'Учись понимать и общаться в повседневных ситуациях.',btn:'Уровень A2'},
{grade:'B1',k:'05 / INTERMEDIATE',title:'FIND<br><span>YOUR FLOW.</span>',desc:'Читай, разговаривай и выражай свои мысли.',btn:'Уровень B1'},
{grade:'B2',k:'06 / UPPER INTERMEDIATE',title:'GO<br><span>FURTHER.</span>',desc:'Больше свободы, сложнее маршруты.',btn:'Уровень B2'},
{grade:'C1',k:'07 / ADVANCED',title:'OWN<br><span>THE ICE.</span>',desc:'Английский без лишних ограничений.',btn:'Уровень C1'}];
const track=document.getElementById('track'),stage=document.getElementById('stage'),travel=document.getElementById('travel'),grades=document.getElementById('grades'),bg=document.getElementById('bg'),counter=document.getElementById('counter'),bars=document.getElementById('bars'),toast=document.getElementById('toast');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const panelEls=[],gradeEls=[];
data.forEach((d,i)=>{let sec=document.createElement('section');sec.className='panel';sec.innerHTML=`<div class="panel-inner"><div class="kicker">${d.k}</div><h${i?'2':'1'} class="title">${d.title}</h${i?'2':'1'}><p class="desc">${d.desc}</p>${d.btn?`<a class="cta" ${d.href?`href="${d.href}"`:''} data-id="${i}">${d.btn} <span>↗</span></a>`:''}</div>`;travel.appendChild(sec);panelEls.push(sec);let g=document.createElement('div');g.className='grade-item '+(d.kind||'');g.innerHTML=d.grade?`<div class="grade-center"><span class="grade-word">${d.grade}</span>${i>0?'<span class="grade-label">LEVEL</span>':''}</div>`:'';grades.appendChild(g);gradeEls.push(g);let b=document.createElement('i');bars.appendChild(b)});
let target=0,current=0;const sceneCount=data.length;let scrollTotal=1;function measure(){const r=track.getBoundingClientRect();scrollTotal=Math.max(1,r.height-innerHeight);target=clamp(-r.top/scrollTotal,0,1)}
function tick(){current+=(target-current)*.24;if(Math.abs(target-current)<.000025)current=target;const p=current*(sceneCount-1),w=stage.clientWidth,mobile=w<740,start=w+20,anchor=mobile?24:Math.max(24,w*.065),span=start-anchor;panelEls.forEach((el,i)=>{const x=i===0?anchor-p*span:(i-p)*span+anchor;el.style.transform=`translate3d(${x-anchor}px,0,0)`;const ww=el.querySelector('.panel-inner').getBoundingClientRect().width;const visible=x+ww>0&&x<w;el.style.visibility=visible?'visible':'hidden';el.style.pointerEvents=visible?'auto':'none'});gradeEls.forEach((g,i)=>{let u=Math.abs(p-i);let opacity=clamp((.52-u)/.22,0,1);opacity=opacity*opacity*(3-2*opacity);g.style.opacity=String(opacity);g.style.transform=`translate3d(${(i-p)*w*.065}px,0,0)`});bg.style.transform=`translate3d(${(-p*1.15).toFixed(2)}%,${(Math.sin(p*.65)*1.8).toFixed(2)}%,0)`;bg.style.filter=`hue-rotate(${(p*12).toFixed(1)}deg)`;const frameCount=36;const num=Math.floor(current*sceneCount*frameCount*1.15)%frameCount;const f=document.getElementById('hockeyFrame');const next='frames/frame_'+String(num).padStart(3,'0')+'.webp';if(f.getAttribute('src')!==next)f.setAttribute('src',next);const idx=clamp(Math.round(p),0,sceneCount-1);counter.textContent=`0${idx+1} / 0${sceneCount}`;[...bars.children].forEach((b,i)=>b.classList.toggle('active',i===idx));requestAnimationFrame(tick)}
for(let i=0;i<36;i++){const img=new Image();img.src='frames/frame_'+String(i).padStart(3,'0')+'.webp'}measure();addEventListener('scroll',measure,{passive:true});addEventListener('resize',measure);tick();document.getElementById('restart').onclick=()=>scrollTo({top:0,behavior:'smooth'});document.querySelectorAll('.cta').forEach(btn=>btn.onclick=(e)=>{if(btn.getAttribute('href')) return; e.preventDefault();toast.textContent=`${btn.textContent.trim()} — подключим к учебной панели на следующем этапе.`;toast.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.style.display='none',2200)})})();</script></body></html>
