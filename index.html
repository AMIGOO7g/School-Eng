<script>
(() => {
  const $ = id => document.getElementById(id), P = UI2.profile(), cur = P.league.id;
  UI2.header('', { dark: true });
  const total = ICE_BOOK.flatMap(m => m.lessons).length;
  const lock = '<svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2.5" fill="#111"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10" fill="none" stroke="#111" stroke-width="2.4"/></svg>';
  const items = UI2.LEAGUES.map(l => {
    const st = l.id < cur ? 'done' : l.id === cur ? 'cur' : 'lock';
    const b = document.createElement('button'); b.className = 'lg ' + st; b.base = st === 'cur' ? 1.16 : st === 'lock' ? .88 : .94;
    b.innerHTML = `${st === 'cur' ? '' : '<span class="view">СМОТРИШЬ</span>'}<span class="tag">${l.lvl}</span><span class="em"><img src="img/${l.img}.webp" alt=""></span><span class="nm">${l.name}</span>
      <span class="trk">${st === 'done' ? '<i style="width:100%"></i>' : st === 'cur' ? `<i style="width:${Math.max(3, P.done / total * 100).toFixed(1)}%"></i>` : `<span class="lock">${lock}</span>`}</span>`;
    b.onclick = () => { const tr = document.getElementById('track'); const max = tr.getBoundingClientRect().height - innerHeight; scrollTo({ top: max * l.id / 6, behavior: 'smooth' }); };
    $('lad').appendChild(b); return b; });
  const em = b => b.querySelector('.em');
  const setScale = (b, s) => { const lift = (s - b.base) * 26; em(b).style.transform = `translateY(${-lift}px) scale(${s})`;
    const h = em(b).offsetHeight || 70; b.querySelector('.tag').style.transform = `translateY(${-(lift + (s - 1) * h)}px)`; b.querySelector('.view') && (b.querySelector('.view').style.marginBottom = (lift + (s - 1) * h) + 'px'); };
  items.forEach(b => setScale(b, b.base));
  items.forEach(b => { const im = b.querySelector('img'), fit = () => { const c = document.createElement('canvas'), W = 120, H = Math.round(120 * im.naturalHeight / im.naturalWidth); c.width = W; c.height = H;
    const x = c.getContext('2d'); x.drawImage(im, 0, 0, W, H); const d = x.getImageData(0, 0, W, H).data; let x0 = W, x1 = 0, y0 = H, y1 = 0;
    for (let y = 0; y < H; y++) for (let i = 0; i < W; i++) if (d[(y * W + i) * 4 + 3] > 200) { if (i < x0) x0 = i; if (i > x1) x1 = i; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    const e = b.querySelector('.em'), sz = Math.min(x1 - x0, y1 - y0); e.style.setProperty('--rx', (x0 + (x1 - x0 - sz) / 2) / W * 100 + '%'); e.style.setProperty('--ry', (y0 + (y1 - y0 - sz) / 2) / H * (H / W) * 100 + '%'); e.style.setProperty('--rw', sz / W * 100 + '%'); };
    im.complete ? fit() : im.addEventListener('load', fit); });
  // пунктир по центру эмблем: пройденная часть — красная
  function dashes() {
    const R = $('lad').getBoundingClientRect(), c = items.map(b => { const r = b.querySelector('img').getBoundingClientRect(); return { x: r.left + r.width / 2 - R.left, y: r.top + r.height / 2 - R.top }; });
    const y = c[0].y - 2; Object.assign($('dg').style, { left: c[0].x + 'px', width: c[5].x - c[0].x + 'px', top: y + 'px' });
    Object.assign($('dr').style, { left: c[0].x + 'px', width: c[cur - 1].x - c[0].x + 'px', top: y + 'px' });
  }
  // эффект Dock: эмблемы рядом с курсором увеличиваются и приподнимаются
  const lad = $('ladder');
  lad.addEventListener('mousemove', e => items.forEach(b => { const r = b.getBoundingClientRect(), d = Math.abs(e.clientX - (r.left + r.width / 2)); setScale(b, b.base + .2 * Math.max(0, 1 - d / 170)); }));

  setTimeout(dashes, 300); addEventListener('resize', dashes);
  window.__ladder = (p, idx) => { $('c2').textContent = `0${idx + 1} / 07`; $('hint2').style.opacity = idx === 0 ? 1 : 0;
