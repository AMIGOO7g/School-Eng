<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICE ENGLISH · Карьера</title>
<link rel="stylesheet" href="fonts.css?v=31"><link rel="stylesheet" href="ui2.css?v=31">
<style>
html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
.snap{height:100vh;scroll-snap-align:start}
/* текст сцены */
.lead2{position:fixed;z-index:12;left:0;right:0;top:calc(var(--hz,50vh) - clamp(40px,6vh,64px))}
.lead2 .box{max-width:480px;transition:opacity .35s ease,transform .5s var(--ease)}
.lead2 .box.out{opacity:0;transform:translateY(14px)}
.lead2 h1{font-size:clamp(46px,4.8vw,84px);margin:10px 0 12px}
.lead2 p{font-size:clamp(15px,1.1vw,17px);line-height:1.5;color:var(--ink);font-weight:600;margin:0 0 20px;max-width:430px}
.lead2 .req{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--ink-2);margin-top:12px}
/* хоккеист */
.skater{position:fixed;z-index:8;pointer-events:none;height:min(44vh,520px);right:max(var(--pad),calc((100vw - 1320px) / 2));top:calc(var(--hz,50vh) - min(26vh,300px));transition:transform .6s var(--ease)}
.skater img{height:100%;display:block;filter:drop-shadow(0 30px 30px rgba(20,40,64,.18))}
.skater .bob{height:100%;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.skater.dash{animation:dash .7s var(--ease)}
@keyframes dash{0%{transform:translateX(70px);opacity:.4}100%{transform:none;opacity:1}}
/* лестница лиг */
.ladder{position:fixed;z-index:12;left:0;right:0;bottom:clamp(18px,4vh,40px)}
.ladder .row{display:grid;grid-template-columns:repeat(6,1fr);position:relative}
.ladder .line{position:absolute;left:8.33%;right:8.33%;top:52px;height:4px;background:repeating-linear-gradient(90deg,rgba(31,50,72,.35) 0 10px,transparent 10px 18px)}
.ladder .line i{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:3px;transition:width .8s var(--ease)}
.lg{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:0}
.lg .tag{font-size:11px;font-weight:900;color:#fff;background:rgba(31,50,72,.55);padding:3px 8px;border-radius:6px}
.lg img{width:clamp(58px,5.4vw,84px);height:auto;transition:transform .4s var(--ease),filter .4s}
.lg .nm{font-family:var(--head);font-size:clamp(14px,1.2vw,19px);color:var(--ink)}
.lg .lk{font-size:12px;opacity:.6;height:14px}
.lg.lock img{filter:grayscale(.85) brightness(.85);opacity:.75}
.lg.cur img{filter:drop-shadow(0 0 18px rgba(211,38,46,.7))}
.lg.cur .tag{background:var(--red)}
.lg.sel img{transform:scale(1.14)}
.lg .prog{width:70%;height:4px;border-radius:4px;background:rgba(31,50,72,.15);overflow:hidden}.lg .prog i{display:block;height:100%;background:var(--red)}
.count{position:fixed;z-index:12;right:var(--pad);bottom:calc(clamp(18px,4vh,40px) + 140px);font-family:var(--head);font-size:18px;color:var(--ink-2);letter-spacing:.1em}
.hint{position:fixed;z-index:12;left:50%;transform:translateX(-50%);bottom:calc(clamp(18px,4vh,40px) + 150px);font-size:12px;letter-spacing:.3em;font-weight:800;color:var(--ink-2);text-transform:uppercase;transition:opacity .4s}
@media (max-height:760px){.ladder .lg .nm{font-size:13px}.lead2 h1{font-size:52px}}
</style></head>
<body>
<div id="stage"></div>
<div class="skater" id="sk"><div class="bob"><img src="img/pl_skate.webp" alt="Хоккеист номер 7"></div></div>
<section class="lead2"><div class="wrap"><div class="box" id="box"></div></div></section>
<section class="ladder"><div class="wrap"><div class="row" id="lad"><div class="line"><i id="lineFill"></i></div></div></div></section>
<div class="count" id="count">01 / 07</div>
<div class="hint" id="hint">листай вниз ↓</div>
<main id="snaps"></main>
<div class="veil2"></div>
<script src="data.js?v=31"></script><script src="ui2.js?v=31"></script>
<script>
(() => {
  const $ = id => document.getElementById(id), P = UI2.profile(), cur = P.league.id;
  UI2.header('career');
  const DESC = {
    1: ['Первый шаг', 'Здесь всё начинается. Школа: учебник Spotlight 7 — модули, домашка, тренировки и словарь.', 'Начать сезон', 'hub.html'],
    2: ['Лига 2', 'Уверенные основы: прошедшие времена, рассказы о себе и о других, первые тексты.'],
    3: ['Лига 3 · Молодёжка', 'Все времена, связный текст, письма и сочинения, аудирование.'],
    4: ['Лига 4 · Вышка', 'Сложная грамматика, длинные тексты, эссе и дискуссии.'],
    5: ['Лига 5', 'Свободная речь: фильмы, новости и книги на английском.'],
    6: ['Вершина', 'Уровень носителя языка. Самый главный кубок.']
  };
  const S = [{ word: 'ICE ENGLISH', over: 'твоя карьера · сезон 2026/27' }].concat(UI2.LEAGUES.map(L => ({ word: L.name, over: `лига ${L.id} · ${L.lvl}${L.id === cur ? ' · ты здесь' : ''}`, L })));
  const sc = UI2.scene($('stage'), { horizon: .5, size: .26, sink: .32 });
  const setHz = () => document.documentElement.style.setProperty('--hz', sc.horizonPx() + 'px'); setHz(); addEventListener('resize', setHz);
  S.forEach(() => { const s = document.createElement('section'); s.className = 'snap'; $('snaps').appendChild(s); });

  // лестница лиг
  const total1 = ICE_BOOK.flatMap(m => m.lessons).length;
  UI2.LEAGUES.forEach(L => {
    const b = document.createElement('button'); b.className = 'lg' + (L.id > cur ? ' lock' : '') + (L.id === cur ? ' cur' : '');
    b.innerHTML = `<span class="tag">${L.lvl}</span><img src="img/${L.img}.webp" alt=""><span class="nm">${L.name}</span>` +
      (L.id === cur ? `<span class="prog"><i style="width:${(P.done / total1 * 100).toFixed(1)}%"></i></span>` : `<span class="lk">${L.id > cur ? '🔒' : ''}</span>`);
    b.onclick = () => scrollTo({ top: L.id * innerHeight, behavior: 'smooth' });
    $('lad').appendChild(b);
  });
  $('lineFill').style.width = ((cur - 1) / 5 * 100 + P.done / total1 * (100 / 5)) + '%';

  function box(i) {
    const s = S[i];
    if (!s.L) return `<div class="kick bar">Ice English · 7 класс</div><h1 class="h">Твоя карьера<br>в английском</h1>
      <p>Шесть лиг — от детского хоккея до НХЛ. Каждая лига — новый уровень языка. Проходи матчи, зарабатывай награды и прокачивай игрока.</p>
      <a class="btn" href="hub.html" data-go>Начать карьеру <span>→</span></a>`;
    const L = s.L, d = DESC[L.id], open = L.id <= cur;
    return `<div class="kick bar">${d[0]}</div><h1 class="h">${L.name.replace(' ', '<br>')}</h1><p>${d[1]}</p>` +
      (open ? `<a class="btn" href="${d[3] || 'hub.html'}" data-go>${d[2] || 'Играть'} <span>→</span></a>`
            : `<span class="btn lock">🔒 Закрыто</span><div class="req">Откроется после просмотра в лиге «${UI2.LEAGUES[L.id - 2].name}»</div>`);
  }
  let idx = -1;
  function show(i, first) {
    if (i === idx) return; idx = i;
    sc.set(S[i].word, S[i].over, first); sc.pan(i * 14);
    const b = $('box'); b.classList.add('out');
    setTimeout(() => { b.innerHTML = box(i); b.classList.remove('out'); b.querySelectorAll('[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); UI2.go(a.getAttribute('href')); }); }, first ? 0 : 300);
    [...$('lad').querySelectorAll('.lg')].forEach((el, k) => el.classList.toggle('sel', k + 1 === i));
    $('count').textContent = `${String(i + 1).padStart(2, '0')} / 07`;
    $('hint').style.opacity = i === 0 ? 1 : 0;
    if (!first) { const k = $('sk'); k.classList.remove('dash'); void k.offsetWidth; k.classList.add('dash'); }
  }
  addEventListener('scroll', () => show(Math.max(0, Math.min(S.length - 1, Math.round(scrollY / innerHeight)))), { passive: true });
  addEventListener('keydown', e => { if (e.key === 'ArrowRight') scrollBy({ top: innerHeight }); if (e.key === 'ArrowLeft') scrollBy({ top: -innerHeight }); });
  show(0, true); UI2.ready();
  // пометка тренера у текущей лиги
  setTimeout(() => {
    const c = $('lad').querySelectorAll('.lg')[cur - 1].querySelector('img').getBoundingClientRect();
    const host = document.body, n = UI2.note(host, 'ты здесь!', Math.max(8, c.left - 120), c.top - 46, { x: 60, y: 30, d: 'M10 10 C 40 20, 70 40, 112 58 M100 46 L112 58 L96 62' });
    n.style.position = 'fixed'; n.style.zIndex = 13;
  }, 900);
})();
</script>
</body></html>
