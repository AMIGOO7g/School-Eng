<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ICE ENGLISH · Урок</title>
<link rel="stylesheet" href="ice.css">
<style>
:root{--left:clamp(24px,5vw,74px);--cardw:clamp(560px,40vw,1000px)}
.stage{transition:transform 1.2s var(--ease)}
body.leaving .stage{transform:scale(1.06)}
.stage .ibg-svg{transition:transform 1.4s var(--ease);transform:translateX(var(--pan,0px))}
.stage .ibg-giant-wrap{transform:none;opacity:1;transition:transform 1.2s var(--ease),opacity .8s ease}
.stage .ibg-giant-wrap.hidden{transform:translateY(20vh);opacity:0;transition:transform .55s cubic-bezier(.6,0,.8,.4),opacity .45s}

/* карточка урока */
.card{position:fixed;z-index:10;left:var(--left);top:72px;bottom:clamp(16px,3vh,32px);width:var(--cardw);display:flex;flex-direction:column;border-radius:30px;
  background:rgba(255,255,255,.74);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 24px 60px rgba(27,47,69,.16);overflow:hidden;opacity:0;transform:translateX(-24px);transition:opacity .6s ease .15s,transform .8s var(--ease) .15s}
body.ready .card{opacity:1;transform:none}
body.leaving .card{opacity:0;transform:translateX(-24px);transition-delay:0s}
.chead{display:flex;align-items:center;gap:12px;padding:18px 22px 0;flex-wrap:wrap}
.pucks{margin-left:auto;display:flex;gap:6px;align-items:center}
.pucks i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1.5px rgba(36,55,77,.22);position:relative;transition:transform .3s}
.pucks i.ok,.pucks i.err{background:radial-gradient(circle at 34% 30%,#6b7785 0 9%,#2a3440 32%,#111820 64%,#0a0f15);box-shadow:inset 0 0 0 1.5px #1c2530,0 2px 5px rgba(10,20,30,.3)}
.pucks i.err{box-shadow:0 0 0 2.5px var(--red),inset 0 0 0 1.5px #1c2530}
.pucks i.now{transform:scale(1.15);box-shadow:inset 0 0 0 1.5px rgba(36,55,77,.4)}
.pucks i.now::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--red);animation:pulse3 1.6s ease-out infinite}
@keyframes pulse3{from{transform:scale(.9);opacity:1}to{transform:scale(1.5);opacity:0}}
.ptitle{padding:18px 30px 0}
.ptitle h2{font-size:clamp(28px,2.4vw,46px);margin:8px 0 0}
.pbody{flex:1;min-height:0;overflow:auto;padding:16px 30px 10px;font-size:15px;line-height:1.5}
.pfoot{padding:14px 30px 20px;display:flex;gap:12px;align-items:center;border-top:1px solid rgba(36,55,77,.08);min-height:72px}
.pfoot .sp{flex:1}
/* смена содержимого: старое уезжает влево, новое выезжает справа, блоки по очереди */
.view-out{animation:vout .26s cubic-bezier(.6,0,.8,.4) forwards}
@keyframes vout{to{opacity:0;transform:translateX(-46px)}}
.view-in > *{animation:vin .6s var(--ease) both}
.view-in > *:nth-child(2){animation-delay:.06s}.view-in > *:nth-child(3){animation-delay:.12s}.view-in > *:nth-child(4){animation-delay:.18s}.view-in > *:nth-child(n+5){animation-delay:.24s}
@keyframes vin{from{opacity:0;transform:translateX(56px)}to{opacity:1;transform:none}}
@media (min-width:1900px){.pbody{font-size:17px}.chead .seg button{font-size:14px;padding:10px 16px}}

/* обзор урока */
.learn{margin:0 0 18px;padding:0;list-style:none;display:grid;gap:6px}
.learn li{padding-left:22px;position:relative;font-weight:600}
.learn li::before{content:"";position:absolute;left:0;top:.55em;width:10px;height:3px;border-radius:3px;background:var(--red)}
.meta{color:var(--ink-2);font-size:14px;margin:4px 0 18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;text-align:left;border:0;border-radius:22px;padding:18px 18px 16px;cursor:pointer;background:#fff;box-shadow:0 8px 22px rgba(27,47,69,.1);
  display:flex;flex-direction:column;gap:6px;min-height:138px;transition:transform .3s var(--ease),box-shadow .3s}
.tile:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(27,47,69,.18)}
.tile .k{font-size:11px;letter-spacing:.2em;font-weight:800;color:var(--mute);text-transform:uppercase}
.tile b{font-size:22px;font-weight:900;letter-spacing:-.05em}
.tile span{font-size:14px;color:var(--ink-2)}
.tile .st{margin-top:auto;font-size:12px;font-weight:800;color:var(--ink)}
.tile.rec{background:var(--ink);color:#fff}
.tile.rec .k,.tile.rec span,.tile.rec .st{color:rgba(255,255,255,.75)}
.tile .badge{position:absolute;right:14px;top:14px;font-size:11px;font-weight:800;background:var(--red);color:#fff;padding:4px 9px;border-radius:999px}

/* объяснение: правило — тёмная плашка, пример — светлая, проверка — белая с красной меткой */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.duo > div,.cases li{background:var(--ink);color:#fff;border-radius:18px;padding:16px 18px}
.duo .kicker,.cases .kicker{color:rgba(255,255,255,.6)}
.duo p{margin:6px 0}
.duo b,.cases b{color:#fff}
.ex{font-size:16px;font-weight:600;cursor:pointer;display:inline-block;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:12px;margin:4px 0}
.ex::before{content:"🔊";font-size:12px;margin-right:8px}
.ex:hover{background:rgba(255,255,255,.22)}
.pbody > div > .ex{background:rgba(37,75,112,.08);color:var(--ink)}
.pbody > div > .ex b{color:var(--ink)}
.tr{color:rgba(255,255,255,.68);font-size:14px}
.pbody > div > .tr{color:var(--mute)}
.note{color:var(--ink-2);font-size:14px;margin:12px 0 0}
.forms{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}
.forms td{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.12);vertical-align:top}
.forms td:first-child{color:rgba(255,255,255,.6);padding-right:10px;white-space:nowrap}
.forms i{color:#ff8a8f;font-style:normal;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{padding:5px 11px;border-radius:999px;background:#fff;color:var(--ink);font-weight:700;font-size:14px}
.cases{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.cases p{margin:4px 0 0}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.words span{background:#fff;border-radius:14px;padding:9px 12px;cursor:pointer;font-size:13px;color:var(--mute);line-height:1.3;box-shadow:0 4px 12px rgba(27,47,69,.06)}
.words span b{display:block;color:var(--ink);font-size:15px}
.check{margin-top:16px;padding:16px 18px;border-radius:18px;background:#fff;border-top:4px solid var(--red);box-shadow:0 8px 22px rgba(27,47,69,.08)}
.check .kicker{display:block;margin-bottom:6px;color:var(--red)}
.check p{margin:0 0 10px;font-weight:800}

mark{background:linear-gradient(transparent 58%,rgba(211,38,46,.26) 58%);color:inherit;font-weight:800;padding:0 1px}
.duo mark,.cases mark,.hw-top mark{background:linear-gradient(transparent 58%,rgba(255,110,115,.45) 58%);color:#fff}
.f{display:inline-block;font-weight:800;font-size:.92em;background:#fff;color:var(--ink);padding:2px 9px;border-radius:8px;white-space:nowrap}
.pbody .ex{border-left:3px solid var(--red)}
/* задания */
.q{font-size:clamp(20px,1.8vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.3;margin:6px 0 18px}
.q u{text-decoration:none;display:inline-block;min-width:90px;border-bottom:3px solid var(--red)}
.how{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--ink-2);background:rgba(37,75,112,.08);padding:7px 12px;border-radius:999px;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1px solid rgba(36,55,77,.12);background:#fff;border-radius:16px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s}
.opt:hover{box-shadow:0 6px 18px rgba(27,47,69,.12);transform:translateY(-1px)}
.opt.right{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt.wrong{color:var(--red);border-color:var(--red);animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pool,.basket,.slots{user-select:none;-webkit-user-select:none}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:56px;padding:10px;border-radius:18px;background:rgba(37,75,112,.06)}
.chip{border:1px solid rgba(36,55,77,.15);background:#fff;border-radius:14px;padding:10px 16px;font-size:16px;font-weight:800;cursor:grab;touch-action:none;user-select:none;transition:transform .2s,box-shadow .2s,opacity .2s}
.chip:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(27,47,69,.14)}
.chip.picked{background:var(--ink);color:#fff}
.chip.bad{animation:shake .35s;border-color:var(--red);color:var(--red)}
.chip.lift{opacity:.25}
.chip.pinned{background:var(--ink);color:#fff;cursor:default}
.chip.good{background:var(--ink);color:#fff}
.chip.done{background:rgba(36,55,77,.08);color:var(--mute);border-color:transparent;cursor:default}
.drag-ghost{position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg);box-shadow:0 14px 30px rgba(27,47,69,.3)}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.slot{min-width:74px;height:52px;border:2px dashed rgba(36,55,77,.25);border-radius:14px;display:flex;align-items:center;justify-content:center;transition:border-color .2s,background .2s}
.slot.over,.basket.over,.pool.over{border-color:var(--red);background:rgba(211,38,46,.06)}
.slot .chip{margin:-2px}
.slot.filled{border-color:transparent}
.helpers{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.basket{border:2px dashed rgba(36,55,77,.22);border-radius:18px;padding:12px;min-height:120px;cursor:pointer;background:rgba(255,255,255,.5);text-align:left;transition:border-color .2s,background .2s}
.basket .kicker{display:block;margin-bottom:8px;color:var(--ink)}
.basket .in{display:flex;flex-wrap:wrap;gap:6px}
.basket .in span{padding:5px 10px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;font-weight:700}
.tokens{display:flex;flex-wrap:wrap;gap:8px}
.tokens .chip{cursor:pointer}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols > div{display:grid;gap:8px}
.cols .chip{cursor:pointer}
.play{display:inline-flex;align-items:center;gap:12px;border:0;border-radius:999px;padding:14px 22px;background:var(--red);color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-bottom:18px}
.fb{margin:16px 0 4px;border-radius:16px;padding:12px 16px;font-size:15px;line-height:1.45;display:none}
.fb.show{display:block;animation:vin .4s var(--ease)}
.fb.ok{background:var(--ink);color:#fff}
.fb.bad{background:#fff;border:2px solid var(--red);color:var(--ink)}
.fb b{display:block;margin-bottom:2px}
.score{font-size:clamp(64px,6vw,120px);font-weight:900;letter-spacing:-.083em;line-height:.9;margin:6px 0 10px}
.score small{font-size:.3em;letter-spacing:0;color:var(--mute);font-weight:700}
.errs{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.errs li{background:#fff;border-radius:12px;padding:8px 12px;font-size:14px}

/* слова */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.fc{height:112px;perspective:800px;cursor:pointer;border:0;background:none;padding:0}
.fc > div{position:relative;width:100%;height:100%;transition:transform .6s var(--ease);transform-style:preserve-3d}
.fc.flip > div{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;justify-content:center;padding:12px 14px;backface-visibility:hidden;text-align:left}
.fc .f{background:#fff;box-shadow:0 6px 16px rgba(27,47,69,.08)}
.fc .f b{font-size:17px;font-weight:900;letter-spacing:-.03em}
.fc .f small{font-size:11px;color:var(--mute);margin-top:6px;font-weight:700}
.fc .b{background:var(--ink);color:#fff;transform:rotateY(180deg);font-size:16px;font-weight:700}

/* домашка */
.gloss{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.gloss span{font-size:13px;background:rgba(37,75,112,.07);padding:5px 10px;border-radius:999px;color:var(--ink-2)}
.gloss b{color:var(--ink);cursor:pointer}
.tr-en{font-size:16px}
.tr-n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;margin-right:4px}
.tr-in{width:100%;font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;border:1px solid rgba(36,55,77,.18);background:#fff;resize:vertical;margin:4px 0}
.tr-all{margin-top:8px;padding:12px 14px;border-radius:14px;background:var(--ink);color:#fff}
.tr-all .kicker{color:rgba(255,255,255,.6)}.tr-all p{margin:6px 0 0}
.checklist{display:grid;gap:6px;margin-top:10px;padding:12px 14px;border-radius:14px;background:#fff;border-top:3px solid var(--red)}
.checklist label{font-size:14px;cursor:pointer}
.wr-out p{margin:6px 0;padding:8px 12px;border-radius:12px;font-weight:600}
.wr-out p.ok{background:rgba(36,55,77,.08)}
.wr-out p.bad{background:#fff;border:2px solid var(--red)}
.wr-out small{display:block;font-weight:600;color:var(--red);margin-top:2px}
.hw{border-radius:22px;background:#fff;box-shadow:0 8px 22px rgba(27,47,69,.08);margin-bottom:14px;overflow:hidden}
.hw-top{background:var(--ink);color:#fff;padding:14px 18px}
.hw-top .kicker{color:rgba(255,255,255,.6)}
.hw-top p{margin:6px 0 0;font-weight:600}
.hw-rule{padding:12px 18px;background:rgba(37,75,112,.06);font-size:14px}
.hw-items{padding:8px 18px 14px;display:grid;gap:8px}
.hw-item{border-bottom:1px solid rgba(36,55,77,.08);padding:8px 0}
.hw-item p{margin:0;font-weight:700}
.hw-item button{margin-top:6px;border:0;background:rgba(211,38,46,.1);color:var(--red);font-weight:800;font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer}
.hw-item .h{display:none;margin-top:6px;font-size:14px;color:var(--ink-2);background:rgba(37,75,112,.06);padding:8px 12px;border-radius:12px}
.hw-item.open .h{display:block;animation:vin .35s var(--ease)}
.hw-prac{padding:0 18px 16px}

/* хоккеист справа от карточки (сюда встанет видео с поворотом головы за курсором), шайба и лампа гола */
.player-slot{position:fixed;z-index:6;right:clamp(24px,4vw,74px);bottom:clamp(16px,3vh,32px);height:min(46vh,560px);width:min(46vh,560px);border-radius:28px}
.shotpuck{position:fixed;z-index:7;width:26px;height:26px;border-radius:50%;left:0;top:0;opacity:0;
  background:radial-gradient(circle at 34% 30%,#6b7785 0 8%,#2a3440 30%,#111820 62%,#0a0f15);box-shadow:0 0 0 2px #1c2530 inset,0 6px 14px rgba(10,20,30,.35)}
.shotpuck.go{opacity:1;transition:transform .5s cubic-bezier(.35,.1,.6,1),opacity .1s}
.lamp{position:fixed;z-index:9;width:110px;height:128px;transform:translateX(-120%);transition:transform .7s var(--ease);pointer-events:none}
.lamp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.lamp .lit{opacity:0}
.lamp.on .lit{animation:blink .45s steps(1) 5}
.lamp .glow{position:absolute;left:50%;top:32%;width:260%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,60,50,.5),rgba(255,60,50,0) 62%);opacity:0}
.lamp.on .glow{animation:blink .45s steps(1) 5}
.lamp.out{transform:translateX(128px)}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
.flash{position:fixed;z-index:30;left:var(--fx,70%);top:38%;transform:translate(-50%,-50%) scale(.6);font-size:min(16vw,240px);font-weight:900;letter-spacing:-.083em;color:var(--red);opacity:0;pointer-events:none}
.flash.show{animation:flash 1.6s var(--ease) forwards}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1.04)}}

@media (max-width:1200px){:root{--cardw:58vw}}
@media (max-height:800px){.ptitle{padding-top:12px}.ptitle h2{font-size:28px}.q{margin-bottom:12px}.opt{padding:11px 16px}.tile{min-height:118px;padding:14px}}
</style></head>
<body class="arriving">
<main class="stage" id="stage"></main>
<header class="top" style="padding-left:calc(var(--left) + var(--cardw) + 28px)">
  <nav class="crumbs" aria-label="Где ты сейчас"><a href="index.html">Главная</a><i>/</i><a href="school.html" class="nav-out">Spotlight 7</a><i>/</i><a href="module.html?m=1" class="nav-out" id="crumbMod">Модуль 1</a><i>/</i><span id="crumbL">Урок 1a</span><i>/</i><span id="crumbV">Обзор</span></nav>
</header>
<a class="brand" href="index.html" style="position:fixed;z-index:21;top:26px;left:var(--left)">ICE <span>ENGLISH</span></a>

<section class="card" aria-live="polite">
  <div class="chead"><div class="seg" id="tabs"></div><div class="pucks" id="pucks"></div></div>
  <div class="ptitle" id="ptitle"><div class="kicker" id="pk"></div><h2 class="title" id="pt"></h2></div>
  <div class="pbody" id="pb"></div>
  <div class="pfoot" id="pf"></div>
</section>

<div class="player-slot" id="player"><span>Хоккеист: следит за курсором, бросает шайбу</span></div>
<div class="shotpuck" id="puck"></div>
<div class="lamp" id="lamp"><div class="glow"></div><img src="img/lamp_off.webp" alt=""><img class="lit" src="img/lamp_lit.webp" alt=""></div>
<div class="flash" id="flash">ГОЛ!</div>
<div class="veil"></div>

<script src="data.js"></script>
<script src="ice-bg.js"></script>
<script>
(() => {
  const id = new URLSearchParams(location.search).get('l') || '1a';
  const sc = document.createElement('script'); sc.src = `lessons/${ICE_READY[id] ? id : '1a'}.js`; sc.onload = run; document.head.appendChild(sc);
})();
function run() {
  const L = ICE_LESSON, store = ICE_STORE.load();
  const lp = store.lp[L.id] = store.lp[L.id] || {};
  const save = () => ICE_STORE.save(store);
  const $ = id => document.getElementById(id);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const btn = (html, cls, on) => { const b = el('button', cls, html); b.onclick = on; return b; };
  const spacer = () => el('span', 'sp');
  document.title = `ICE ENGLISH · Урок ${L.code}`;
  const bg = IceBG.mount($('stage'), { text: L.code, giantBehind: 2, horizon: .46, seed: 21, giantSize: .34, giantLift: .01,
    onText: t => { const cr = document.querySelector('.card').getBoundingClientRect().right; t.setAttribute('x', (cr + innerWidth) / 2); } });
  const gwrap = () => document.querySelector('.ibg-giant-wrap');
  $('crumbMod').textContent = `Модуль ${L.module}`; $('crumbMod').href = `module.html?m=${L.module}`;
  $('crumbL').textContent = `Урок ${L.code}`;
  store.module = L.module; save();

  /* озвучка — встроенный синтез речи браузера */
  let voice = null;
  const pickVoice = () => { const v = speechSynthesis.getVoices(); voice = v.find(x => /en-GB/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || null; };
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(t) { if (!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t.replace(/’/g, "'")); u.lang = 'en-GB'; u.rate = .9; if (voice) u.voice = voice; speechSynthesis.speak(u); }
  document.addEventListener('click', e => { const s = e.target.closest('[data-say]'); if (s) speak(s.dataset.say); });

  /* ---------- разделы и переходы «по одному льду» ---------- */
  const VIEWS = [['hub', 'Обзор'], ['theory', 'Разобраться'], ['practice', 'Тренироваться'], ['words', 'Слова'], ['hw', 'Домашка']];
  const PAN = { hub: 1.6, theory: .6, practice: -.6, words: -1.6, hw: -2.6 };
  let view = null;
  VIEWS.forEach(([v, name]) => $('tabs').appendChild(btn(name, '', () => go(v))));
  function go(v, arg) {
    const changed = v !== view; view = v;
    [...$('tabs').children].forEach((b, i) => b.classList.toggle('on', VIEWS[i][0] === v));
    $('crumbV').textContent = VIEWS.find(x => x[0] === v)[1];
    $('stage').style.setProperty('--pan', (PAN[v] * innerWidth / 160).toFixed(0) + 'px');

    ({ hub: showHub, theory: () => showTheory(arg || 0), practice: () => startPractice(true), words: showWords, hw: showHw })[v]();
  }

  let busy = null;
  function frame(kicker, title, body, foot, keepPucks) {
    const parts = [$('ptitle'), $('pb'), $('pf')];
    clearTimeout(busy);
    parts.forEach(p => { p.classList.remove('view-in'); p.classList.add('view-out'); });
    busy = setTimeout(() => {
      $('pk').textContent = kicker; $('pt').textContent = title;
      const pb = $('pb'); pb.innerHTML = ''; pb.scrollTop = 0;
      const wrap = el('div'); if (typeof body === 'string') wrap.innerHTML = body; else wrap.appendChild(body);
      pb.appendChild(wrap);
      const pf = $('pf'); pf.innerHTML = ''; foot.forEach(x => pf.appendChild(x));
      parts.forEach(p => { p.classList.remove('view-out'); void p.offsetWidth; p.classList.add('view-in'); });
      wrap.classList.add('view-in');
      if (!keepPucks) renderPucks();
    }, 250);
  }

  /* ---------- общие кусочки ---------- */
  const fbBox = () => el('div', 'fb');
  function feedback(fb, ok, why, tail) {
    fb.className = 'fb show ' + (ok ? 'ok' : 'bad');
    fb.innerHTML = `<b>${ok ? 'Верно!' : 'Не совсем.'}</b>${why || ''}${ok ? '' : (tail === undefined ? ' Попробуй ещё раз.' : tail)}`;
    if (!ok) setTimeout(() => fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 50);
  }
  function choice(options, fb, onRight, onWrong) {
    const box = el('div', 'opts'); let locked = false;
    shuffle(options).forEach(o => {
      const b = btn(o.t, 'opt', () => {
        if (locked) return;
        if (o.ok) { locked = true; b.classList.add('right'); box.querySelectorAll('.opt').forEach(x => x.disabled = true); feedback(fb, true, o.why); onRight && onRight(); }
        else { b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); feedback(fb, false, o.why); onWrong && onWrong(); }
      });
      box.appendChild(b);
    });
    return box;
  }
  const q = text => el('p', 'q', text.replace('___', '<u>&nbsp;</u>'));
  const how = text => el('div', 'how', '👆 ' + text);

  /* перетаскивание мышью и пальцем; короткое нажатие — тоже работает */
  function draggable(chip, { onDrop, onTap }) {
    chip.addEventListener('pointerdown', e => {
      if (chip.classList.contains('pinned') || chip.classList.contains('done')) return;
      e.preventDefault(); const sx = e.clientX, sy = e.clientY; let ghost = null, over = null;
      chip.setPointerCapture(e.pointerId);
      const move = ev => {
        if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) {
          ghost = chip.cloneNode(true); ghost.classList.add('drag-ghost'); document.body.appendChild(ghost); chip.classList.add('lift');
        }
        if (!ghost) return;
        ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
        const t = document.elementFromPoint(ev.clientX, ev.clientY), d = t && t.closest('[data-drop]');
        if (over && over !== d) over.classList.remove('over');
        if (d) d.classList.add('over'); over = d;
      };
      const up = ev => {
        chip.removeEventListener('pointermove', move); chip.removeEventListener('pointerup', up); chip.removeEventListener('pointercancel', up);
        if (over) over.classList.remove('over');
        if (ghost) { ghost.remove(); chip.classList.remove('lift'); const t = document.elementFromPoint(ev.clientX, ev.clientY), d = t && t.closest('[data-drop]'); if (d) onDrop(d); }
        else onTap();
      };
      chip.addEventListener('pointermove', move); chip.addEventListener('pointerup', up); chip.addEventListener('pointercancel', up);
    });
  }

  /* ---------- ОБЗОР УРОКА ---------- */
  function showHub() {
    const st = {
      theory: lp.theory ? 'Пройдено' : `${L.theory.length} коротких карточек`,
      practice: lp.best != null ? `Лучший результат: ${lp.best} из ${L.tasks.length}` : `${L.tasks.length} заданий и бросок`,
      words: lp.words ? 'Пройдено' : `${L.words.length} слов урока`,
      hw: lp.hw ? 'Открывал' : L.homework.map(h => h.ex.split(',')[0]).join(', ')
    };
    const rec = !lp.theory ? 'theory' : lp.best == null || !store.done[L.id] ? 'practice' : !lp.words ? 'words' : 'hw';
    const T = [['theory', 'Шаг 1', 'Разобраться', 'Правило простыми словами, примеры из учебника'],

               ['words', 'Шаг 3', 'Слова', 'Карточки слов урока с озвучкой и проверкой'],
               ['hw', 'Когда задали', 'Домашка', 'Подсказки к упражнениям учебника, без готовых ответов']];
    const body = el('div');
    body.appendChild(el('p', 'meta', `${L.ru}. Примерно ${L.minutes} минут. Учебник: стр. ${L.pages} — если есть под рукой, но можно и без него.`));
    body.appendChild(el('div', 'kicker', 'Что научишься'));
    const ul = el('ul', 'learn'); L.learn.forEach(x => ul.appendChild(el('li', '', x))); ul.style.marginTop = '8px'; body.appendChild(ul);
    const tiles = el('div', 'tiles');
    T.forEach(([v, k, b, s]) => {
      const t = btn(`<span class="k">${k}</span><b>${b}</b><span>${s}</span><span class="st">${st[v]}</span>${v === rec ? '<span class="badge">Начни здесь</span>' : ''}`, 'tile' + (v === rec ? ' rec' : ''), () => go(v));
      tiles.appendChild(t);
    });
    body.appendChild(tiles);
    frame(`Модуль ${L.module} / Урок ${L.code}`, L.en, body, [btn('‹ К маршруту модуля', 'go light', () => leave(`module.html?m=${L.module}`)), spacer(), btn(`${T.find(x => x[0] === rec)[2]} <span>↗</span>`, 'go', () => go(rec))]);
    moveTo(0, true); resetGoal();

  /* ---------- РАЗОБРАТЬСЯ ---------- */
  function showTheory(i) {
    const c = L.theory[i];
    const body = el('div', '', c.html);
    const ck = el('div', 'check', `<span class="kicker">Проверь себя</span><p>${c.check.q.replace('___', '<u>&nbsp;</u>')}</p>`);
    const fb = fbBox();
    const last = i === L.theory.length - 1;
    const next = btn(last ? 'К тренировке <span>↗</span>' : 'Дальше <span>↗</span>', 'go', () => { if (last) { lp.theory = true; save(); go('practice'); } else showTheory(i + 1); });
    next.disabled = true;
    ck.appendChild(choice(c.check.options, fb, () => next.disabled = false)); ck.appendChild(fb); body.appendChild(ck);
    const prev = btn('‹ Назад', 'go light', () => i ? showTheory(i - 1) : go('hub'));
    const skip = btn('Пропустить вопрос', 'go light', () => next.disabled = false); skip.style.opacity = '.7';
    $('stage').style.setProperty('--pan', ((PAN.theory - i * .25) * innerWidth / 160).toFixed(0) + 'px');
    frame(`Разобраться, ${i + 1} из ${L.theory.length}`, c.title, body, [prev, spacer(), skip, next]);
  }

  /* ---------- ТРЕНИРОВАТЬСЯ ---------- */
  let queue = [], qi = 0, round = 1, first = {}, solved = 0;
  function startPractice(fresh) {
    if (fresh) { queue = L.tasks.map((_, i) => i); first = {}; round = 1; }
    qi = 0; solved = 0; moveTo(0, true); resetGoal(); showTask();
  }
  function markResult(idx, ok) { if (!(idx in first)) first[idx] = ok; renderPucks(); }
  function showTask() {
    const idx = queue[qi], t = L.tasks[idx], fb = fbBox();
    const next = btn(qi < queue.length - 1 ? 'Следующее задание <span>↗</span>' : 'Бросок по воротам <span>↗</span>', 'go', () => { if (qi < queue.length - 1) { qi++; showTask(); } else shoot(); });
    next.disabled = true;
    const right = () => { markResult(idx, true); solved++; moveTo(solved / queue.length); next.disabled = false; };
    const wrong = () => markResult(idx, false);
    const body = el('div'); body.appendChild(RENDER[t.type](t, fb, right, wrong, idx)); body.appendChild(fb);
    $('stage').style.setProperty('--pan', ((PAN.practice - qi * .08) * innerWidth / 160).toFixed(0) + 'px');
    frame(`${round > 1 ? 'Работа над ошибками' : 'Тренироваться'}, задание ${qi + 1} из ${queue.length}`, t.prompt, body, [btn('‹ Обзор урока', 'go light', () => go('hub')), spacer(), next]);
  }
  const RENDER = {
    choice(t, fb, right, wrong) { const d = el('div'); d.appendChild(q(t.text)); d.appendChild(choice(t.options, fb, right, wrong)); return d; },
    listen(t, fb, right, wrong) {
      const d = el('div'), has = 'speechSynthesis' in window;
      const p = btn('🔊 Послушать ещё раз', 'play', () => speak(t.say)); if (!has) { p.textContent = 'Озвучка в этом браузере недоступна'; p.disabled = true; }
      d.append(p, choice(t.options, fb, right, wrong)); setTimeout(() => speak(t.say), 500); return d;
    },
    sort(t, fb, right, wrong) {
      const d = el('div'); d.appendChild(how('Перетащи слово в нужную корзину. Или нажми на слово, а потом на корзину.'));
      const pool = el('div', 'pool'); const bs = el('div', 'baskets'); let picked = null, left = t.items.length;
      const place = (chip, it, b) => {
        if (it.g === +b.dataset.g) {
          b.querySelector('.in').appendChild(el('span', '', it.t)); chip.remove(); picked = null; left--; fb.className = 'fb';
          if (!left) { feedback(fb, true, 'Все подсказки на своих местах.'); right(); }
        } else { chip.classList.remove('bad', 'picked'); void chip.offsetWidth; chip.classList.add('bad'); picked = null; feedback(fb, false, it.why); wrong(); }
      };
      t.groups.forEach((g, gi) => {
        const b = el('button', 'basket', `<span class="kicker">${g}</span><div class="in"></div>`); b.dataset.drop = 'basket'; b.dataset.g = gi;
        b.onclick = () => { if (picked) place(picked.chip, picked.it, b); else { fb.className = 'fb show bad'; fb.innerHTML = '<b>Сначала выбери слово.</b>Перетащи его сюда или нажми на слово, а потом на корзину.'; } };
        bs.appendChild(b);
      });
      shuffle(t.items).forEach(it => {
        const c = el('span', 'chip', it.t);
        draggable(c, { onDrop: dz => { if (dz.dataset.drop === 'basket') place(c, it, dz); },
                       onTap: () => { pool.querySelectorAll('.chip').forEach(x => x.classList.remove('picked')); c.classList.add('picked'); c.classList.remove('bad'); picked = { chip: c, it }; } });
        pool.appendChild(c);
      });
      d.append(pool, bs); return d;
    },
    build(t, fb, right, wrong) {
      const ans = t.answer.split(' '), N = ans.length, d = el('div');
      d.appendChild(how('Перетащи слова в ячейки по порядку. Слова можно менять местами. Нажатие ставит слово в первую свободную ячейку.'));
      d.appendChild(el('p', 'meta', `По-русски: ${t.hint}`));
      const slots = el('div', 'slots'), pool = el('div', 'pool'); pool.dataset.drop = 'pool';
      const S = []; for (let i = 0; i < N; i++) { const s = el('div', 'slot'); s.dataset.drop = 'slot'; s.dataset.i = i; slots.appendChild(s); S.push(s); }
      const helpers = el('div', 'helpers'); let tries = 0, finished = false;
      const where = c => c.parentNode && c.parentNode.classList.contains('slot') ? c.parentNode : pool;
      const sync = () => { S.forEach(s => s.classList.toggle('filled', !!s.firstChild)); check.disabled = finished || S.some(s => !s.firstChild); };
      const moveChip = (c, target) => {
        if (finished) return;
        const from = where(c);
        if (target === pool) pool.appendChild(c);
        else if (target.classList.contains('slot')) {
          const occ = target.firstChild;
          if (occ === c) return;
          if (occ && occ.classList.contains('pinned')) return;
          if (occ) (from === pool ? pool : from).appendChild(occ);
          target.appendChild(c);
        }
        fb.className = 'fb'; sync();
      };
      const chips = shuffle(t.words).map(w => {
        const c = el('span', 'chip', w);
        draggable(c, { onDrop: dz => moveChip(c, dz.dataset.drop === 'pool' ? pool : dz),
                       onTap: () => { if (where(c) === pool) { const e = S.find(s => !s.firstChild); if (e) moveChip(c, e); } else moveChip(c, pool); } });
        pool.appendChild(c); return c;
      });
      const said = () => S.map(s => s.firstChild ? s.firstChild.textContent : '').join(' ');
      const norm = s => s.toLowerCase().replace(/[.!?]/g, '').trim();
      const check = btn('Проверить', 'go', () => {
        if ([t.answer, ...(t.alt || [])].some(a => norm(a) === norm(said()))) { done(true); return; }
        tries++; feedback(fb, false, t.why, tries === 1 ? ' Нажми «Подсказка», если нужно.' : ' Можно взять ещё подсказку или посмотреть ответ.'); wrong();
        if (tries === 1) helpers.appendChild(btn('Подсказка: поставить одно слово', 'go light', hint));
        if (tries === 2) helpers.appendChild(btn('Показать ответ', 'go light', () => { ans.forEach((w, i) => put(i)); done(false); }));
      });
      function put(i) {   // поставить правильное слово в ячейку i и закрепить
        const s = S[i]; if (s.firstChild && s.firstChild.textContent === ans[i]) { s.firstChild.classList.add('pinned'); return; }
        const c = chips.find(x => x.textContent === ans[i] && !x.classList.contains('pinned') && !(where(x) !== pool && ans[+where(x).dataset.i] === x.textContent && x.classList.contains('pinned')));
        const from = where(c), occ = s.firstChild;
        if (occ) (from === pool ? pool : from).appendChild(occ);
        s.appendChild(c); c.classList.add('pinned'); sync();
      }
      function hint() { const i = S.findIndex((s, k) => !s.firstChild || s.firstChild.textContent !== ans[k] || !s.firstChild.classList.contains('pinned')); if (i >= 0) put(i); fb.className = 'fb'; }
      function done(ok) {
        finished = true; S.forEach(s => s.firstChild && s.firstChild.classList.add('pinned')); helpers.innerHTML = ''; check.remove();
        if (ok) { feedback(fb, true, `${t.answer}.`); right(); }
        else { fb.className = 'fb show ok'; fb.innerHTML = `<b>Вот как правильно:</b>${t.answer}. ${t.why}`; right(); }
      }
      check.disabled = true;
      const row = el('div', 'helpers'); row.appendChild(check);
      d.append(slots, pool, row, helpers); return d;
    },
    error(t, fb, right, wrong) {
      const d = el('div'); d.appendChild(how('Нажми на слово, в котором ошибка.')); const box = el('div', 'tokens'); let done = false;
      t.tokens.forEach((w, i) => {
        const c = btn(w, 'chip', () => {
          if (done) return;
          if (t.bad.includes(i)) { done = true; t.bad.forEach(k => box.children[k].classList.add('good')); feedback(fb, true, `${t.why}<br>Правильно: <i>${t.fix}</i>`); right(); }
          else { c.classList.remove('bad'); void c.offsetWidth; c.classList.add('bad'); feedback(fb, false, t.miss); wrong(); }
        });
        box.appendChild(c);
      });
      d.appendChild(box); return d;
    },
    match(t, fb, right, wrong) {
      const d = el('div'); d.appendChild(how('Нажми на выражение слева, потом на его перевод справа.'));
      const cols = el('div', 'cols'), A = el('div'), B = el('div'); let pick = null, left = t.pairs.length;
      shuffle(t.pairs).forEach(p => { const c = btn(p[0], 'chip', () => { if (c.classList.contains('done')) return; A.querySelectorAll('.chip').forEach(x => x.classList.remove('picked')); c.classList.add('picked'); pick = { el: c, p }; }); A.appendChild(c); });
      shuffle(t.pairs).forEach(p => {
        const c = btn(p[1], 'chip', () => {
          if (c.classList.contains('done')) return;
          if (!pick) { fb.className = 'fb show bad'; fb.innerHTML = '<b>Сначала выбери выражение слева.</b>Потом нажми на его перевод справа.'; return; }
          if (pick.p[1] === p[1]) { [pick.el, c].forEach(x => { x.classList.remove('picked'); x.classList.add('done'); }); pick = null; left--; fb.className = 'fb'; if (!left) { feedback(fb, true, 'Все пары собраны.'); right(); } }
          else { c.classList.remove('bad'); void c.offsetWidth; c.classList.add('bad'); feedback(fb, false, `«${pick.p[0]}» — это не «${p[1]}». ${t.why}`); wrong(); }
        });
        B.appendChild(c);
      });
      cols.append(A, B); d.appendChild(cols); return d;
    }
  };
  function renderPucks() {
    const box = $('pucks');
    if (view !== 'practice') { box.innerHTML = ''; return; }
    box.innerHTML = queue.map((idx, k) => `<i class="${idx in first ? (first[idx] ? 'ok' : 'err') : ''} ${k === qi ? 'now' : ''}"></i>`).join('');
  }

  /* ---------- СЛОВА ---------- */
  function showWords() {

  }
  function wordQuiz(i, score, set) {

      frame('Слова урока', `${score} из ${set.length}`, `<p>${score === set.length ? 'Все слова знаешь.' : 'Ещё раз пролистай карточки, чтобы запомнить слова, где были ошибки.'}</p>`,

    }

    const next = btn(i < set.length - 1 ? 'Дальше <span>↗</span>' : 'Результат <span>↗</span>', 'go', () => wordQuiz(i + 1, score + (firstTry ? 1 : 0), set)); next.disabled = true;
    body.appendChild(choice([{ t: ru, ok: true, why: `${en} — ${ru}.` }, ...wrongs.map(w => ({ t: w[1], why: `«${w[1]}» — это ${w[0]}.` }))], fb, () => next.disabled = false, () => firstTry = false));
    body.appendChild(fb);
    frame(`Проверь себя, ${i + 1} из ${set.length}`, 'Выбери перевод', body, [spacer(), next]);
    setTimeout(() => speak(en), 450);
  }

  /* ---------- ДОМАШКА ---------- */

    const body = el('div'); body.appendChild(el('p', 'meta', 'Здесь нет готовых ответов: подсказка показывает, где искать и какое правило нужно. Сначала попробуй сам, подсказку открывай, если застрял.'));

      }

    frame('Домашка', `Помощь с упражнениями, стр. ${L.pages}`, body, [btn('‹ Обзор урока', 'go light', () => go('hub')), spacer()]);
  }

  /* перевод по кускам: словарик к каждому куску, подсказка, своё поле; готового перевода нет */
  function translateBox(h, hi) {
    const wrap = el('div', 'hw-items'), key = L.id + ':' + hi, saved = lp.tr[key] || [];
    const all = el('div', 'tr-all');
    const update = () => { all.innerHTML = `<span class="kicker">Мой перевод целиком</span><p>${saved.filter(Boolean).join(' ') || '<i>Здесь соберётся твой перевод.</i>'}</p>`; };
    h.chunks.forEach((c, ci) => {
      const row = el('div', 'hw-item tr-chunk');
      row.appendChild(el('p', 'tr-en', `<span class="tr-n">${ci + 1}</span> <span data-say="${c.en.replace(/["…]/g, '')}" style="cursor:pointer">${c.en}</span>`));
      const gl = el('div', 'gloss'); c.gloss.forEach(([w, r]) => gl.appendChild(el('span', '', `<b data-say="${w}">${w}</b> ${r}`))); row.appendChild(gl);
      const ta = el('textarea', 'tr-in'); ta.rows = 2; ta.placeholder = 'Напиши свой перевод этого куска'; ta.value = saved[ci] || '';
      ta.oninput = () => { saved[ci] = ta.value.trim(); lp.tr[key] = saved; save(); update(); };
      row.appendChild(ta);
      row.appendChild(btn('Подсказка', '', () => row.classList.toggle('open'))); row.appendChild(el('div', 'h', c.hint));
      wrap.appendChild(row);
    });
    update(); wrap.appendChild(all);
    const cl = el('div', 'checklist', '<span class="kicker">Проверь себя</span>');
    h.checklist.forEach(t => { const l = el('label', '', `<input type="checkbox"> ${t}`); cl.appendChild(l); });
    wrap.appendChild(cl);
    return wrap;
  }
  /* свои предложения с used to: сайт не знает, правда ли это, но проверяет форму */
  function writeBox(h, hi) {
    const wrap = el('div', 'hw-items'), key = L.id + ':' + hi;
    wrap.appendChild(el('p', '', '<b>Слова из учебника:</b> ' + h.phrases.map(p => `<span class="f">${p}</span>`).join(' ')));
    const ta = el('textarea', 'tr-in'); ta.rows = 5; ta.placeholder = 'When I was six, I used to …\nWhen I was six, I didn’t use to …'; ta.value = lp.wr[key] || '';
    const out = el('div', 'wr-out');
    const check = () => {
      lp.wr[key] = ta.value; save();
      const lines = ta.value.split(/\n+/).map(x => x.trim()).filter(Boolean);
      out.innerHTML = lines.map(t => {
        const l = t.toLowerCase().replace(/’/g, "'"); let msg = '', ok = false;
        if (/didn'?t used to|did not used to/.test(l)) msg = 'После didn’t пиши use to — без -d.';
        else if (/used to \w+ing\b/.test(l) && !/used to (bring|sing|swing)\b/.test(l)) msg = 'После used to глагол без -ing: used to read.';
        else if (/(^|[^d] |^i )use to/.test(l) && !/didn'?t use to|did not use to|did .* use to/.test(l)) msg = 'В утвердительном предложении пиши used to, с -d.';
        else if (/(used to|use to) \w+/.test(l)) ok = true;
        else msg = 'Не вижу used to / didn’t use to. Пример: When I was six, I used to watch cartoons.';
        return `<p class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '!'} ${t}${msg ? `<small>${msg}</small>` : ''}</p>`;
      }).join('');
    };
    ta.oninput = check; check();
    wrap.append(ta, out);
    return wrap;
  }

  /* ---------- лёд: игрок едет по красной линии к воротам ---------- */
  /* бросок: шайба улетает за край экрана, из-за карточки выезжает лампа, мигает и уезжает обратно */
  const player = $('player'), puck = $('puck'), lamp = $('lamp');
  let pos = 0;
  function layoutRink() {
    const c = document.querySelector('.card').getBoundingClientRect();
    document.documentElement.style.setProperty('--fx', ((c.right + innerWidth) / 2) + 'px');
    lamp.style.left = (c.right - 110) + 'px'; lamp.style.top = (c.top + c.height * .22) + 'px';
  }
  function moveTo(f) { pos = f; }
  function resetGoal() { lamp.classList.remove('out', 'on'); }
  addEventListener('resize', layoutRink);
  function shoot() {
    const got = queue.filter(i => first[i]).length, need = Math.ceil(queue.length * .8), win = got >= need;
    frame('Бросок', 'Шайба летит…', el('div'), [], true);
    const pr = player.getBoundingClientRect();
    const x0 = pr.left + pr.width * .55, y0 = pr.bottom - pr.height * .12;
    puck.classList.remove('go'); puck.style.transform = `translate(${x0}px, ${y0}px) scale(.8)`;
    setTimeout(() => {
      puck.classList.add('go');
      puck.style.transform = win ? `translate(${innerWidth + 80}px, ${y0 - innerHeight * .28}px) scale(.5)` : `translate(${innerWidth + 80}px, ${y0 + 40}px) scale(.5)`;
      if (win) {
        store.done[L.id] = true;
        setTimeout(() => { lamp.classList.add('out'); setTimeout(() => lamp.classList.add('on'), 450);
          const f = $('flash'); f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
          setTimeout(() => lamp.classList.remove('out', 'on'), 3000); }, 380);
      }
      if (round === 1) lp.best = Math.max(lp.best || 0, got);
      save();
      setTimeout(() => { puck.classList.remove('go'); showResult(got, need, win); }, win ? 1500 : 900);
    }, 250);
  }
  function showResult(got, need, win) {
    const errs = queue.filter(i => !first[i]);
    const list = errs.length ? `<p class="note"><b>Где были ошибки:</b></p><ul class="errs">${errs.map(i => `<li>${L.tasks[i].prompt}${L.tasks[i].text ? ': ' + L.tasks[i].text.replace('___', '…') : ''}</li>`).join('')}</ul>` : '';
    const body = `<div class="score">${got}<small> из ${queue.length} с первой попытки</small></div>
      <p>${win ? (errs.length ? 'Гол! Урок пройден, точка на маршруте стала красной. Задания с ошибками можно перерешать.' : 'Гол! Ни одной ошибки — урок пройден, точка на маршруте стала красной.')
               : `Штанга! Чтобы забить, нужно ${need} из ${queue.length} с первой попытки. Перереши задания с ошибками — и бросай снова.`}</p>${list}`;
    const foot = [];
    if (errs.length) foot.push(btn('Перерешать ошибки <span>↗</span>', win ? 'go light' : 'go', () => { queue = errs; first = {}; round++; startPractice(false); }));
    foot.push(spacer());
    foot.push(btn('Обзор', 'go light', () => go('hub')));
    if (win) foot.push(btn('К маршруту <span>↗</span>', 'go', () => leave(`module.html?m=${L.module}`)));
    frame('Результат', win ? 'Гол!' : 'Штанга!', body, foot, true);
  }

  function leave(href) { document.body.classList.add('leaving'); setTimeout(() => location.assign(href), 650); }
  document.querySelectorAll('.nav-out').forEach(a => a.onclick = e => { e.preventDefault(); leave(a.href); });

  layoutRink();
  const startView = new URLSearchParams(location.search).get('v');
  go(VIEWS.some(v => v[0] === startView) ? startView : 'hub');
  requestAnimationFrame(() => setTimeout(() => { document.body.classList.add('ready'); document.body.classList.remove('arriving'); layoutRink(); }, 60));
  setTimeout(layoutRink, 1000);
}
</script>
</body></html>
