<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ICE ENGLISH · Школа · Spotlight 7</title>
<link rel="stylesheet" href="ice.css">
<style>
.scene{--zoom:1.07}
body.from-home .scene{--zoom:1.2}
body.from-home.ready .scene{--zoom:1.07}
.giant.num{left:50%;bottom:67.5%;font-size:33cqh;transform:translate(calc(-50% + var(--px,0%)),var(--y,0%));opacity:var(--o,1);
  transition:transform 1.1s var(--ease),opacity .8s ease}
.giant.num.out{--y:55%;--o:0;transition:transform .7s cubic-bezier(.6,0,.8,.4),opacity .6s ease}
.giant.num.pre{--y:60%;--o:0;transition:none}
.haze{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(90deg,rgba(239,245,250,.55) 0%,rgba(239,245,250,.3) 28%,rgba(239,245,250,0) 48%)}

.info{position:fixed;z-index:10;left:clamp(24px,5vw,74px);top:clamp(104px,17vh,190px);width:min(44vw,600px)}
.info h1{font-size:clamp(54px,6.4vw,112px);margin:16px 0 12px}
.info .title-2{font-size:clamp(20px,2vw,32px);margin:0 0 24px;text-shadow:var(--glow)}
.facts{display:grid;gap:12px;margin:0 0 28px;font-size:15px;line-height:1.45;color:var(--ink);font-weight:500;max-width:460px;text-shadow:var(--glow)}
.facts .kicker{display:block;margin-bottom:4px;color:var(--ink-2)}
.info > .swap > .kicker{color:var(--ink-2);text-shadow:var(--glow)}
.bar{height:5px;border-radius:5px;background:rgba(36,55,77,.15);overflow:hidden;max-width:300px;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--red);border-radius:5px;transition:width .8s var(--ease)}
.swap{transition:opacity .35s ease,transform .5s var(--ease)}
.swap.hide{opacity:0;transform:translateY(10px)}

.dock{position:fixed;z-index:10;left:clamp(24px,5vw,74px);right:clamp(24px,5vw,74px);bottom:clamp(18px,3vh,32px)}
.dock-head{display:flex;align-items:center;gap:14px;margin:0 0 12px}
.dock-head .kicker{color:var(--ink);text-shadow:var(--glow)}
.dock-head .line{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.9),rgba(255,255,255,0))}
.dock-head small{font-size:12px;color:var(--ink-2);text-shadow:var(--glow)}
.arrow{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.7);cursor:pointer;font-size:18px;line-height:1;display:grid;place-items:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.arrow:hover{background:#fff}
.arrow:disabled{opacity:.4;cursor:default}
.rail{display:grid;grid-template-columns:repeat(10,1fr);gap:10px;align-items:end}
.tile{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;padding:14px 14px 15px;min-height:104px;cursor:pointer;
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 30px rgba(20,44,70,.16);
  display:flex;flex-direction:column;justify-content:space-between;gap:8px;
  transition:transform .45s var(--ease),background .3s,box-shadow .3s,opacity .6s ease;opacity:0;transform:translateY(30px)}
body.ready .tile{opacity:1;transform:none;transition-delay:calc(var(--i) * 45ms + .2s),0s,0s,calc(var(--i) * 45ms + .2s)}
.tile:hover{background:var(--glass-strong)}
.tile .n{font-weight:900;letter-spacing:-.06em;font-size:30px;line-height:.9;color:var(--ink)}
.tile .t{font-size:13px;line-height:1.25;color:var(--ink-2);font-weight:600}
body.ready .tile.on{transform:translateY(-14px);background:rgba(255,255,255,.95);box-shadow:0 20px 44px rgba(20,44,70,.24);transition-delay:0s}
.tile.on::before{content:"";position:absolute;left:14px;right:14px;top:-1px;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
.tile .ok{position:absolute;right:10px;top:10px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;display:grid;place-items:center}

.player-slot{right:clamp(24px,5vw,74px);bottom:calc(clamp(18px,3vh,32px) + 175px);height:38vh;width:57vh}

body.opening .scene{--zoom:1.45}
body.opening .info,body.opening .dock,body.opening .player-slot{opacity:0;transition:opacity .4s}

@media (max-width:1100px){
  .rail{grid-template-columns:repeat(5,1fr)}
  .tile{min-height:80px;padding:12px}
  .info{top:14vh;width:min(50vw,520px)}
  .player-slot{bottom:calc(clamp(18px,3vh,32px) + 255px);height:30vh;width:45vh;right:3vw}
}
</style></head>
<body class="arriving">
<script>if (/from=home/.test(location.search)) document.body.classList.add('from-home');</script>
<div class="entry" aria-hidden="true"><strong>SCHOOL</strong></div>
<main class="stage">
  <div class="scene" id="scene">
    <img src="img/modules_sky.webp" alt="">
    <div class="giant num pre" id="numA">01</div>
    <div class="giant num pre" id="numB">02</div>
    <img src="img/modules_fg.webp" alt="">
  </div>
</main>
<div class="haze"></div>
<div class="player-slot" aria-hidden="true"><span>Место для хоккеиста: поворот и торможение</span></div>

<header class="top">
  <a class="brand" href="index.html">ICE <span>ENGLISH</span></a>
  <nav class="crumbs" aria-label="Где ты сейчас"><a href="index.html">Главная</a><i>/</i><span>Школа</span><i>/</i><span>7 класс, Spotlight 7</span></nav>
</header>

<section class="info" aria-live="polite">
  <div class="swap" id="swap">
    <div class="kicker" id="count">Модуль 01 / 10</div>
    <h1 class="title" id="title">Lifestyles</h1>
    <p class="title-2" id="ru">Образ жизни</p>
    <div class="facts">
      <div><span class="kicker">Грамматика</span><span id="gram"></span></div>
      <div><span class="kicker">В модуле</span><span id="meta"></span><div class="bar"><i id="bar"></i></div></div>
    </div>
  </div>
  <a class="go" id="open" href="module.html?m=1"><span id="openText">Открыть модуль</span> <span>↗</span></a>
</section>

<section class="dock" aria-label="Модули учебника">
  <div class="dock-head">
    <span class="kicker">Модули учебника</span><span class="line"></span>
    <small>колесо мыши или стрелки</small>
    <button class="arrow" id="prev" aria-label="Предыдущий модуль">‹</button>
    <button class="arrow" id="next" aria-label="Следующий модуль">›</button>
  </div>
  <nav class="rail" id="rail"></nav>
</section>
<div class="veil"></div>

<script src="data.js"></script>
<script>
(() => {
  const B = ICE_BOOK, store = ICE_STORE.load();
  const $ = id => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  let cur = Math.min(10, Math.max(1, +(qs.get('m') || store.module || 1)));
  const pad = n => String(n).padStart(2, '0');
  const doneIn = m => m.lessons.filter(l => store.done[l.id]).length;

  B.forEach((m, i) => {
    const b = document.createElement('button');
    b.className = 'tile'; b.dataset.n = m.n; b.style.setProperty('--i', i);
    b.innerHTML = `<span class="n">${m.n}</span><span class="t">${m.en}</span>${doneIn(m) === m.lessons.length ? '<span class="ok">✓</span>' : ''}`;
    b.setAttribute('aria-label', `Модуль ${m.n}: ${m.en}, ${m.ru}`);
    b.onclick = () => (m.n === cur ? open() : go(m.n));
    $('rail').appendChild(b);
  });

  let front = $('numA'), back = $('numB');
  const px = () => (((cur - 1) / 9) * 12 - 6).toFixed(1) + '%';
  function fill() {
    const m = B[cur - 1], d = doneIn(m);
    $('count').textContent = `Модуль ${pad(m.n)} / 10`;
    $('title').textContent = m.en;
    $('ru').textContent = m.ru;
    $('gram').textContent = m.grammar;
    $('meta').textContent = `${m.lessons.length} уроков, учебник стр. ${m.pages}. Пройдено ${d} из ${m.lessons.length}`;
    $('bar').style.width = (d / m.lessons.length * 100) + '%';
    $('open').href = `module.html?m=${m.n}`;
    $('openText').textContent = d ? 'Продолжить модуль' : 'Открыть модуль';
    $('prev').disabled = cur === 1; $('next').disabled = cur === 10;
  }
  function paint(first) {
    [...$('rail').children].forEach(t => t.classList.toggle('on', +t.dataset.n === cur));
    $('scene').style.setProperty('--pan', (2 - (cur - 1) / 9 * 4).toFixed(2) + '%');
    if (first) { fill(); front.textContent = pad(cur); front.style.setProperty('--px', px()); return; }
    const sw = $('swap'); sw.classList.add('hide');
    clearTimeout(sw.t); sw.t = setTimeout(() => { fill(); sw.classList.remove('hide'); }, 300);
    front.classList.add('out');
    back.textContent = pad(cur); back.style.setProperty('--px', px());
    back.classList.add('pre'); back.classList.remove('out');
    void back.offsetWidth;
    const rising = back;
    clearTimeout(rising.t); rising.t = setTimeout(() => rising.classList.remove('pre'), 260);
    [front, back] = [back, front];
    store.module = cur; ICE_STORE.save(store);
  }
  function go(n) { if (n < 1 || n > 10 || n === cur) return; cur = n; paint(false); }
  function open() {
    document.body.classList.add('opening');
    setTimeout(() => document.body.classList.add('leaving'), 350);
    setTimeout(() => location.assign(`module.html?m=${cur}`), 900);
  }
  $('open').onclick = e => { e.preventDefault(); open(); };
  $('prev').onclick = () => go(cur - 1);
  $('next').onclick = () => go(cur + 1);

  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(cur + 1);
    else if (e.key === 'ArrowLeft') go(cur - 1);
    else if (e.key === 'Enter' && document.activeElement === document.body) open();
  });
  let acc = 0, lock = 0;
  addEventListener('wheel', e => {
    const now = Date.now(); if (now < lock) return;
    acc += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(acc) > 60) { go(cur + Math.sign(acc)); acc = 0; lock = now + 700; }
  }, { passive: true });
  let tx = null;
  addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive: true });
  addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(cur - Math.sign(dx)); tx = null; });

  paint(true);
  setTimeout(() => front.classList.remove('pre'), document.body.classList.contains('from-home') ? 650 : 280);
  if (qs.has('from') || qs.has('m')) history.replaceState(null, '', 'school.html');
  requestAnimationFrame(() => setTimeout(() => { document.body.classList.add('ready'); document.body.classList.remove('arriving'); }, 80));
})();
</script>
</body></html>
