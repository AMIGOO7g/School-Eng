<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ICE ENGLISH · Школа · Spotlight 7</title>
<link rel="stylesheet" href="ice.css">
<style>
.stage .ibg-giant-wrap{transform:translateY(0);opacity:1;transition:transform 1.1s var(--ease),opacity .8s ease}
.stage .ibg-giant-wrap.down{transform:translateY(22vh);opacity:0;transition:transform .6s cubic-bezier(.6,0,.8,.4),opacity .5s ease}
.stage .ibg-giant-wrap.pre{transform:translateY(24vh);opacity:0;transition:none}
body.opening .stage{transform:scale(1.08);transition:transform .9s var(--ease)}
.info-top{position:fixed;z-index:10;left:clamp(24px,5vw,74px);top:clamp(96px,19vh,240px);width:min(52vw,820px)}
.info-top h1{font-size:clamp(48px,5.6vw,112px);margin:10px 0 0}
.info-top .kicker{color:var(--ink)}
.info-low{position:fixed;z-index:10;left:clamp(24px,5vw,74px);top:var(--low,420px);width:min(44vw,620px)}
.info-low .title-2{font-size:clamp(20px,2vw,34px);margin:0 0 14px;color:#3f6886}
.facts{display:grid;gap:12px;margin:0 0 24px;font-size:15px;line-height:1.45;color:var(--ink);font-weight:600;max-width:520px}
.facts .kicker{display:block;margin-bottom:4px;color:var(--ink)}
.bar{height:5px;border-radius:5px;background:rgba(36,55,77,.18);overflow:hidden;max-width:300px;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--red);border-radius:5px;transition:width .8s var(--ease)}
.swap{transition:opacity .35s ease,transform .5s var(--ease)}
.swap.hide{opacity:0;transform:translateY(10px)}
@media (min-width:1900px){.facts{font-size:18px}.info-low .go{font-size:15px;padding:18px 28px}}

.dock{position:fixed;z-index:10;left:clamp(24px,5vw,74px);right:clamp(24px,5vw,74px);bottom:clamp(18px,3vh,32px)}
.dock-head{display:flex;align-items:center;gap:14px;margin:0 0 12px}
.dock-head .kicker{color:var(--ink)}
.dock-head .line{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.9),rgba(255,255,255,0))}
.dock-head small{font-size:12px;font-weight:700;color:var(--ink)}
.arrow{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.7);cursor:pointer;font-size:18px;line-height:1;display:grid;place-items:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.arrow:hover{background:#fff}
.arrow:disabled{opacity:.4;cursor:default}
.rail{display:grid;grid-template-columns:repeat(10,1fr);gap:10px;align-items:end}
.tile{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;padding:14px 14px 15px;min-height:104px;cursor:pointer;
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 30px rgba(20,44,70,.16);
  display:flex;flex-direction:column;justify-content:space-between;gap:8px;
  transition:transform .45s var(--ease),background .3s,box-shadow .3s,opacity .6s ease;opacity:0;transform:translateY(30px)}
body.ready .tile{opacity:1;transform:none;transition-delay:calc(var(--i) * 45ms + .2s),0s,0s,calc(var(--i) * 45ms + .2s)}
.tile:hover{background:var(--glass-strong)}
.tile .n{font-weight:900;letter-spacing:-.06em;font-size:30px;line-height:.9;color:var(--ink)}
.tile .t{font-size:13px;line-height:1.25;color:var(--ink-2);font-weight:600}
body.ready .tile.on{transform:translateY(-14px);background:rgba(255,255,255,.95);box-shadow:0 20px 44px rgba(20,44,70,.24);transition-delay:0s}
.tile.on::before{content:"";position:absolute;left:14px;right:14px;top:-1px;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
.pathline{position:absolute;left:0;right:0;top:-14px;height:20px;pointer-events:none;overflow:visible}
.tile .ok{position:absolute;right:10px;top:10px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;display:grid;place-items:center}

.player-slot{right:clamp(24px,5vw,74px);bottom:calc(clamp(18px,3vh,32px) + 175px);height:38vh;width:57vh}

body.opening .info-top,body.opening .info-low,body.opening .dock,body.opening .player-slot{opacity:0;transition:opacity .4s}

@media (max-width:1100px){
  .rail{grid-template-columns:repeat(5,1fr)}
  .info-top h1{font-size:46px}.facts{gap:6px;margin-bottom:14px;font-size:14px}.info-low .title-2{margin-bottom:8px;font-size:20px}
  .tile{min-height:64px;padding:10px 12px}
  .tile .n{font-size:24px}
  .dock-head small{display:none}
  .dock-head{margin-bottom:8px}
  .player-slot{bottom:calc(clamp(18px,3vh,32px) + 255px);height:30vh;width:45vh;right:3vw}
}
</style></head>
<body class="arriving">
<script>if (/from=home/.test(location.search)) document.body.classList.add('from-home');</script>
<div class="entry" aria-hidden="true"><strong>SCHOOL</strong></div>
<main class="stage" id="stage"></main>
<div class="player-slot" aria-hidden="true"><span>Место для хоккеиста: поворот и торможение</span></div>

<header class="top">
  <a class="brand" href="index.html">ICE <span>ENGLISH</span></a>
  <nav class="crumbs" aria-label="Где ты сейчас"><a href="index.html">Главная</a><i>/</i><span>Школа</span><i>/</i><span>7 класс, Spotlight 7</span></nav>
  <a class="continue" id="continue" href="#">Продолжить: <b id="contName">урок 1a</b><i>↗</i></a>
</header>
<div class="coach" id="coach"></div>

<section class="info-top" aria-live="polite">
  <div class="swap" id="swapTop">
    <div class="kicker" id="count">Модуль 01 / 10</div>
    <h1 class="title" id="title">Lifestyles</h1>
  </div>
</section>
<section class="info-low">
  <div class="swap" id="swap">
    <p class="title-2" id="ru">Образ жизни</p>
    <div class="facts">
      <div><span class="kicker">Грамматика</span><span id="gram"></span></div>
      <div><span class="kicker">В модуле</span><span id="meta"></span><div class="bar"><i id="bar"></i></div></div>
    </div>
  </div>
  <a class="go" id="open" href="module.html?m=1"><span id="openText">Открыть модуль</span> <span>↗</span></a>
</section>

<section class="dock" aria-label="Модули учебника">
  <div class="dock-head">
    <span class="kicker">Модули учебника</span><span class="line"></span><button class="ghostbtn" id="asked">Что задали?</button>
    <small>колесо мыши или стрелки</small>
    <button class="arrow" id="prev" aria-label="Предыдущий модуль">‹</button>
    <button class="arrow" id="next" aria-label="Следующий модуль">›</button>
  </div>
  <div style="position:relative"><svg class="pathline" id="pathline"></svg><nav class="rail" id="rail"></nav></div>
</section>
<div class="veil"></div>

<script src="data.js"></script>
<script src="ice-bg.js"></script>
<script>
(() => {
  const B = ICE_BOOK, store = ICE_STORE.load();
  const $ = id => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  let cur = Math.min(10, Math.max(1, +(qs.get('m') || store.module || 1)));
  const pad = n => String(n).padStart(2, '0');
  const doneIn = m => m.lessons.filter(l => store.done[l.id]).length;

  B.forEach((m, i) => {
    const b = document.createElement('button');
    b.className = 'tile'; b.dataset.n = m.n; b.style.setProperty('--i', i);
    b.innerHTML = `<span class="n">${m.n}</span><span class="t">${m.en}</span>${doneIn(m) === m.lessons.length ? '<span class="ok">✓</span>' : ''}`;
    b.setAttribute('aria-label', `Модуль ${m.n}: ${m.en}, ${m.ru}`);
    b.onclick = () => (m.n === cur ? open() : go(m.n));
    $('rail').appendChild(b);
  });

  const bg = IceBG.mount($('stage'), { text: pad(cur), giantX: .5, giantSize: .30, giantBehind: 2, horizon: .44, seed: 3, giantLift: .015 });
  const wrap = () => document.querySelector('.ibg-giant-wrap');
  function fill() {
    const m = B[cur - 1], d = doneIn(m);
    $('count').textContent = `Модуль ${pad(m.n)} / 10`;
    $('title').textContent = m.en;
    $('ru').textContent = m.ru;
    $('gram').textContent = m.grammar;
    $('meta').textContent = `${m.lessons.length} уроков, учебник стр. ${m.pages}. Пройдено ${d} из ${m.lessons.length}`;
    $('bar').style.width = (d / m.lessons.length * 100) + '%';
    $('open').href = `module.html?m=${m.n}`;
    $('openText').textContent = d ? 'Продолжить модуль' : 'Открыть модуль';
    $('prev').disabled = cur === 1; $('next').disabled = cur === 10;
  }
  function paint(first) {
    [...$('rail').children].forEach(t => t.classList.toggle('on', +t.dataset.n === cur));
    drawPath();
    if (first) { fill(); return; }
    const sw = [$('swap'), $('swapTop')]; sw.forEach(x => x.classList.add('hide'));
    clearTimeout(sw[0].t); sw[0].t = setTimeout(() => { fill(); horizon(); sw.forEach(x => x.classList.remove('hide')); }, 300);
    // цифра уходит за горы и поднимается новая
    const w = wrap(); w.classList.add('down'); clearTimeout(w.t);
    w.t = setTimeout(() => { bg.setText(pad(cur)); w.classList.remove('down'); w.classList.add('pre'); void w.getBoundingClientRect(); w.classList.remove('pre'); }, 520);
    store.module = cur; ICE_STORE.save(store);
  }
  // путь по модулям над плитками: пройденное — красная линия, впереди — светлый пунктир, фишка «7» у текущего модуля
  function drawPath() {
    const svg = $('pathline'), tiles = [...$('rail').children]; if (!tiles.length) return;
    const R0 = svg.getBoundingClientRect(), rows = new Set(tiles.map(t => t.offsetTop)).size;
    if (rows > 1) { svg.innerHTML = ''; return; }
    const xs = tiles.map(t => { const r = t.getBoundingClientRect(); return r.left + r.width / 2 - R0.left; });
    const done = B.map(m => doneIn(m) === m.lessons.length), y = 6;
    let h = '';
    for (let i = 0; i < 9; i++) h += `<line x1="${xs[i]}" y1="${y}" x2="${xs[i + 1]}" y2="${y}" stroke="${done[i] ? '#d3262e' : '#ffffff'}" stroke-width="${done[i] ? 3 : 2}" ${done[i] ? '' : 'stroke-dasharray="5 6"'} stroke-linecap="round"/>`;
    xs.forEach((x, i) => { h += `<circle cx="${x}" cy="${y}" r="${i + 1 === cur ? 0 : 4}" fill="${done[i] ? '#d3262e' : '#fff'}" stroke="#24374d" stroke-opacity=".25"/>`; });
    const nx = ICE_NEXT(store).m.n;
    h += `<g transform="translate(${xs[nx - 1]} ${y})"><circle r="11" fill="#d3262e" stroke="#fff" stroke-width="2"/><text y="4" text-anchor="middle" font-size="11" font-weight="900" fill="#fff" font-family="Inter,Arial">7</text></g>`;
    svg.innerHTML = h;
  }
  addEventListener('resize', drawPath);
  function go(n) { if (n < 1 || n > 10 || n === cur) return; cur = n; paint(false); }
  function open() {
    document.body.classList.add('opening');
    setTimeout(() => document.body.classList.add('leaving'), 350);
    setTimeout(() => location.assign(`module.html?m=${cur}`), 900);
  }
  $('open').onclick = e => { e.preventDefault(); open(); };
  $('prev').onclick = () => go(cur - 1);
  $('next').onclick = () => go(cur + 1);

  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(cur + 1);
    else if (e.key === 'ArrowLeft') go(cur - 1);
    else if (e.key === 'Enter' && document.activeElement === document.body) open();
  });
  let acc = 0, lock = 0;
  addEventListener('wheel', e => {
    const now = Date.now(); if (now < lock) return;
    acc += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(acc) > 60) { go(cur + Math.sign(acc)); acc = 0; lock = now + 700; }
  }, { passive: true });
  let tx = null;
  addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive: true });
  addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(cur - Math.sign(dx)); tx = null; });

  // горизонт (начало льда на фото) — заголовок стоит над ним, мелкий текст ниже, на светлом льду
  function horizon() {
    document.documentElement.style.setProperty('--hz', bg.horizon().toFixed(0) + 'px');
    requestAnimationFrame(() => document.documentElement.style.setProperty('--low', (document.querySelector('.info-top').getBoundingClientRect().bottom + 8).toFixed(0) + 'px'));
  }
  horizon(); addEventListener('resize', horizon);

  // «Продолжить»
  // «Что задали?» — номер страницы учебника ведёт в нужный урок
  $('asked').onclick = () => {
    const box = $('coach');
    box.innerHTML = `<div class="coach-card" style="left:50%;top:50%;transform:translate(-50%,-50%)"><span class="kicker">Домашка</span><h3>Что задали?</h3>
      <p>Введи номер страницы из учебника — откроется нужный урок.</p>
      <input id="askPage" type="number" min="5" max="104" placeholder="например, 18" style="width:100%;font:inherit;font-size:20px;font-weight:800;padding:12px 14px;border-radius:14px;border:1px solid rgba(36,55,77,.2);margin-bottom:10px">
      <p id="askRes" style="min-height:22px;margin:0 0 12px"></p>
      <div class="row"><button class="skip">Закрыть</button><span class="sp"></span><button class="go" id="askGo" disabled>Открыть <span>↗</span></button></div></div>`;
    box.classList.add('show');
    const inp = $('askPage'); inp.focus(); let target = null;
    inp.oninput = () => {
      const pg = +inp.value; target = null;
      B.forEach(m => m.lessons.forEach(l => { const [a, b] = l.pages.split('–').map(Number); if (pg >= a && pg <= (b || a)) target = { m, l }; }));
      $('askGo').disabled = !target;
      $('askRes').innerHTML = target ? `Модуль ${target.m.n}, урок <b>${target.l.code} «${target.l.en}»</b>${ICE_READY[target.l.id] ? '' : ' — этот урок пока готовится'}` : (inp.value ? 'Такой страницы нет в уроках модулей' : '');
    };
    inp.onkeydown = e => { if (e.key === 'Enter' && target) $('askGo').click(); };
    box.querySelector('.skip').onclick = () => { box.classList.remove('show'); box.innerHTML = ''; };
    $('askGo').onclick = () => { const href = ICE_READY[target.l.id] ? `lesson.html?l=${target.l.id}&v=hw` : `module.html?m=${target.m.n}&l=${target.l.id}`; document.body.classList.add('leaving'); setTimeout(() => location.assign(href), 550); };
  };

  const nx = ICE_NEXT(store);
  $('contName').textContent = `модуль ${nx.m.n}, урок ${nx.l.code}`;
  $('continue').onclick = e => { e.preventDefault(); document.body.classList.add('leaving'); setTimeout(() => location.assign(nx.href), 550); };

  // три подсказки при первом входе
  const tips = [
    { el: '.dock', k: '1 из 3', h: 'Это модули учебника', p: 'Spotlight 7 разбит на 10 модулей. Листай их колесом мыши, стрелками или нажимай на плитку.' },
    { el: '#open', k: '2 из 3', h: 'Внутри модуля — маршрут уроков', p: 'Открой модуль: на льду красная линия с точками. Каждая точка — урок. Пройденные становятся красными.' },
    { el: '#continue', k: '3 из 3', h: 'Забей гол в каждом уроке', p: 'В уроке разбираешься с правилом, тренируешься и бросаешь по воротам. 8 правильных из 10 с первой попытки — гол. Кнопка «Продолжить» всегда ведёт к следующему уроку.' }
  ];
  function coach(i) {
    const box = $('coach');
    document.querySelectorAll('.coach-target').forEach(x => x.classList.remove('coach-target'));
    if (i >= tips.length) { box.classList.remove('show'); box.innerHTML = ''; store.seen = true; ICE_STORE.save(store); return; }
    const t = tips[i], el = document.querySelector(t.el); el.classList.add('coach-target');
    const r = el.getBoundingClientRect();
    box.innerHTML = `<div class="coach-card"><span class="kicker">Подсказка ${t.k}</span><h3>${t.h}</h3><p>${t.p}</p>
      <div class="row"><button class="skip">Пропустить</button><span class="sp"></span><button class="go">${i < tips.length - 1 ? 'Дальше' : 'Понятно'} <span>↗</span></button></div></div>`;
    const c = box.firstChild, cw = 380, ch = c.offsetHeight || 220;
    let top = r.top - ch - 20, left = Math.min(innerWidth - cw - 20, Math.max(20, r.left));
    if (top < 20) top = r.bottom + 20;
    if (top + ch > innerHeight - 20) { top = Math.max(20, r.top + 20); left = Math.min(innerWidth - cw - 20, r.right + 20); }
    c.style.top = top + 'px'; c.style.left = left + 'px';
    box.classList.add('show');
    c.querySelector('.go').onclick = () => coach(i + 1);
    c.querySelector('.skip').onclick = () => coach(tips.length);
  }
  if (!store.seen) setTimeout(() => coach(0), 1600);

  paint(true);
  wrap().classList.add('pre'); setTimeout(() => wrap().classList.remove('pre'), document.body.classList.contains('from-home') ? 700 : 250);
  if (qs.has('from') || qs.has('m')) history.replaceState(null, '', 'school.html');
  requestAnimationFrame(() => setTimeout(() => { document.body.classList.add('ready'); document.body.classList.remove('arriving'); }, 80));
})();
</script>
</body></html>
