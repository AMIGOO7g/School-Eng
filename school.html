<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ICE ENGLISH · Темы · Spotlight 7</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="ice.css">
<style>
.info{position:fixed;z-index:10;left:clamp(24px,5vw,74px);top:calc(var(--low,46vh) / var(--z));width:min(62vw,980px);display:grid;grid-template-columns:minmax(300px,1fr) minmax(280px,.9fr);gap:10px 40px}
.info .col1 h1{font-size:clamp(44px,5vw,100px);margin:8px 0 6px}
.info .title-2{font-size:clamp(18px,1.7vw,30px);margin:0 0 14px}
.facts{font-size:15px;line-height:1.45;font-weight:600;margin:0 0 18px}
.facts .kicker{display:block;margin-bottom:4px}
.swap{transition:opacity .35s ease,transform .5s var(--ease)}
.swap.hide{opacity:0;transform:translateY(10px)}
.ls{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.ls li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;font-size:14px;font-weight:700;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.55)}
.ls li .c{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;background:#fff}
.ls li.done .c{background:var(--red);color:#fff}
.ls li.now{background:#fff;box-shadow:inset 0 0 0 2px var(--red)}
.ls li small{font-size:11px;color:var(--mute);font-weight:700}
/* красная линия через все модули — как на льду */
.road{position:fixed;z-index:9;left:0;right:0;bottom:0;height:var(--rh,28vh);pointer-events:none}
.road svg{width:100%;height:100%;overflow:visible}
.road .stop{pointer-events:auto;cursor:pointer}
.road .stop:hover circle.b{stroke:#24374d}
.roadhead{position:fixed;z-index:10;left:clamp(24px,5vw,74px);right:clamp(24px,5vw,74px);bottom:calc(var(--rh,28vh) - 26px);display:flex;align-items:center;gap:12px;pointer-events:none}
.roadhead > *{pointer-events:auto}
.roadhead .line{flex:1}
.arrow{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.8);cursor:pointer;font-size:18px;display:grid;place-items:center}
.arrow:disabled{opacity:.4;cursor:default}
.player-slot{right:clamp(24px,5vw,74px);top:calc(var(--low,46vh) - 20px);height:min(36vh,420px);width:min(36vh,420px)}
body.opening .stage{transform:scale(1.06);transition:transform .9s var(--ease)}
body.opening .info,body.opening .road,body.opening .roadhead{opacity:0;transition:opacity .4s}
@media (max-width:1100px),(max-height:800px){.ls li{padding:3px 8px;font-size:13px}.ls li .c{width:24px;height:24px}.ls li span small{display:none}.info .col1 h1{font-size:46px}}
@media (max-width:1250px){.player-slot{display:none}.info{width:auto;right:clamp(24px,5vw,74px)}}
@media (min-width:1900px){.info{zoom:1.12}}
</style></head>
<body class="arriving">
<main class="stage" id="stage"></main>
<div class="player-slot" aria-hidden="true"><span>Место для хоккеиста</span></div>
<section class="info" aria-live="polite">
  <div class="col1 swap" id="s1">
    <div class="kicker" id="count">Модуль 01 из 10</div>
    <h1 class="title" id="title">Lifestyles</h1>
    <p class="title-2" id="ru">Образ жизни</p>
    <div class="facts"><span class="kicker">Грамматика модуля</span><span id="gram"></span></div>
    <a class="go" id="open" href="#"><span id="openText">Открыть модуль</span> <span>↗</span></a>
  </div>
  <div class="swap" id="s2"><span class="kicker" id="lsTitle">Уроки модуля</span><ul class="ls" id="ls"></ul></div>
</section>
<div class="roadhead"><span class="kicker">10 модулей учебника</span><span class="line"></span><small class="kicker" style="letter-spacing:.1em">колесо мыши или стрелки</small><button class="arrow" id="prev">‹</button><button class="arrow" id="next">›</button></div>
<div class="road"><svg id="road"></svg></div>
<div class="coach" id="coach"></div>
<div class="veil"></div>
<script src="data.js"></script><script src="ice-scene.js"></script><script src="ice-ui.js"></script>
<script>
(() => {
  const B = ICE_BOOK, store = ICE_STORE.load(), $ = id => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  let cur = Math.min(10, Math.max(1, +(qs.get('m') || store.module || 1)));
  const pad = n => String(n).padStart(2, '0');
  const doneIn = m => m.lessons.filter(l => store.done[l.id]).length;
  IceUI.header({ active: 'topics', crumbs: [{ t: 'Главная', href: 'index.html' }, { t: 'Spotlight 7', href: 'hub.html' }, { t: 'Темы' }] });
  const sc = IceScene.mount($('stage'), { img: 'modules', text: pad(cur), over: 'SPOTLIGHT 7', x: .5, size: 30, sink: .035 });
  const layout = () => {
    document.documentElement.style.setProperty('--low', Math.max(sc.footPx() + 14, innerHeight * .28) + 'px');
    document.documentElement.style.setProperty('--rh', Math.max(150, innerHeight * .22) + 'px');
    road();
  };
  function fill() {
    const m = B[cur - 1], d = doneIn(m), nx = ICE_NEXT(store);
    $('count').textContent = `Модуль ${pad(m.n)} из 10`;
    $('title').textContent = m.en; $('ru').textContent = m.ru; $('gram').textContent = m.grammar;
    $('openText').textContent = d ? 'Продолжить модуль' : 'Открыть модуль';
    $('lsTitle').textContent = `Уроки модуля, стр. ${m.pages}. Пройдено ${d} из ${m.lessons.length}`;
    $('ls').innerHTML = m.lessons.map(l => `<li class="${store.done[l.id] ? 'done' : ''} ${nx.l.id === l.id ? 'now' : ''}"><span class="c">${l.code}</span><span>${l.en}${l.kind ? ` <small>${l.kind}</small>` : ''}</span><small>${ICE_READY[l.id] ? 'стр. ' + l.pages : 'скоро'}</small></li>`).join('');
    $('prev').disabled = cur === 1; $('next').disabled = cur === 10;
  }
  // дорога модулей: плавная красная кривая с остановками; пройденное — сплошное, впереди — пунктир
  function road() {
    const svg = $('road'), W = innerWidth, H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rh')) || 180;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const L0 = Math.max(40, W * .06), R0 = W - Math.max(40, W * .06), k = Math.max(1, W / 1600);
    const P = B.map((m, i) => { const t = i / 9; return [L0 + t * (R0 - L0), H * (.52 + Math.sin(t * Math.PI * 2.2 + .6) * .2)]; });
    const path = pts => pts.reduce((d, p, i, a) => { if (!i) return `M${p[0]} ${p[1]}`; const q = a[i - 1], cx = (q[0] + p[0]) / 2; return d + ` C${cx} ${q[1]} ${cx} ${p[1]} ${p[0]} ${p[1]}`; }, '');
    let last = -1; B.forEach((m, i) => { if (doneIn(m) === m.lessons.length) last = i; });
    const nx = ICE_NEXT(store).m.n - 1, doneTo = Math.max(last, nx - 1);
    let g = `<path d="${path(P)}" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".55"/>
      <path d="${path(P)}" fill="none" stroke="#24374d" stroke-opacity=".35" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round"/>`;
    if (nx > 0) g += `<path d="${path(P.slice(0, nx + 1))}" fill="none" stroke="#d3262e" stroke-width="7" stroke-linecap="round"/>`;
    B.forEach((m, i) => {
      const [x, y] = P[i], on = i + 1 === cur, done = doneIn(m) === m.lessons.length, r = (on ? 22 : 16) * k;
      g += `<g class="stop" data-n="${m.n}">
        <circle cx="${x}" cy="${y + 3}" r="${r}" fill="#1b2f45" opacity=".12"/>
        <circle class="b" cx="${x}" cy="${y}" r="${r}" fill="${done ? '#d3262e' : on ? '#24374d' : '#ffffff'}" stroke="${on ? '#ffffff' : '#24374d'}" stroke-opacity="${on ? 1 : .2}" stroke-width="${on ? 3 : 1.5}"/>
        <text x="${x}" y="${y + (on ? 7 : 5) * k}" text-anchor="middle" font-family="Inter,Arial" font-weight="900" font-size="${(on ? 18 : 14) * k}" fill="${done || on ? '#fff' : '#24374d'}">${m.n}</text>
        <text x="${x}" y="${y + r + 18 * k}" text-anchor="middle" font-family="Inter,Arial" font-weight="${on ? 800 : 700}" font-size="${(on ? 14 : 12) * k}" fill="#24374d" opacity="${on ? 1 : .75}">${m.en.length > 18 ? m.en.slice(0, 17) + '…' : m.en}</text>
        <circle cx="${x}" cy="${y}" r="30" fill="transparent"/></g>`;
    });
    // фишка «7» — где ты сейчас
    const [tx, ty] = P[nx];
    g += `<g transform="translate(${tx + 18} ${ty - 22})"><circle r="13" fill="#d3262e" stroke="#fff" stroke-width="2.5"/><text y="5" text-anchor="middle" font-family="Inter,Arial" font-weight="900" font-size="13" fill="#fff">7</text></g>`;
    svg.innerHTML = g;
    svg.querySelectorAll('.stop').forEach(s => s.onclick = () => +s.dataset.n === cur ? open() : go(+s.dataset.n));
  }
  function paint(first) {
    road();
    if (first) { fill(); return; }
    [$('s1'), $('s2')].forEach(x => x.classList.add('hide'));
    setTimeout(() => { fill(); [$('s1'), $('s2')].forEach(x => x.classList.remove('hide')); }, 300);
    const g = sc.giant; g.classList.add('down'); clearTimeout(g.t);
    g.t = setTimeout(() => { sc.setText(pad(cur)); g.classList.remove('down'); g.classList.add('pre'); void g.offsetWidth; g.classList.remove('pre'); }, 500);
    store.module = cur; ICE_STORE.save(store);
  }
  function go(n) { if (n < 1 || n > 10 || n === cur) return; cur = n; paint(false); }
  function open() { document.body.classList.add('opening'); setTimeout(() => IceUI.go(`module.html?m=${cur}`), 300); }
  $('open').onclick = e => { e.preventDefault(); open(); };
  $('prev').onclick = () => go(cur - 1); $('next').onclick = () => go(cur + 1);
  addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(cur + 1); else if (e.key === 'ArrowLeft') go(cur - 1); else if (e.key === 'Enter') open(); });
  let acc = 0, lock = 0;
  addEventListener('wheel', e => { const now = Date.now(); if (now < lock) return; acc += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(acc) > 60) { go(cur + Math.sign(acc)); acc = 0; lock = now + 700; } }, { passive: true });
  layout(); addEventListener('resize', layout);
  paint(true);
  sc.giant.classList.add('pre'); setTimeout(() => sc.giant.classList.remove('pre'), 300);
  IceUI.track(); IceUI.ready();
})();
</script>
</body></html>
