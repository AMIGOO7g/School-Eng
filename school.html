<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICE ENGLISH · Сезон</title>
<link rel="stylesheet" href="fonts.css?v=36"><link rel="stylesheet" href="ui2.css?v=42">
<style>
html,body{height:100%;overflow:hidden}
.sc-over{font-size:12px!important;letter-spacing:.32em!important;opacity:.85!important}
.player{position:fixed;z-index:9;pointer-events:none;height:68vh;right:1.2vw;bottom:3vh}
.player img{height:100%;display:block;filter:drop-shadow(0 30px 30px rgba(20,40,64,.2))}
/* колонка контента от левого края, справа место хоккеисту — как в генерации */
.area{position:fixed;z-index:12;left:4.5vw;width:70vw;top:calc(var(--hz,40vh) - clamp(96px,12vh,140px));bottom:4vh;display:flex;flex-direction:column;gap:clamp(12px,2vh,22px)}
.area::before{content:"";position:absolute;z-index:-1;left:-140px;width:min(1100px,80vw);top:-90px;height:320px;border-radius:50%;background:radial-gradient(closest-side,rgba(246,249,252,.95),rgba(246,249,252,.6) 60%,rgba(246,249,252,0))}
.fxs{position:relative}
.fxs::-webkit-scrollbar{display:none}
.fx{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:10px}
.mc{position:relative;border:0;border-radius:18px;padding:12px 10px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 24px rgba(20,44,70,.12);
  display:grid;grid-template-rows:auto 58px 2.6em auto auto;justify-items:center;align-items:center;gap:4px;cursor:pointer;text-align:center;transition:translate .3s var(--ease),box-shadow .3s;animation:cin .6s var(--ease) both;animation-delay:calc(var(--i) * 45ms + .15s)}
@keyframes cin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.mc:hover{translate:0 -4px;box-shadow:0 16px 32px rgba(20,44,70,.18)}
.mc .no{justify-self:start;font-family:var(--head);font-size:14px;color:var(--ink-2)}
.mc .em{height:58px;display:grid;place-items:center}.mc .em img{max-height:56px;max-width:64px}
.mc .nm{font-size:12px;font-weight:800;line-height:1.2;color:var(--ink);align-self:start}
.mc .nm small{display:block;font-weight:600;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.mc .st{font-family:var(--head);font-size:24px;line-height:1}
.mc .tg{font-size:9px;font-weight:900;letter-spacing:.12em;padding:3px 8px;border-radius:999px;color:#fff;background:#2aa860}
.mc.now{background:#fff;box-shadow:0 0 0 2px var(--red),0 16px 34px rgba(211,38,46,.22)}
.mc.now .tg{background:var(--red)}
.mc.later{opacity:.75}.mc.later img{filter:grayscale(.6)}
.mc.sel{translate:0 -6px}
.low{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px}
.panel{position:relative;border-radius:24px;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 16px 38px rgba(20,44,70,.13);padding:clamp(16px,2.4vh,26px) clamp(18px,1.8vw,30px);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.match h2{font-size:clamp(44px,4vw,72px);margin:6px 0 10px}
.vs{display:flex;align-items:center;gap:12px;white-space:nowrap}
.vs .me2,.vs .op{font-family:var(--head);font-size:clamp(17px,1.35vw,22px);color:#fff;padding:7px 14px;border-radius:9px}
.vs .me2{background:linear-gradient(135deg,#e63a42,#b51c24)}.vs .op{background:linear-gradient(135deg,#2c4560,#16263a);overflow:hidden;text-overflow:ellipsis}
.vs .x{flex:none;font-family:var(--head);font-size:clamp(40px,3.4vw,58px);line-height:.8;transform:skewX(-14deg) rotate(-6deg);background:linear-gradient(180deg,#ff6a6f,#d3262e 55%,#8e1218);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.5px #fff;filter:drop-shadow(0 4px 0 #1d3048) drop-shadow(0 8px 14px rgba(20,40,64,.35));padding:0 4px}
.opp{position:relative;flex:1;min-height:56px;display:flex;align-items:center;justify-content:center}
.opp img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:min(240%,560px);opacity:.18;filter:grayscale(.2)}
.opp .bigw{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--head);font-size:clamp(70px,7vw,140px);color:#16263a;opacity:.08;white-space:nowrap;line-height:1}
.vs{justify-content:center}
.opp .on{position:relative;text-align:center;font-family:var(--head);font-size:clamp(22px,2vw,32px);line-height:1;color:var(--ink)}.opp .on small{display:block;font-family:var(--font);font-size:10px;font-weight:800;letter-spacing:.24em;color:var(--mute)}
.mblock{padding-top:12px;border-top:1px solid rgba(31,50,72,.1)}
.mblock h3{font-family:var(--head);font-weight:400;font-size:clamp(18px,1.5vw,24px);margin:0 0 4px;text-transform:uppercase}
.mblock .g{font-size:10px;letter-spacing:.24em;font-weight:800;color:var(--mute);text-transform:uppercase}
.mblock .gt{font-weight:800;font-size:clamp(14px,1.1vw,17px);margin:2px 0}
.mblock p{font-size:13px;color:var(--mute);margin:0}
.match .btn{margin-top:14px;justify-content:center;font-size:22px}
.lessons .lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lessons .lh small{font-size:10px;letter-spacing:.22em;font-weight:800;color:var(--mute)}
.ll{list-style:none;margin:0;padding:0;overflow:auto;min-height:0;display:grid;gap:6px;align-content:start}
.ll button{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;border:1px solid transparent;background:rgba(31,50,72,.04);border-radius:14px;padding:7px 12px;cursor:pointer;transition:background .2s}
.ll button:hover{background:rgba(31,50,72,.08)}
.ll .pr{display:block;font-size:9px;letter-spacing:.22em;font-weight:900;color:var(--mute)}
.ll .t{font-weight:800;font-size:14px;line-height:1.25}.ll .t small{display:block;font-weight:600;font-size:12px;color:var(--mute)}
.ll .go2{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:rgba(31,50,72,.08)}
.ll .soon{font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--mute)}
.ll li.next button{border-color:var(--red);background:#fff}.ll li.next .go2{background:var(--red);color:#fff}
.ll .puck3d{width:clamp(30px,2.4vw,40px);height:auto}
@media (max-width:1100px){.area{width:91vw}.player{display:none}}
@media (max-height:940px){.mblock .g,.mblock p{display:none}.match h2{font-size:52px;margin:4px 0 8px}}
@media (max-height:820px){.mc{grid-template-rows:auto 48px 0 auto auto}.mc .nm{display:none}.opp img{max-height:100px}.mblock .g,.mblock p{display:none}}
</style></head>
<body>
<div id="stage"></div>
<div class="player"><img src="img/pl_stand.webp" alt="Хоккеист номер 7"></div>
<section class="area">
  <span class="kick bar">Расписание сезона · Spotlight 7</span>
  <div class="fxs"><div class="fx" id="fx"></div></div>
  <div class="low"><div class="panel match" id="match"></div><div class="panel lessons" id="lessons"></div></div>
</section>
<div class="veil2"></div>
<script src="data.js?v=43"></script><script src="ui2.js?v=42"></script>
<script>
(() => {
  const $ = id => document.getElementById(id), P = UI2.profile(), st = P.st, B = ICE_BOOK;
  const TEAMS = ['wolf', 'bear', 'eagle', 'fox', 'lynx', 'deer', 'lion', 'owl', 'shark', 'tiger'];
  const TEAMRU = ['Волки', 'Медведи', 'Орлы', 'Лисы', 'Рыси', 'Олени', 'Львы', 'Совы', 'Акулы', 'Тигры'];
  UI2.header('season');
  const sc = UI2.scene($('stage'), { horizon: .42, size: .28, sink: .3, center: true });
  const setHz = () => document.documentElement.style.setProperty('--hz', sc.horizonPx() + 'px'); setHz(); addEventListener('resize', setHz);
  const doneIn = m => m.lessons.filter(l => st.done[l.id]).length;
  const nx = ICE_NEXT(st), curM = nx.m.n;
  let sel = +(new URLSearchParams(location.search).get('m')) || curM;
  B.forEach((m, i) => {
    const d = doneIn(m), all = d === m.lessons.length, now = m.n === curM && !all, lostN = m.lessons.filter(l => st.lp[l.id] && st.lp[l.id].lost).length;
    const b = document.createElement('button'); b.className = 'mc ' + (all ? 'won' : now ? 'now' : 'later'); b.style.setProperty('--i', i);
    b.innerHTML = `<span class="no">${String(m.n).padStart(2, '0')}</span><span class="em"><img src="img/team_${TEAMS[i]}.webp" alt=""></span><span class="nm">Матч ${m.n}<small>${m.en}</small></span>
      ${lostN ? `<span class="st" style="color:var(--red)">${d} : ${lostN}</span><span class="tg" style="background:var(--red)">ПЕРЕИГРАТЬ</span>` : all ? `<span class="st">${d} : 0</span><span class="tg">ПОБЕДА</span>` : now ? `<span class="st">${d} : ${m.lessons.length - d}</span><span class="tg">СЕГОДНЯ</span>` : `<span class="st" style="opacity:.45">— : —</span><span class="tg" style="background:#9aaabb">ВПЕРЕДИ</span>`}`;
    b.onclick = () => select(m.n); $('fx').appendChild(b);
  });
  let mf = null;
  function select(n) {
    sel = n; const m = B[n - 1], i = n - 1, d = doneIn(m); clearInterval(mf);
    [...$('fx').children].forEach((b, k) => b.classList.toggle('sel', k === i));
    sc.set(String(n).padStart(2, '0'), `spotlight 7 · матч ${n} · соперник: ${TEAMRU[i]}`, false);
    const next = m.lessons.find(l => !st.done[l.id]) || m.lessons[0];
    const href = ICE_READY[next.id] ? `lesson.html?l=${next.id}` : `module.html?m=${n}&l=${next.id}`;
    const topic = m.grammar.split(',')[0].replace(/ и Present /, ' / ').replace(/ и /, ' / ');
    $('match').innerHTML = `<span class="kick bar">Spotlight 7 · модуль ${n}</span><h2 class="h"><span class="flip" id="mt">Матч ${n}</span></h2>
      <div class="vs"><span class="me2">${P.name} · №7</span><span class="x">VS</span><span class="op" title="${m.grammar}">${topic}</span></div>
      <div class="opp"><span class="bigw">${TEAMRU[i].toUpperCase()}</span><img src="img/team_${TEAMS[i]}.webp" alt=""></div>
      <div class="mblock"><h3>${m.en} <span style="color:var(--mute)">· ${m.ru}</span></h3><div class="g">Темы матча</div><div class="gt">${m.grammar}</div><p>Учебник, стр. ${m.pages}${d ? ` · сыграно уроков: ${d} из ${m.lessons.length}` : ''}</p></div>
      <a class="btn" href="${href}" data-go>На лёд <span>→</span></a>`;
    $('lessons').innerHTML = `<div class="lh"><span class="kick bar">Уроки матча ${n}</span><small>${m.lessons.length} уроков</small></div><ul class="ll" id="ll"></ul>`;
    m.lessons.forEach((l, k) => {
      const dn = !!st.done[l.id], lost = st.lp[l.id] && st.lp[l.id].lost, isNext = l === next && !dn, ready = ICE_READY[l.id];
      const li = document.createElement('li'); if (isNext) li.className = 'next';
      li.innerHTML = `<button>${UI2.puck(36, dn ? 'done' : isNext ? 'next' : 'off')}<span><span class="pr">${k + 1} период · ${l.code}${l.kind ? ' · ' + l.kind : ''}</span><span class="t">${l.en}<small>${l.ru}${st.lp[l.id] && st.lp[l.id].best != null ? ` · <b style="color:var(--red)">рекорд ${st.lp[l.id].best} из 10</b>` : ''}</small></span></span>
        ${lost ? '<span class="soon" style="color:var(--red)">ПОРАЖЕНИЕ · ПЕРЕИГРАЙ</span>' : ready ? '<span class="go2">›</span>' : '<span class="soon">СКОРО</span>'}</button>`;
      li.firstChild.onclick = () => UI2.go(ready ? `lesson.html?l=${l.id}` : `module.html?m=${n}&l=${l.id}`);
      $('ll').appendChild(li);
    });
    document.querySelectorAll('[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); UI2.go(a.getAttribute('href')); });
    let fl = 0; mf = setInterval(() => { const e = $('mt'); if (!e) return; e.classList.add('out'); setTimeout(() => { fl ^= 1; e.textContent = fl ? `Game ${n}` : `Матч ${n}`; e.classList.remove('out'); }, 450); }, 6500);
    document.querySelectorAll('.hand.nx').forEach(x => x.remove());
    setTimeout(() => { const r = document.querySelector('.ll li.next'); if (!r) return; const b = r.getBoundingClientRect(), pn = $('lessons').getBoundingClientRect();
      const nn = UI2.note(document.body, 'следующий<br>урок', pn.right + 22, b.top - 30, { x: -44, y: 30, d: 'M30 4 C 14 6, 2 12, -18 20 M-8 12 L-19 20 L-7 27' }); nn.style.textAlign = 'left';
      nn.classList.add('nx'); nn.style.position = 'fixed'; nn.style.zIndex = 15; }, 700);
  }
  sc.set('01', '', true); select(sel);
  UI2.ready();
})();
</script>
</body></html>
