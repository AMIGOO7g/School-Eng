<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ICE ENGLISH · Школа · Spotlight 7</title>
<link rel="stylesheet" href="ice.css">
<style>
.scene{--zoom:1.2}
body.ready .scene{--zoom:1.07}
.giant.num{left:79.5%;bottom:69.5%;font-size:30cqh;color:rgba(255,255,255,.9);text-shadow:0 12px 50px rgba(30,60,92,.22);transform:translate(calc(-50% + var(--px,0%)),var(--y,0%));opacity:var(--o,1);
  transition:transform 1.1s var(--ease),opacity .8s ease}
.giant.num.out{--y:55%;--o:0;transition:transform .7s cubic-bezier(.6,0,.8,.4),opacity .6s ease}
.giant.num.pre{--y:60%;--o:0;transition:none}
.scene{container-type:size}
.haze{position:fixed;inset:0;pointer-events:none;z-index:2;background:
  linear-gradient(90deg,rgba(239,245,250,.78) 0%,rgba(239,245,250,.5) 26%,rgba(239,245,250,0) 50%),
  linear-gradient(0deg,rgba(225,236,245,.75) 0%,rgba(225,236,245,0) 26%)}

.info{position:fixed;z-index:10;left:clamp(24px,5.6vw,96px);top:clamp(110px,20vh,210px);width:min(42vw,560px)}
.count{font-size:15px;color:var(--ink-2);display:flex;gap:12px;align-items:center}
.count::before{content:"";width:28px;height:3px;border-radius:3px;background:var(--red)}
.info h1{font-family:var(--display);font-weight:600;font-size:clamp(54px,6.6vw,118px);line-height:.92;margin:18px 0 10px;letter-spacing:-.005em}
.info .ru{font-size:clamp(18px,1.5vw,24px);font-weight:500;margin:0 0 26px;color:var(--ink)}
.facts{display:grid;gap:10px;margin:0 0 30px;font-size:15px;line-height:1.45;color:var(--ink-2);max-width:440px}
.facts b{display:block;font-weight:600;color:var(--ink);font-size:13px;margin-bottom:2px}
.bar{height:6px;border-radius:6px;background:rgba(27,47,69,.12);overflow:hidden;max-width:300px;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:var(--red);border-radius:6px;transition:width .8s var(--ease)}
.swap{transition:opacity .35s ease,transform .5s var(--ease)}
.swap.hide{opacity:0;transform:translateY(10px)}

.rail{position:fixed;z-index:10;left:clamp(24px,5.6vw,96px);right:clamp(24px,5.6vw,96px);bottom:clamp(20px,3.4vh,36px);
  display:grid;grid-template-columns:repeat(10,1fr);gap:10px;align-items:end}
.tile{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;padding:14px 14px 15px;min-height:104px;cursor:pointer;
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .45s var(--ease),background .3s,box-shadow .3s}
.tile:hover{background:var(--glass-strong)}
.tile .n{font-family:var(--display);font-weight:600;font-size:34px;line-height:.9;color:var(--ink)}
.tile .t{font-size:13px;line-height:1.25;color:var(--ink-2)}
.tile.on{transform:translateY(-14px);background:rgba(255,255,255,.88);box-shadow:0 18px 40px rgba(27,47,69,.18)}
.tile.on::before{content:"";position:absolute;left:14px;right:14px;top:-1px;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
.tile .ok{position:absolute;right:10px;top:10px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;display:grid;place-items:center}
.hint{position:fixed;z-index:10;right:clamp(24px,5.6vw,96px);bottom:calc(clamp(20px,3.4vh,36px) + 140px);font-size:13px;color:var(--ink-2);background:rgba(255,255,255,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:7px 14px;border-radius:999px}

.player-slot{left:58vw;top:40vh;width:min(25vw,40vh);height:calc(min(25vw,40vh) / 1.5)}

body.opening .scene{--zoom:1.45}
body.opening .info,body.opening .rail,body.opening .hint{opacity:0;transition:opacity .4s}

@media (max-width:1100px){
  .rail{grid-template-columns:repeat(5,1fr)}
  .tile{min-height:84px}
  .info{top:15vh;width:min(52vw,520px)}
  .player-slot{left:55vw;top:33vh;width:min(24vw,32vh);height:calc(min(24vw,32vh) / 1.5)}
  .hint{display:none}
}
</style></head>
<body>
<div class="entry" aria-hidden="true"><strong>SCHOOL</strong></div>
<main class="stage">
  <div class="scene" id="scene">
    <img src="img/modules_sky.webp" alt="">
    <div class="giant num" id="numA">01</div>
    <div class="giant num pre" id="numB">02</div>
    <img src="img/modules_fg.webp" alt="">
  </div>
</main>
<div class="haze"></div>
<div class="player-slot" aria-hidden="true"><span>Место для хоккеиста</span></div>

<header class="top">
  <a class="brand" href="index.html">ICE<span>ENGLISH</span></a>
  <nav class="crumbs" aria-label="Где ты сейчас"><a href="index.html">Главная</a><i>/</i><span>Школа</span><i>/</i><span>7 класс, Spotlight 7</span></nav>
  <div class="spacer"></div>
</header>

<section class="info" aria-live="polite">
  <div class="swap" id="swap">
    <div class="count" id="count">Модуль 1 из 10</div>
    <h1 id="title">Lifestyles</h1>
    <p class="ru" id="ru">Образ жизни</p>
    <div class="facts">
      <div><b>Грамматика</b><span id="gram"></span></div>
      <div><b>В модуле</b><span id="meta"></span><div class="bar"><i id="bar"></i></div></div>
    </div>
  </div>
  <a class="go" id="open" href="module.html?m=1">Открыть модуль <b>›</b></a>
</section>

<div class="hint">Листай модули колесом мыши или стрелками</div>
<nav class="rail" id="rail" aria-label="Модули учебника"></nav>
<div class="veil"></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
(() => {
  const B = ICE_BOOK, store = ICE_STORE.load();
  const $ = id => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  let cur = Math.min(10, Math.max(1, +(qs.get('m') || store.module || 1)));
  const pad = n => String(n).padStart(2, '0');
  const doneIn = m => m.lessons.filter(l => store.done[l.id]).length;

  // плитки модулей
  B.forEach(m => {
    const b = document.createElement('button');
    b.className = 'tile'; b.dataset.n = m.n;
    b.innerHTML = `<span class="n">${m.n}</span><span class="t">${m.en}</span>${doneIn(m) === m.lessons.length ? '<span class="ok">✓</span>' : ''}`;
    b.setAttribute('aria-label', `Модуль ${m.n}: ${m.en}, ${m.ru}`);
    b.onclick = () => (m.n === cur ? open() : go(m.n));
    $('rail').appendChild(b);
  });

  let front = $('numA'), back = $('numB');
  function paint(first) {
    const m = B[cur - 1], d = doneIn(m);
    const fill = () => {
      $('count').textContent = `Модуль ${m.n} из 10`;
      $('title').textContent = m.en;
      $('ru').textContent = m.ru;
      $('gram').textContent = m.grammar;
      $('meta').textContent = `${m.lessons.length} уроков, учебник стр. ${m.pages}. Пройдено ${d} из ${m.lessons.length}`;
      $('bar').style.width = (d / m.lessons.length * 100) + '%';
      $('open').href = `module.html?m=${m.n}`;
      $('open').firstChild.textContent = d ? 'Продолжить модуль ' : 'Открыть модуль ';
    };
    [...$('rail').children].forEach(t => t.classList.toggle('on', +t.dataset.n === cur));
    // камера немного едет вдоль хребта, цифра — с параллаксом
    const k = (cur - 1) / 9;
    $('scene').style.setProperty('--pan', (2.2 - k * 4.4).toFixed(2) + '%');
    if (first) { fill(); front.textContent = pad(cur); front.style.setProperty('--px', (k * 30 - 15).toFixed(1) + '%'); return; }
    const sw = $('swap'); sw.classList.add('hide');
    setTimeout(() => { fill(); sw.classList.remove('hide'); }, 300);
    // старая цифра уходит за горы, новая поднимается из-за них
    front.classList.add('out');
    back.textContent = pad(cur);
    back.style.setProperty('--px', (k * 30 - 15).toFixed(1) + '%');
    back.classList.add('pre'); back.classList.remove('out');
    void back.offsetWidth;
    const rising = back;
    clearTimeout(rising.t); rising.t = setTimeout(() => rising.classList.remove('pre'), 260);
    [front, back] = [back, front];
    store.module = cur; ICE_STORE.save(store);
  }
  function go(n) { if (n < 1 || n > 10 || n === cur) return; cur = n; paint(false); }
  function open() {
    document.body.classList.add('opening');
    setTimeout(() => document.body.classList.add('leaving'), 350);
    setTimeout(() => location.assign(`module.html?m=${cur}`), 900);
  }
  $('open').onclick = e => { e.preventDefault(); open(); };

  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(cur + 1);
    else if (e.key === 'ArrowLeft') go(cur - 1);
    else if (e.key === 'Enter' && document.activeElement === document.body) open();
  });
  let acc = 0, lock = 0;
  addEventListener('wheel', e => {
    const now = Date.now(); if (now < lock) return;
    acc += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(acc) > 60) { go(cur + Math.sign(acc)); acc = 0; lock = now + 700; }
  }, { passive: true });
  let tx = null;
  addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive: true });
  addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(cur - Math.sign(dx)); tx = null; });

  // на узких экранах сдвигаем сцену, чтобы пик с цифрой не уходил за край
  function frame() {
    const vw = innerWidth, vh = innerHeight, Ws = Math.max(vw, vh * 1.777) * 1.07;
    const want = .76 * vw - vw / 2 - (.795 - .5) * Ws, lim = (Ws - vw) / 2 - Ws * .025;
    $('scene').style.setProperty('--sx', (want < 0 ? Math.max(-lim, want) : 0) + 'px');
  }
  frame(); addEventListener('resize', frame);
  paint(true);
  requestAnimationFrame(() => setTimeout(() => document.body.classList.add('ready'), qs.get('from') === 'home' ? 150 : 0));
})();
</script>
</body></html>
