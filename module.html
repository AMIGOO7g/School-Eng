<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ICE ENGLISH · Модуль</title>
<link rel="stylesheet" href="ice.css">
<style>
.scene{--zoom:1.12;transform:translate(calc(-50% + var(--sx,0px)),calc(-50% + var(--sy,0px))) scale(var(--zoom));transition:transform 1.3s var(--ease)}
body.night .giant{color:rgba(255,255,255,.16)}
body.ready .scene{--zoom:var(--cz,1)}
body.back .scene{--zoom:.94}
body.go-lesson .scene{--zoom:1.35}
.giant.word{left:var(--wl,40%);bottom:var(--wb,72.6%);font-size:var(--fs,20cqh);transform:translateY(70%);opacity:0;transition:transform 1.5s var(--ease) .35s,opacity .9s ease .35s}
body.ready .giant.word{transform:none;opacity:1}
body.back .giant.word,body.go-lesson .giant.word{transform:translateY(70%);opacity:0;transition:transform .6s cubic-bezier(.6,0,.8,.4),opacity .5s}

/* точки уроков на красной линии */
.node{position:absolute;z-index:5;width:0;height:0;border:0;background:none;padding:0;cursor:pointer;--dw:max(22px,calc(6.4cqh * var(--s)))}
.node::before{content:"";position:absolute;left:0;top:calc(var(--dw) * .42);width:calc(var(--dw) * 1.9);height:calc(var(--dw) * .55);transform:translate(-50%,-50%);
  border-radius:50%;background:radial-gradient(ellipse at center,rgba(20,44,70,.28),rgba(20,44,70,0) 70%);border:1.5px solid rgba(255,255,255,.75)}
.dot{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:var(--dw);height:var(--dw);border-radius:50%;display:grid;place-items:center;
  font-weight:900;letter-spacing:-.04em;font-size:max(11px,calc(2.1cqh * var(--s)));color:var(--ink);
  background:rgba(255,255,255,.8);border:2px solid #fff;box-shadow:0 6px 18px rgba(27,47,69,.22);backdrop-filter:blur(6px);transition:transform .35s var(--ease),background .3s}
.tag{position:absolute;top:0;left:calc(var(--dw) / 2 + 8px);transform:translateY(-50%);white-space:nowrap;font-size:max(12px,calc(1.55cqh * max(var(--s),.75)));
  font-weight:600;line-height:1.2;padding:.5em .85em;border-radius:999px;background:rgba(255,255,255,.72);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.85);color:var(--ink);transition:background .3s,color .3s}
.node .tag{opacity:0;pointer-events:none;transition:opacity .3s,background .3s,color .3s}
.node.now .tag,.node.sel .tag,.node:hover .tag,.node:focus-visible .tag{opacity:1}
.node.left .tag{left:auto;right:calc(var(--dw) / 2 + 8px)}
.node.below .tag{left:0;top:calc(var(--dw) * 1.05 + 10px);transform:translateX(-50%)}
.node:hover .dot{transform:translate(-50%,-50%) scale(1.08)}
.node.done .dot{background:var(--red);border-color:var(--red);color:#fff}
.node.now .dot{background:#fff;border-color:var(--red);border-width:3px}
.node.now .dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--red);animation:pulse 1.8s ease-out infinite}
.node.sel .tag{background:var(--ink);color:#fff;border-color:var(--ink)}
.node.soon .dot{background:rgba(255,255,255,.5);border-style:dashed;color:var(--ink-2)}
.node .tag em{font-style:normal;font-size:.8em;margin-left:8px;padding:2px 7px;border-radius:999px;background:rgba(37,75,112,.14)}
.node.sel .tag em{background:rgba(255,255,255,.2)}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
.node{opacity:0;transition:opacity .5s ease var(--d,0s)}
body.ready .node{opacity:1}

.player-slot{right:3vw;bottom:3vh;height:38vh;width:57vh;z-index:4}

/* карточка модуля */
.card{position:fixed;z-index:10;left:clamp(24px,5vw,74px);top:72px;bottom:clamp(18px,3vh,32px);width:min(34vw,470px);
  display:flex;flex-direction:column;border-radius:28px;padding:22px 26px 22px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.85);
  backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1);box-shadow:0 24px 60px rgba(27,47,69,.14);
  opacity:0;transform:translateX(-24px);transition:opacity .6s ease .2s,transform .8s var(--ease) .2s}
body.ready .card{opacity:1;transform:none}
body.back .card,body.go-lesson .card{opacity:0;transform:translateX(-24px);transition-delay:0s}
.card .crumbs{text-shadow:none;font-size:12px;color:var(--ink-2)}
.back-link{display:inline-flex;margin-top:14px;align-self:flex-start;font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;gap:8px;align-items:center;
  padding:7px 14px 7px 10px;border-radius:999px;background:rgba(255,255,255,.7)}
.back-link:hover{color:var(--red)}
.card .kicker{margin-top:18px}
.card h1{font-size:clamp(40px,3.8vw,64px);margin:10px 0 8px}
.card .title-2{margin:0 0 14px;font-size:clamp(17px,1.4vw,22px)}
.list{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0}
.list button{width:100%;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;text-align:left;border:0;background:none;
  padding:8px 10px;border-radius:14px;cursor:pointer}
.list button:hover{background:rgba(255,255,255,.6)}
.list .c{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;letter-spacing:-.04em;font-size:13px;background:rgba(36,55,77,.08)}
.list .e{font-size:14px;font-weight:600;line-height:1.25}
.list .e small{display:block;font-size:11px;font-weight:600;color:var(--mute);margin-top:2px}
.list li.sel .e small{color:rgba(255,255,255,.65)}
.list .soon{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-left:6px}
.lhead{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.lhead .line{flex:1;height:1px;background:rgba(36,55,77,.12)}
.list .p{font-size:12px;color:var(--mute)}
.list li.done .c{background:var(--red);color:#fff}
.list li.now .c{box-shadow:inset 0 0 0 2px var(--red);background:#fff}
.list li.sel button{background:var(--ink);color:#fff}
.list li.sel .p{color:rgba(255,255,255,.7)}
.list li.sel .c{background:#fff;color:var(--ink)}
.detail{border-top:1px solid rgba(36,55,77,.1);margin-top:10px;padding-top:14px}
.detail p{margin:0 0 6px;font-size:14px;line-height:1.45;color:var(--ink)}
.detail small{display:block;font-size:12px;color:var(--mute);margin-bottom:14px}

@media (max-height:820px){.list button{padding:5px 10px}.list .c{width:30px;height:30px}.card h1{font-size:40px;margin:6px 0 4px}.card .title-2{margin-bottom:8px}
  .card .kicker{margin-top:12px}.card{padding:18px 22px 18px;top:64px}.detail{margin-top:8px;padding-top:10px}.detail small{margin-bottom:10px}}
@media (min-width:1900px){.card{width:min(26vw,640px);padding:30px 34px}.card h1{font-size:72px}.list .e{font-size:17px}.list .c{width:42px;height:42px;font-size:15px}.list button{grid-template-columns:44px 1fr auto;padding:11px 12px}.detail p{font-size:16px}.card .crumbs{font-size:14px}.tag{font-size:max(15px,calc(1.55cqh * max(var(--s),.75)))}}
@media (max-width:1200px){.card{width:min(37vw,420px)}.player-slot{height:30vh;width:45vh}}
</style></head>
<body class="arriving">
<main class="stage">
  <div class="scene" id="scene">
    <img id="sky" alt="">
    <div class="giant word" id="word">LIFESTYLES</div>
    <img class="fg" id="fg" alt="">
  </div>
</main>
<div class="player-slot" aria-hidden="true"><span>Место для хоккеиста: подъезд и торможение</span></div>

<header class="top"><a class="brand" href="index.html">ICE <span>ENGLISH</span></a></header>

<aside class="card">
  <nav class="crumbs" aria-label="Где ты сейчас"><a href="index.html">Главная</a><i>/</i><a href="school.html" class="to-school">Spotlight 7</a><i>/</i><span id="crumbMod">Модуль 1</span></nav>
  <a class="back-link to-school" href="school.html">‹ Все модули</a>
  <div class="kicker" id="mnum">Модуль 01, учебник стр. 5–14</div>
  <h1 class="title" id="title">Lifestyles</h1>
  <p class="title-2" id="ru">Образ жизни</p>
  <div class="lhead"><span class="kicker" style="margin:0">Уроки модуля</span><span class="line"></span></div>
  <ol class="list" id="list"></ol>
  <div class="detail">
    <p id="dText"></p>
    <small id="dPages"></small>
    <button class="go" id="start"><span id="startText">Начать урок</span> <span>↗</span></button>
  </div>
</aside>
<div class="veil"></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = ICE_STORE.load();
  const n = Math.min(10, Math.max(1, +new URLSearchParams(location.search).get('m') || 1));
  const M = ICE_BOOK[n - 1];
  const READY = ICE_READY;
  const R = ICE_ROUTES[ICE_ROUTE_FOR(n)];
  if (ICE_ROUTE_FOR(n) === 'night') document.body.classList.add('night');
  $('sky').src = `img/${R.img}_sky.webp`; $('fg').src = `img/${R.img}_fg.webp`;
  $('fg').style.top = R.fg[0] * 100 + '%'; $('fg').style.height = R.fg[1] * 100 + '%';
  // слово стоит на хребте и чуть выглядывает: низ спрятан за горами
  document.documentElement.style.setProperty('--wb', ((1 - R.ridge - .035) * 100).toFixed(2) + '%');
  store.module = n; ICE_STORE.save(store);
  document.title = `ICE ENGLISH · Модуль ${n} · ${M.en}`;

  // точки на красной линии (координаты в долях фото)
  const P = R.nodes;
  const yN = P[0][1], yF = P[P.length - 1][1];
  const scaleAt = y => .38 + .62 * Math.max(0, (y - yF) / (yN - yF));
  let cur = M.lessons.findIndex(l => !store.done[l.id]);
  if (cur < 0) cur = M.lessons.length - 1;
  let sel = cur;

  $('title').textContent = M.en; $('ru').textContent = M.ru;
  $('mnum').textContent = `Модуль ${String(n).padStart(2, '0')}, учебник стр. ${M.pages}`;
  $('crumbMod').textContent = `Модуль ${n}`;

  const scene = $('scene'), nodes = [], items = [];
  M.lessons.forEach((l, i) => {
    const [x, y] = P[i], s = scaleAt(y);
    const b = document.createElement('button');
    b.className = 'node';
    b.style.left = x * 100 + '%'; b.style.top = y * 100 + '%';
    b.style.setProperty('--s', s.toFixed(3)); b.style.setProperty('--d', (.35 + i * .08) + 's');
    b.setAttribute('aria-label', `${l.code}: ${l.en}`);
    if (!READY[l.id]) b.classList.add('soon');
    b.innerHTML = `<span class="dot">${l.code}</span><span class="tag">${l.en}${READY[l.id] ? '' : '<em>скоро</em>'}</span>`;
    b.onclick = () => select(i);
    scene.appendChild(b); nodes.push(b);
    const li = document.createElement('li');
    li.innerHTML = `<button><span class="c">${l.code}</span><span class="e">${l.en}${l.kind ? `<small>${l.kind}</small>` : ''}</span><span class="p">${READY[l.id] ? '' : '<span class="soon">скоро</span> '}стр. ${l.pages}</span></button>`;
    li.firstChild.onclick = () => select(i);
    $('list').appendChild(li); items.push(li);
  });

  function select(i) {
    sel = i; const l = M.lessons[i];
    [nodes, items].forEach(arr => arr.forEach((el, k) => {
      el.classList.toggle('sel', k === i); el.classList.toggle('done', !!store.done[M.lessons[k].id]); el.classList.toggle('now', k === cur);
    }));
    $('dText').textContent = l.ru;
    $('dPages').textContent = `Учебник, стр. ${l.pages}`;
    $('startText').textContent = !READY[l.id] ? 'Урок готовится' : store.done[l.id] ? 'Повторить урок' : 'Начать урок';
    $('start').disabled = !READY[l.id];
    camera(i);
  }
  // камера едет к выбранному уроку: чем дальше точка, тем сильнее приближение; сама точка остаётся на месте
  function camera(i) {
    const [x, y] = P[i], s = scaleAt(y), z = 1 + .42 * (1 - s);
    const Ws = W(), Hs = Ws / 1.777;
    const px = (x - .5) * Ws, py = (y - .5) * Hs;
    // точку дополнительно подтягиваем к свободной части экрана справа от карточки
    const cardR = document.querySelector('.card').getBoundingClientRect().right;
    const targetX = (cardR + innerWidth) / 2 - innerWidth / 2, targetY = 0;
    const k = (1 - s) * .55;
    let sx = px * (1 - z) + (targetX - px) * k, sy = py * (1 - z) + (targetY - py) * k * .5;
    const lx = (z * Ws - innerWidth) / 2, ly = (z * Hs - innerHeight) / 2;     // край фото не должен показаться
    sx = Math.max(-lx, Math.min(lx, sx)); sy = Math.max(-ly, Math.min(ly, sy));
    scene.style.setProperty('--cz', z.toFixed(3));
    scene.style.setProperty('--sx', sx.toFixed(1) + 'px'); scene.style.setProperty('--sy', sy.toFixed(1) + 'px');
  }

  const W = () => Math.max(innerWidth, innerHeight * 1.777);
  // гигантское слово — в видимой части неба, справа от карточки
  function fitWord() {
    const w = $('word'), vw = innerWidth, Ws = W();
    const sceneLeft = vw / 2 - Ws / 2;
    const cardR = document.querySelector('.card').getBoundingClientRect().right + 24;
    const x0 = (cardR - sceneLeft) / Ws, x1 = (vw - Math.max(24, vw * .03) - sceneLeft) / Ws;
    w.textContent = M.en.toUpperCase(); w.style.setProperty('--fs', '20cqh');
    let cw = w.offsetWidth / Ws; const avail = x1 - x0;
    if (avail / cw < .75) { w.textContent = `MODULE ${n}`; cw = w.offsetWidth / Ws; }
    const k = Math.min(1, avail / cw);
    w.style.setProperty('--fs', (20 * k).toFixed(2) + 'cqh');
    w.style.setProperty('--wl', ((x1 - cw * k) * 100).toFixed(2) + '%');
  }
  // подписи точек не должны залезать на карточку, за край экрана и на место хоккеиста
  function placeTags() {
    const vw = innerWidth, Ws = W();
    const cardR = document.querySelector('.card').getBoundingClientRect().right + 12;
    const slot = document.querySelector('.player-slot').getBoundingClientRect();
    nodes.forEach((b, i) => {
      const x = vw / 2 + (P[i][0] - .5) * Ws, y = innerHeight / 2 + (P[i][1] - .5) * (Ws / 1.777);
      const t = b.querySelector('.tag'), tw = t.offsetWidth, dw = b.querySelector('.dot').offsetWidth / 2 + 8;
      const hitsSlot = y > slot.top - 10;
      const fitsR = x + dw + tw < Math.min(vw - 8, hitsSlot ? slot.left - 6 : vw), fitsL = x - dw - tw > cardR;
      let left = P[i][0] > .8 || hitsSlot;
      if (left && !fitsL) left = false;
      if (!left && !fitsR && fitsL) left = true;
      b.classList.toggle('left', left);
    });
  }

  const toast = $('toast');
  const say = msg => { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => toast.classList.remove('show'), 2400); };
  $('start').onclick = () => {
    const l = M.lessons[sel];
    if (!READY[l.id]) return;
    document.body.classList.add('go-lesson');
    setTimeout(() => document.body.classList.add('leaving'), 300);
    setTimeout(() => location.assign(`lesson.html?l=${l.id}`), 850);
  };
  document.querySelectorAll('.to-school').forEach(a => a.onclick = e => {
    e.preventDefault();
    document.body.classList.add('back');
    setTimeout(() => document.body.classList.add('leaving'), 250);
    setTimeout(() => location.assign(`school.html?m=${n}`), 800);
  });
  addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') select(Math.min(M.lessons.length - 1, sel + 1));
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') select(Math.max(0, sel - 1));
    if (e.key === 'Escape') document.querySelector('.back-link').click();
  });
  addEventListener('resize', () => { fitWord(); placeTags(); });

  select(sel); fitWord(); placeTags();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fitWord(); placeTags(); });
  requestAnimationFrame(() => setTimeout(() => { document.body.classList.add('ready'); document.body.classList.remove('arriving'); }, 60));
})();
</script>
</body></html>
