<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ICE ENGLISH · Модуль</title>
<link rel="stylesheet" href="ice.css">
<style>
/* тактическая схема модуля */
.board{position:fixed;z-index:5;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.board .hit{pointer-events:auto;cursor:pointer}
.board .node-c{transition:r .3s}
.board .lbl{opacity:0;transition:opacity .3s}
.board g.nd:hover .lbl,.board g.nd.sel .lbl,.board g.nd.now .lbl{opacity:1}
.board .pulse{animation:pulse2 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse2{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
.board .draw{stroke-dashoffset:var(--len);animation:drawl 1.1s var(--ease) forwards;animation-delay:var(--dl,0s)}
@keyframes drawl{to{stroke-dashoffset:0}}
body.back .board,body.go-lesson .board{opacity:0;transition:opacity .4s}
.stage .ibg-giant-wrap{transform:translateY(22vh);opacity:0;transition:transform 1.4s var(--ease) .3s,opacity 1s ease .3s}
body.ready .stage .ibg-giant-wrap{transform:none;opacity:1}
body.back .stage .ibg-giant-wrap,body.go-lesson .stage .ibg-giant-wrap{transform:translateY(22vh);opacity:0;transition:transform .5s,opacity .4s}

/* карточка модуля */
.card{position:fixed;z-index:10;left:clamp(24px,5vw,74px);top:72px;bottom:clamp(18px,3vh,32px);width:min(34vw,470px);
  display:flex;flex-direction:column;border-radius:28px;padding:22px 26px 22px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.85);
  backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1);box-shadow:0 24px 60px rgba(27,47,69,.14);
  opacity:0;transform:translateX(-24px);transition:opacity .6s ease .2s,transform .8s var(--ease) .2s}
body.ready .card{opacity:1;transform:none}
body.back .card,body.go-lesson .card{opacity:0;transform:translateX(-24px);transition-delay:0s}
.card .crumbs{text-shadow:none;font-size:12px;color:var(--ink-2)}
.back-link{display:inline-flex;margin-top:14px;align-self:flex-start;font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;gap:8px;align-items:center;
  padding:7px 14px 7px 10px;border-radius:999px;background:rgba(255,255,255,.7)}
.back-link:hover{color:var(--red)}
.card .kicker{margin-top:18px}
.card h1{font-size:clamp(40px,3.8vw,64px);margin:10px 0 8px}
.card .title-2{margin:0 0 14px;font-size:clamp(17px,1.4vw,22px)}
.list{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0}
.list button{width:100%;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;text-align:left;border:0;background:none;
  padding:8px 10px;border-radius:14px;cursor:pointer}
.list button:hover{background:rgba(255,255,255,.6)}
.list .c{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;letter-spacing:-.04em;font-size:13px;background:rgba(36,55,77,.08)}
.list .e{font-size:14px;font-weight:600;line-height:1.25}
.list .e small{display:block;font-size:11px;font-weight:600;color:var(--mute);margin-top:2px}
.list li.sel .e small{color:rgba(255,255,255,.65)}
.list .soon{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-left:6px}
.lhead{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.lhead .line{flex:1;height:1px;background:rgba(36,55,77,.12)}
.list .p{font-size:12px;color:var(--mute)}
.list li.done .c{background:var(--red);color:#fff}
.list li.now .c{box-shadow:inset 0 0 0 2px var(--red);background:#fff}
.list li.sel button{background:var(--ink);color:#fff}
.list li.sel .p{color:rgba(255,255,255,.7)}
.list li.sel .c{background:#fff;color:var(--ink)}
.detail{border-top:1px solid rgba(36,55,77,.1);margin-top:10px;padding-top:14px}
.detail p{margin:0 0 6px;font-size:14px;line-height:1.45;color:var(--ink)}
.detail small{display:block;font-size:12px;color:var(--mute);margin-bottom:14px}

@media (max-height:820px){.list button{padding:5px 10px}.list .c{width:30px;height:30px}.card h1{font-size:40px;margin:6px 0 4px}.card .title-2{margin-bottom:8px}
  .card .kicker{margin-top:12px}.card{padding:18px 22px 18px;top:64px}.detail{margin-top:8px;padding-top:10px}.detail small{margin-bottom:10px}}
@media (min-width:1900px){.card{width:min(26vw,640px);padding:30px 34px}.card h1{font-size:72px}.list .e{font-size:17px}.list .c{width:42px;height:42px;font-size:15px}.list button{grid-template-columns:44px 1fr auto;padding:11px 12px}.detail p{font-size:16px}.card .crumbs{font-size:14px}.tag{font-size:max(15px,calc(1.55cqh * max(var(--s),.75)))}}
@media (max-width:1200px){.card{width:min(37vw,420px)}.player-slot{height:30vh;width:45vh}}
</style></head>
<body class="arriving">
<main class="stage" id="stage"></main>
<svg class="board" id="board"></svg>

<header class="top"><a class="brand" href="index.html">ICE <span>ENGLISH</span></a></header>

<aside class="card">
  <nav class="crumbs" aria-label="Где ты сейчас"><a href="index.html">Главная</a><i>/</i><a href="school.html" class="to-school">Spotlight 7</a><i>/</i><span id="crumbMod">Модуль 1</span></nav>
  <a class="back-link to-school" href="school.html">‹ Все модули</a>
  <div class="kicker" id="mnum">Модуль 01, учебник стр. 5–14</div>
  <h1 class="title" id="title">Lifestyles</h1>
  <p class="title-2" id="ru">Образ жизни</p>
  <div class="lhead"><span class="kicker" style="margin:0">Уроки модуля</span><span class="line"></span></div>
  <ol class="list" id="list"></ol>
  <div class="detail">
    <p id="dText"></p>
    <small id="dPages"></small>
    <button class="go" id="start"><span id="startText">Начать урок</span> <span>↗</span></button>
  </div>
</aside>
<div class="veil"></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="ice-bg.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = ICE_STORE.load();
  const n = Math.min(10, Math.max(1, +new URLSearchParams(location.search).get('m') || 1));
  const M = ICE_BOOK[n - 1];
  const READY = ICE_READY;
  store.module = n; ICE_STORE.save(store);
  document.title = `ICE ENGLISH · Модуль ${n} · ${M.en}`;

  // схема: уроки — как игроки на тактической доске, стрелки — порядок прохождения
  const U = [[.08,.62],[.22,.30],[.37,.68],[.51,.32],[.65,.66],[.79,.34],[.92,.56]];
  let cur = M.lessons.findIndex(l => !store.done[l.id]);
  if (cur < 0) cur = M.lessons.length - 1;
  const want = new URLSearchParams(location.search).get('l');
  let sel = Math.max(0, M.lessons.findIndex(l => l.id === want)); if (!want) sel = cur;
  $('title').textContent = M.en; $('ru').textContent = M.ru;
  $('mnum').textContent = `Модуль ${String(n).padStart(2, '0')}, учебник стр. ${M.pages}`;
  $('crumbMod').textContent = `Модуль ${n}`;

  const items = [];
  M.lessons.forEach((l, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<button><span class="c">${l.code}</span><span class="e">${l.en}${l.kind ? `<small>${l.kind}</small>` : ''}</span><span class="p">${READY[l.id] ? '' : '<span class="soon">скоро</span> '}стр. ${l.pages}</span></button>`;
    li.firstChild.onclick = () => select(i);
    $('list').appendChild(li); items.push(li);
  });

  const word = M.en.length > 14 ? `MODULE ${n}` : M.en.toUpperCase();
  let BX = {};
  const bg = IceBG.mount($('stage'), { text: word, giantBehind: 2, horizon: .40, seed: 10 + n, giantSize: .22, giantLift: .012,
    onText: t => { // слово — по центру свободной части неба, ширина по месту
      const cardR = document.querySelector('.card').getBoundingClientRect().right, vw = innerWidth;
      const x0 = cardR + 30, x1 = vw - 30; t.setAttribute('x', (x0 + x1) / 2);
      const w = t.getBBox().width; if (w > x1 - x0) t.style.fontSize = (parseFloat(t.style.fontSize) * (x1 - x0) / w) + 'px';
    } });
  const NS = 'http://www.w3.org/2000/svg', board = $('board');
  function drawBoard(animate) {
    const vw = innerWidth, vh = innerHeight, cardR = document.querySelector('.card').getBoundingClientRect().right;
    board.setAttribute('viewBox', `0 0 ${vw} ${vh}`);
    const L0 = cardR + Math.max(30, vw * .035), R0 = vw - Math.max(30, vw * .035), T0 = bg.horizon() + vh * .04, B0 = vh - Math.max(24, vh * .04);
    let w = R0 - L0, h = B0 - T0;
    if (w > h * 2.15) { BX.x = L0 + (w - h * 2.15) / 2; BX.y = T0; w = h * 2.15; }
    else { BX.x = L0; BX.y = T0 + (h - w / 2.15) / 2; h = w / 2.15; }
    BX.w = w; BX.h = h;
    const P = U.map(([u, v]) => [BX.x + u * w, BX.y + v * h]);
    const r = Math.max(18, Math.min(46, h * .075)), rr = h * .3, fs = Math.max(13, r * .4);
    let g = `<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#24374d" fill-opacity=".45"/></marker>
      <marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d3262e"/></marker></defs>`;
    // площадка: разметка как на тактической доске, очень бледно
    const x = BX.x, y = BX.y;
    g += `<g opacity=".9"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rr}" fill="#ffffff" fill-opacity=".28" stroke="#ffffff" stroke-width="2"/>
      <line x1="${x + w / 2}" y1="${y}" x2="${x + w / 2}" y2="${y + h}" stroke="#d3262e" stroke-opacity=".28" stroke-width="2"/>
      <line x1="${x + w * .34}" y1="${y}" x2="${x + w * .34}" y2="${y + h}" stroke="#5b86b8" stroke-opacity=".3" stroke-width="2"/>
      <line x1="${x + w * .66}" y1="${y}" x2="${x + w * .66}" y2="${y + h}" stroke="#5b86b8" stroke-opacity=".3" stroke-width="2"/>
      <line x1="${x + w * .06}" y1="${y + h * .06}" x2="${x + w * .06}" y2="${y + h * .94}" stroke="#d3262e" stroke-opacity=".2"/>
      <line x1="${x + w * .94}" y1="${y + h * .06}" x2="${x + w * .94}" y2="${y + h * .94}" stroke="#d3262e" stroke-opacity=".2"/>
      <circle cx="${x + w / 2}" cy="${y + h / 2}" r="${h * .15}" fill="none" stroke="#ffffff" stroke-width="2"/>
      ${[[.17, .28], [.17, .72], [.83, .28], [.83, .72]].map(([a, b]) => `<circle cx="${x + w * a}" cy="${y + h * b}" r="${h * .13}" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="1.5"/>`).join('')}</g>`;
    // стрелки между уроками
    const curve = (a, b, k) => { const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
      const off = L * .18 * (k % 2 ? 1 : -1); const cx = mx - dy / L * off, cy = my + dx / L * off;
      const ux = (cx - a[0]), uy = (cy - a[1]), ul = Math.hypot(ux, uy), vx = (b[0] - cx), vy = (b[1] - cy), vl = Math.hypot(vx, vy);
      const s0 = [a[0] + ux / ul * (r + 6), a[1] + uy / ul * (r + 6)], s1 = [b[0] - vx / vl * (r + 8), b[1] - vy / vl * (r + 8)];
      return { d: `M${s0[0]} ${s0[1]} Q${cx} ${cy} ${s1[0]} ${s1[1]}`, a: s0, c: [cx, cy], b: s1, L }; };
    const C = [];
    for (let i = 0; i < P.length - 1; i++) {
      const c = curve(P[i], P[i + 1], i); C.push(c);
      const done = !!store.done[M.lessons[i].id];
      g += done ? `<path d="${c.d}" fill="none" stroke="#d3262e" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arR)" ${animate ? `class="draw" style="--len:${c.L * 1.2};--dl:${.3 + i * .15}s" stroke-dasharray="${c.L * 1.2}"` : ''}/>`
                : `<path d="${c.d}" fill="none" stroke="#24374d" stroke-opacity=".38" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#ar)"/>`;
    }
    // уроки
    M.lessons.forEach((l, i) => {
      const [px, py] = P[i], done = !!store.done[l.id], ready = READY[l.id];
      const fill = done ? '#d3262e' : '#ffffff', tc = done ? '#fff' : '#24374d';
      const lw = Math.min(420, l.en.length * (r > 30 ? 9 : 7.4) + 34);
      const ly = py + (U[i][1] > .5 ? r + 14 : -r - 14 - 30), lx = Math.max(BX.x + 6, Math.min(BX.x + w - lw - 6, px - lw / 2));
      g += `<g class="nd${i === cur ? ' now' : ''}${i === sel ? ' sel' : ''}" data-i="${i}">
        ${i === cur ? `<circle class="pulse" cx="${px}" cy="${py}" r="${r}" fill="none" stroke="#d3262e" stroke-width="2"/>` : ''}
        <circle cx="${px}" cy="${py + 3}" r="${r}" fill="#1b2f45" fill-opacity=".12"/>
        <circle class="node-c" cx="${px}" cy="${py}" r="${r}" fill="${fill}" stroke="${i === cur ? '#d3262e' : i === sel ? '#24374d' : '#ffffff'}" stroke-width="${i === cur || i === sel ? 3 : 2}" ${ready || done ? '' : 'stroke-dasharray="4 4"'}/>
        <text x="${px}" y="${py + r * .3}" text-anchor="middle" font-family="Inter,Arial" font-weight="900" font-size="${r * .78}" letter-spacing="-1" fill="${tc}">${l.code}</text>
        <g class="lbl"><rect x="${lx}" y="${ly}" width="${lw}" height="30" rx="15" fill="${i === sel ? '#24374d' : '#ffffff'}" fill-opacity="${i === sel ? 1 : .92}"/>
          <text x="${lx + lw / 2}" y="${ly + 20}" text-anchor="middle" font-family="Inter,Arial" font-weight="700" font-size="${fs}" fill="${i === sel ? '#fff' : '#24374d'}">${l.en}${ready ? '' : ' · скоро'}</text></g>
        <circle class="hit" cx="${px}" cy="${py}" r="${r + 8}" fill="transparent"/></g>`;
    });
    // фишка «7» — игрок; при входе подъезжает от последнего пройденного урока к текущему
    g += `<g id="token"><circle r="${r * .62}" fill="#d3262e" stroke="#ffffff" stroke-width="2.5"/><text y="${r * .22}" text-anchor="middle" font-family="Inter,Arial" font-weight="900" font-size="${r * .6}" fill="#fff">7</text></g>`;
    board.innerHTML = g;
    board.querySelectorAll('g.nd').forEach(n => n.querySelector('.hit').onclick = () => select(+n.dataset.i));
    const tok = board.querySelector('#token'), tp = (i) => [P[i][0] + r * .95, P[i][1] - r * .95];
    const end = tp(cur);
    if (animate && cur > 0) {
      const c = C[cur - 1], t0 = performance.now(), dur = 1300;
      (function step(now) { let t = Math.min(1, (now - t0 - 500) / dur); if (t < 0) t = 0; const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        const qx = (1 - e) * (1 - e) * c.a[0] + 2 * (1 - e) * e * c.c[0] + e * e * c.b[0], qy = (1 - e) * (1 - e) * c.a[1] + 2 * (1 - e) * e * c.c[1] + e * e * c.b[1];
        const p = t < 1 ? [qx + r * .95 * e, qy - r * .95 * e] : end;
        tok.setAttribute('transform', `translate(${p[0]} ${p[1]})`); if (t < 1) requestAnimationFrame(step); })(t0);
    } else tok.setAttribute('transform', `translate(${end[0]} ${end[1]})`);
  }

  function select(i) {
    sel = i; const l = M.lessons[i];
    items.forEach((li, k) => { li.classList.toggle('sel', k === i); li.classList.toggle('done', !!store.done[M.lessons[k].id]); li.classList.toggle('now', k === cur); });
    board.querySelectorAll('g.nd').forEach(n => { const k = +n.dataset.i; n.classList.toggle('sel', k === i);
      const rect = n.querySelector('.lbl rect'), tx = n.querySelector('.lbl text'), c = n.querySelector('.node-c');
      rect.setAttribute('fill', k === i ? '#24374d' : '#ffffff'); rect.setAttribute('fill-opacity', k === i ? 1 : .92); tx.setAttribute('fill', k === i ? '#fff' : '#24374d');
      if (k !== cur) { c.setAttribute('stroke', k === i ? '#24374d' : '#ffffff'); c.setAttribute('stroke-width', k === i ? 3 : 2); } });
    $('dText').textContent = l.ru;
    $('dPages').textContent = `Учебник, стр. ${l.pages}`;
    $('startText').textContent = !READY[l.id] ? 'Урок готовится' : store.done[l.id] ? 'Повторить урок' : 'Начать урок';
    $('start').disabled = !READY[l.id];
  }

  const toast = $('toast');
  const say = msg => { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => toast.classList.remove('show'), 2400); };
  $('start').onclick = () => {
    const l = M.lessons[sel];
    if (!READY[l.id]) return;
    document.body.classList.add('go-lesson');
    setTimeout(() => document.body.classList.add('leaving'), 300);
    setTimeout(() => location.assign(`lesson.html?l=${l.id}`), 850);
  };
  document.querySelectorAll('.to-school').forEach(a => a.onclick = e => {
    e.preventDefault();
    document.body.classList.add('back');
    setTimeout(() => document.body.classList.add('leaving'), 250);
    setTimeout(() => location.assign(`school.html?m=${n}`), 800);
  });
  addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') select(Math.min(M.lessons.length - 1, sel + 1));
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') select(Math.max(0, sel - 1));
    if (e.key === 'Escape') document.querySelector('.back-link').click();
  });
  addEventListener('resize', () => { drawBoard(false); select(sel); });

  setTimeout(() => { bg.redraw(); drawBoard(true); select(sel); }, 120);
  select(sel);
  requestAnimationFrame(() => setTimeout(() => { document.body.classList.add('ready'); document.body.classList.remove('arriving'); }, 60));
})();
</script>
</body></html>
