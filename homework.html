<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICE ENGLISH · Задание тренера</title>
<link rel="stylesheet" href="fonts.css?v=38"><link rel="stylesheet" href="ui2.css?v=45">
<style>
html,body{height:100%;overflow:hidden}
.sc-over{font-size:12px!important;letter-spacing:.42em!important;color:var(--ink-2)!important;opacity:.9!important}
.who{position:fixed;z-index:9;pointer-events:none;right:1.5vw;bottom:3vh;height:68vh}
.who img{height:100%;display:block;filter:drop-shadow(0 30px 30px rgba(20,40,64,.2))}
.cols{position:fixed;z-index:12;left:6vw;width:68vw;top:170px;bottom:5vh;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:1.4vw}
.pnl{border-radius:24px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 18px 44px rgba(20,44,70,.14);padding:clamp(18px,2.4vh,28px) clamp(18px,1.6vw,28px);display:flex;flex-direction:column;min-height:0;animation:pin .7s var(--ease) both}
@keyframes pin{from{opacity:0;transform:translateY(18px)}}
.pgrow{display:flex;align-items:center;gap:14px;margin:10px 0 6px}
.pgrow input{width:150px;font-family:var(--head);font-size:44px;text-align:center;border:2px solid var(--red);border-radius:16px;padding:6px 8px;color:var(--ink);background:#fff}
.pgrow small{font-size:13px;color:var(--mute);line-height:1.4}
.mods{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 10px}
.mods button{width:38px;height:38px;border-radius:12px;border:1px solid rgba(31,50,72,.15);background:#fff;font-family:var(--head);font-size:18px;cursor:pointer}
.mods button.on{background:var(--ink);color:#fff}
.ls{list-style:none;margin:0;padding:0;overflow:auto;min-height:0;display:grid;gap:6px;align-content:start}
.ls button{width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid transparent;background:rgba(31,50,72,.05);border-radius:14px;padding:8px 12px;cursor:pointer}
.ls button.on{border-color:var(--red);background:#fff}
.ls .c{font-family:var(--head);font-size:20px}.ls b{font-size:14px}.ls small{display:block;color:var(--mute);font-size:12px}
.exs{list-style:none;margin:10px 0 0;padding:0;overflow:auto;min-height:0;display:grid;gap:8px;align-content:start}
.exs li{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 14px;border-radius:16px;background:rgba(31,50,72,.05)}
.exs .n{font-family:var(--head);font-size:22px;color:var(--red);min-width:34px}
.exs b{display:block;font-size:15px}.exs span{font-size:13px;color:var(--ink-2)}
.pill{border:0;border-radius:999px;background:var(--red);color:#fff;font-weight:900;font-size:13px;letter-spacing:.08em;padding:11px 20px;cursor:pointer;text-decoration:none;white-space:nowrap}
.empty{font-size:15px;color:var(--ink-2);line-height:1.5}
h2.h{font-size:clamp(30px,2.6vw,44px);margin:6px 0 4px}
@media (max-width:1100px){.cols{width:88vw}.who{display:none}}
#exn{width:84px!important;margin-left:8px}
.pgrow input{font-family:var(--head);font-size:30px}
.pnl{background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(242,246,250,.92))!important}
</style></head>
<body>
<div id="stage"></div>
<div class="who"><img src="img/pl_stand.webp" alt=""></div>
<section class="cols">
  <div class="pnl"><span class="kick bar">Что задали в школе?</span><div class="pgrow"><input id="pg" type="number" min="5" max="104" placeholder="стр."><input id="exn" type="text" maxlength="4" placeholder="упр."><small>Страница и номер<br>упражнения из дневника —<br>открою нужное сразу</small></div>
    <span class="kick">или выбери модуль и урок</span><div class="mods" id="mods"></div><ul class="ls" id="ls"></ul></div>
  <div class="pnl" id="res"><span class="kick bar">Упражнения</span><p class="empty">Здесь появятся упражнения выбранного урока. В каждом — короткое правило, само задание с проверкой и подсказками, а в конце — что переписать в тетрадь.</p></div>
</section>
<div class="veil2"></div>
<script src="data.js?v=45"></script><script src="ui2.js?v=45"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id), store = ICE_STORE.load();
  UI2.header('hw');
  const sc = UI2.photo($('stage'), { src: 'bg_coach', pos: '70% 50%', horizon: .3 }); UI2.plaque('HOMEWORK', 'задание тренера · spotlight 7');
  const setHz = () => document.documentElement.style.setProperty('--hz', sc.horizonPx() + 'px'); setHz(); addEventListener('resize', setHz);
  UI2.ready();
  await ICE_LOAD();
  let mod = store.module || 1;
  const go = h => UI2.go(h);
  const show = (m, l, pg) => {
    [...$('ls').querySelectorAll('button')].forEach(b => b.classList.toggle('on', b.dataset.id === l.id));
    const L = (window.ICE_LESSONS || {})[l.id], box = $('res');
    if (!L) { box.innerHTML = `<span class="kick bar">Модуль ${m.n} · стр. ${l.pages}</span><h2 class="h">${l.code} · ${l.en}</h2><p class="empty">Этот урок пока готовится. Можно посмотреть, что в нём будет.</p><div><a class="pill" href="school.html?m=${m.n}" id="toMod">Маршрут модуля →</a></div>`;
      $('toMod').onclick = e => { e.preventDefault(); go(`school.html?m=${m.n}`); }; return; }
    const exN = ($('exn').value || '').trim().toLowerCase().replace(/[^0-9a-z]/g, '');
    const all = L.homework.map((h, i) => ({ h, i }));
    let list = all.filter(x => !pg || x.h.ex.includes(String(pg)) || !/стр\./i.test(x.h.ex));
    if (exN) { const hit = all.filter(x => { const m2 = x.h.ex.match(/Упр\.\s*(\d+[a-z]?)/i); return m2 && (m2[1].toLowerCase() === exN || m2[1].replace(/[a-z]/g, '') === exN); }); if (hit.length) list = hit; }
    box.innerHTML = `<span class="kick bar">Модуль ${m.n} · стр. ${l.pages}</span><h2 class="h">${l.code} · ${l.en}</h2><p class="empty" style="margin:0">${L.ru}. Выбери упражнение — сначала короткое правило, потом задание с проверкой.</p><ul class="exs" id="exs"></ul>`;
    (list.length ? list : all).forEach(({ h, i }, k) => { const li = document.createElement('li');
      li.innerHTML = `<span class="n">${k + 1}</span><span><b>${h.ex}</b><span>${h.task}</span></span><a class="pill" href="lesson.html?l=${l.id}&v=hw&ex=${i}">РАЗОБРАТЬ</a>`;
      li.querySelector('a').onclick = e => { e.preventDefault(); go(`lesson.html?l=${l.id}&v=hw&ex=${i}`); }; $('exs').appendChild(li); });
  };
  const lessonsOf = m => { $('ls').innerHTML = '';
    m.lessons.forEach(l => { const li = document.createElement('li'), b = document.createElement('button'); b.dataset.id = l.id;
      b.innerHTML = `<span class="c">${l.code}</span><span><b>${l.en}</b><small>стр. ${l.pages}${ICE_READY[l.id] ? '' : ' · скоро'}</small></span><span>›</span>`;
      b.onclick = () => show(m, l); li.appendChild(b); $('ls').appendChild(li); }); };
  ICE_BOOK.forEach(m => { const b = document.createElement('button'); b.textContent = m.n; b.title = m.en;
    b.onclick = () => { mod = m.n; [...$('mods').children].forEach(x => x.classList.toggle('on', x === b)); lessonsOf(m); }; $('mods').appendChild(b); });
  $('mods').children[mod - 1].click();
  $('exn').oninput = () => $('pg').oninput();
  $('pg').oninput = () => { const pg = +$('pg').value; if (!pg) return;
    for (const m of ICE_BOOK) for (const l of m.lessons) { const [a, b] = l.pages.split('–').map(Number); if (pg >= a && pg <= (b || a)) { $('mods').children[m.n - 1].click(); show(m, l, pg); return; } }
    $('res').innerHTML = `<span class="kick bar">Упражнения</span><p class="empty">Страница ${pg} не входит в уроки модулей. Уроки идут со стр. 6 по стр. 104.</p>`; };
})();
</script>
</body></html>
