<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICE ENGLISH · Что будем делать (проба)</title>
<link rel="stylesheet" href="fonts.css?v=30"><link rel="stylesheet" href="proba.css?v=30">
<style>
.lead{position:fixed;z-index:10;left:0;right:0;top:calc(var(--hz,44vh) + clamp(18px,3vh,36px))}
.lead .head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:clamp(18px,3vh,30px)}
.lead h1{font-size:clamp(40px,4.4vw,70px);margin:10px 0 8px}
.lead .sub{font-size:clamp(15px,1.15vw,18px);color:var(--ink-2);font-weight:600;margin:0}
.cards{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:16px}
.card{position:relative;text-align:left;border:0;border-radius:24px;padding:22px 22px 20px;background:rgba(255,255,255,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 14px 34px rgba(20,44,70,.12);display:flex;flex-direction:column;gap:8px;min-height:clamp(170px,22vh,220px);cursor:pointer;
  transition:transform .35s var(--ease),box-shadow .35s}
.card:hover{transform:translateY(-4px) rotate(-.3deg);box-shadow:0 22px 46px rgba(20,44,70,.18)}
.card b{font-size:clamp(22px,1.7vw,28px);font-weight:900;letter-spacing:-.05em;line-height:1}
.card .d{font-size:14px;line-height:1.45;color:var(--ink-2)}
.card .go{margin-top:auto;align-self:flex-start}
.card.dark{background:var(--ink);color:#fff}.card.dark .kicker,.card.dark .d{color:rgba(255,255,255,.7)}
.card .ico{position:absolute;right:18px;top:18px;width:46px;height:46px}
.season{display:flex;gap:6px;margin:4px 0 2px}
.season i{width:14px;height:14px;border-radius:50%;background:rgba(36,55,77,.12)}
.season i.done{background:radial-gradient(circle at 34% 30%,#6b7785 0 9%,#2a3440 32%,#111820 64%)}
.season i.now{box-shadow:0 0 0 2px var(--red);background:#fff}
.pen{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:13px;color:var(--red)}
.slot.hub{position:relative;flex:none;width:clamp(150px,14vw,220px);height:clamp(130px,17vh,190px)}
</style></head>
<body>
<div class="ps" id="stage"></div>
<section class="lead"><div class="wrap">
  <div class="head rise">
    <div><div class="kicker">Учебник Spotlight 7, «Английский в фокусе»</div>
      <h1 class="title">Что будем делать?</h1>
      <p class="sub">Выбери режим. Прогресс сохраняется сам.</p></div>
    <div class="slot hub"><span>Хоккеист</span></div>
  </div>
  <div class="cards" id="cards"></div>
</div></section>
<div class="veil"></div>
<script src="data.js?v=45"></script><script src="lessons/1a.js?v=30"></script><script src="proba-scene.js?v=30"></script><script src="proba-ui.js?v=30"></script>
<script>
(() => {
  const st = ICE_STORE.load(), nx = ICE_NEXT(st), ms = (st.mistakes || []).length;
  PUI.header(null);
  const sc = PScene.mount(document.getElementById('stage'), { img: 'modules', text: 'SPOTLIGHT', over: '7 класс · сезон 2026/27', horizon: .44, size: .19, sink: .3,
    x: () => (innerWidth - Math.min(1320, innerWidth - 2 * Math.max(20, Math.min(64, innerWidth * .04)))) / 2 });
  const setHz = () => document.documentElement.style.setProperty('--hz', sc.horizonPx() + 'px'); setHz(); addEventListener('resize', setHz);
  const done = ICE_BOOK.map(m => m.lessons.every(l => st.done[l.id]));
  const C = [
    { cls: 'dark', k: 'Задали в школе', b: 'Сделать домашку', d: 'Введи страницу учебника или выбери упражнение — получишь правило, подсказки и проверку.', btn: 'Открыть домашку', red: 1, href: 'homework.html',
      ico: '<svg class="ico" viewBox="0 0 48 48"><rect x="10" y="6" width="28" height="36" rx="5" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2.5"/><path d="M17 17h14M17 24h14M17 31h8" stroke="#fff" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round"/></svg>' },
    { k: 'Сезон: 10 матчей', b: 'Изучить тему', d: `Модуль — это матч, урок — период. Сейчас: матч ${nx.m.n}, урок ${nx.l.code}.`, btn: 'Продолжить сезон', href: 'proba-match.html',
      extra: `<div class="season">${done.map((x, i) => `<i class="${x ? 'done' : i + 1 === nx.m.n ? 'now' : ''}"></i>`).join('')}</div>` },
    { k: 'Штрафная скамейка', b: 'Отбыть штраф', d: ms ? `Здесь задания, где ты ошибся: ${ms}. Решишь верно — выйдешь со скамейки.` : 'Здесь собираются задания с ошибками. Пока на скамейке пусто — отлично!', btn: ms ? 'На лёд' : 'Открыть', href: 'lesson.html?mode=review',
      extra: `<span class="pen">⏱ ${ms ? ms + ' на скамейке' : '0 на скамейке'}</span>` }
  ];
  const box = document.getElementById('cards');
  C.forEach((c, i) => {
    const el = document.createElement('div'); el.className = `card rise ${c.cls || ''}`; el.style.setProperty('--i', i + 1);
    el.innerHTML = `${c.ico || ''}<span class="kicker">${c.k}</span><b>${c.b}</b>${c.extra || ''}<span class="d">${c.d}</span><button class="go ${c.red ? 'red' : ''}">${c.btn} <span>↗</span></button>`;
    el.onclick = () => PUI.go(c.href); box.appendChild(el);
  });
  PUI.ready();
  // пометка тренера: «начни отсюда» к рекомендованному режиму
  setTimeout(() => {
    const target = box.children[1].getBoundingClientRect(), head = document.querySelector('.lead h1').getBoundingClientRect();
    PUI.note('начни отсюда!', { x: Math.min(target.left + target.width * .55, innerWidth - 260), y: head.top + 4 }, { x: target.left + target.width * .5, y: target.top - 8 }, { from: 'bottom', bend: -.25, delay: 200 });
  }, 1200);
})();
</script>
</body></html>
