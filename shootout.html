<!doctype html>
<html lang="ru">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICE ENGLISH · Буллиты дня</title>
<link rel="stylesheet" href="fonts.css?v=38"><link rel="stylesheet" href="ui2.css?v=50">
<style>
html,body{height:100%;overflow:hidden;background:#0c1520}
/* ворота на весь экран, вид от бьющего */
.gbg{position:fixed;inset:0;background:url(img/bg_goal.webp) center/cover no-repeat;transform:scale(1.02);transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.gbg.zoom{transform:scale(1.06)}
.gbg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(8,16,28,.45) 100%)}
.flash{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0}
.flash.goal{animation:fl .9s ease-out}.flash.goal{background:radial-gradient(circle at var(--fx) var(--fy),rgba(255,70,60,.55),transparent 45%)}
.flash.save{animation:fl .9s ease-out;background:radial-gradient(circle at var(--fx) var(--fy),rgba(120,170,255,.45),transparent 45%)}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
/* вратарь */
.gk2{position:fixed;z-index:6;pointer-events:none;transform-origin:50% 100%;filter:drop-shadow(0 18px 18px rgba(0,0,0,.35));transition:opacity .12s}
.gk2.hide{opacity:0}
/* зоны-углы с ответами */
.zone{position:fixed;z-index:8;border:0;background:transparent;cursor:crosshair;display:flex;align-items:center;justify-content:center;padding:0}
.zone .pill{display:flex;align-items:center;gap:10px;max-width:92%;background:rgba(10,20,34,.82);color:#fff;border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:10px 16px;font-weight:800;font-size:clamp(15px,1.25vw,22px);line-height:1.2;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 10px 24px rgba(0,0,0,.35);transition:transform .2s,background .2s,border-color .2s;text-align:left}
.zone .pill i{flex:none;font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--red);font-family:var(--head);font-size:17px}
.zone:hover .pill{transform:scale(1.06);border-color:#fff;background:rgba(211,38,46,.9)}
.zone:hover .pill i{background:#fff;color:var(--red)}
.zone::before{content:"";position:absolute;width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,0);transition:.2s}
.zone:hover::before{border-color:rgba(255,255,255,.85);box-shadow:0 0 0 6px rgba(211,38,46,.35)}
.zone.ok .pill{background:#1c8a4c;border-color:#fff}.zone.bad .pill{background:#b51c24;border-color:#fff}
.zone[disabled]{cursor:default}
/* вопрос — титр трансляции над воротами */
.qbar{position:fixed;z-index:12;left:50%;transform:translateX(-50%);width:min(980px,86vw);text-align:center;color:#fff;
  background:linear-gradient(135deg,rgba(16,30,48,.94),rgba(28,52,80,.9));border-radius:18px;padding:16px 26px 18px;box-shadow:0 18px 40px rgba(0,0,0,.35);border-top:4px solid var(--red)}
.qbar .k{font-size:13px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#ffb3b6}
.qbar .q{font-size:clamp(22px,2.1vw,36px);font-weight:800;line-height:1.25;margin:6px 0 0}
.qbar .q u{display:inline-block;min-width:3.4em;border-bottom:4px solid var(--red);text-decoration:none}
/* табло серии */
.so-bar{position:fixed;z-index:20;left:50%;top:104px;transform:translateX(-50%) skewX(-10deg);display:flex;align-items:stretch;border-radius:10px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.so-bar > *{transform:skewX(10deg);display:flex;align-items:center;gap:10px;padding:8px 20px;color:#fff}
.so-bar .t{background:linear-gradient(135deg,#e63a42,#b51c24);font-family:Inter,Arial,sans-serif;font-weight:900;font-variant-numeric:tabular-nums;font-size:30px;min-width:120px;justify-content:center}
.so-bar .t.low{animation:blink 1s infinite}@keyframes blink{50%{opacity:.6}}
.so-bar .sh{background:#16263a}
.so-bar .sh i{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.45);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:900}
.so-bar .sh i.now{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.so-bar .sh i.g{background:var(--red);border-color:var(--red)}.so-bar .sh i.s{background:#5b6b7d;border-color:#5b6b7d}
.so-bar .scn{background:#0f1c2b;font-family:var(--head);font-size:28px}
/* крупная надпись ГОЛ / СЭЙВ */
.big2{position:fixed;z-index:25;left:50%;top:46%;transform:translate(-50%,-50%) scale(.6) skewX(-10deg);font-family:var(--head);font-size:clamp(90px,12vw,210px);color:#fff;opacity:0;pointer-events:none;
  text-shadow:0 8px 30px rgba(0,0,0,.45);-webkit-text-stroke:3px rgba(0,0,0,.15)}
.big2.on{animation:bg2 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.big2.goal{color:#fff;background:linear-gradient(135deg,#e63a42,#b51c24);padding:0 .25em;border-radius:14px}
.big2.save{color:#fff;background:linear-gradient(135deg,#2c4560,#16263a);padding:0 .25em;border-radius:14px}
@keyframes bg2{0%{opacity:0;transform:translate(-50%,-50%) scale(.5) skewX(-10deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05) skewX(-10deg)}75%{opacity:1;transform:translate(-50%,-50%) scale(1) skewX(-10deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1) skewX(-10deg)}}
/* шайба */
.pk3{position:fixed;z-index:9;width:44px;height:26px;border-radius:50%;background:radial-gradient(ellipse at 40% 30%,#6c7886,#141b23 60%);box-shadow:0 6px 10px rgba(0,0,0,.4);opacity:0;pointer-events:none}
/* стартовая и итоговая карточка */
.panel3{position:fixed;z-index:22;left:50%;top:54%;transform:translate(-50%,-50%);width:min(620px,88vw);background:linear-gradient(160deg,rgba(255,255,255,.96),rgba(240,246,252,.94));border-radius:26px;padding:30px 34px;box-shadow:0 30px 80px rgba(0,0,0,.45);text-align:center}
.panel3 h2{font-family:var(--head);font-weight:400;font-size:clamp(46px,4vw,70px);line-height:.95;margin:6px 0 10px;text-transform:uppercase}
.panel3 p{font-size:16px;line-height:1.5;color:var(--ink-2);margin:0 0 18px}
.panel3 .rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 20px;text-align:left}
.panel3 .rules div{background:#fff;border-radius:14px;padding:12px;font-size:13px;line-height:1.35;box-shadow:0 6px 14px rgba(20,44,70,.07)}
.panel3 .rules b{display:block;font-family:var(--head);font-weight:400;font-size:22px;color:var(--red)}
.panel3 .bigres{font-family:var(--head);font-size:110px;line-height:.9}.panel3 .bigres b{color:var(--red);font-weight:400}
.panel3 .row3{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.dim{position:fixed;inset:0;z-index:21;background:rgba(8,16,28,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.zone[data-c="TL"]{align-items:flex-start;justify-content:flex-start}.zone[data-c="TR"]{align-items:flex-start;justify-content:flex-end}
.zone[data-c="BL"]{align-items:flex-end;justify-content:flex-start}.zone[data-c="BR"]{align-items:flex-end;justify-content:flex-end}
.zone .pill{margin:6px}
.qbar{top:170px}
</style>
</head>
<body>
<div id="stage"></div><div class="gbg" id="gbg" style="display:none"></div>
<img class="gk2" id="gk" src="img/gk_ready.webp" alt="">
<div id="zones"></div>
<div class="pk3" id="pk"></div>
<div class="flash" id="fx"></div>
<div class="big2" id="big"></div>
<div class="so-bar" id="bar"><span class="t" id="tm">1:00</span><span class="sh" id="sh"></span><span class="scn" id="sc">0 / 5</span></div>
<div class="qbar" id="qb" style="display:none"></div>
<div class="dim" id="dim"></div>
<section class="panel3" id="panel"></section>
<script src="data.js?v=45"></script><script src="ui2.js?v=50"></script>
<script>
(() => {
  const $ = id => document.getElementById(id), st = ICE_STORE.load(), today = new Date().toISOString().slice(0, 10);
  UI2.header('hub'); UI2.abstract($('stage'), { theme: 'shoot' }); UI2.plaque('БУЛЛИТЫ ДНЯ', 'ежедневная минутка · 5 бросков · 60 секунд');
  const counts = !(st.shoot || {})[today];
  const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
  let Q = [], qi = 0, goals = 0, res = [], left = 60, timer = null, busy = false;

  /* «ворота» без картинки: невидимая рамка вокруг вратаря; вратарь выше неё, как в хоккее */
  function goal() {
    const W = innerWidth, H = innerHeight, h = Math.min(H * .42, W * .26), w = h * 1.7, bt = H * .86;
    return { l: W / 2 - w / 2, r: W / 2 + w / 2, t: bt - h, b: bt };
  }
  // поза вратаря: ready — в центре; high/low — прыжок в угол; flip — зеркально (в левую сторону)
  function pose(p, side) {
    const g = goal(), w = g.r - g.l, h = g.b - g.t, img = $('gk');
    img.classList.add('hide');
    setTimeout(() => {
      img.src = `img/gk_${p}.webp`;
      const ratio = { ready: 1064 / 900, high: 1310 / 852, low: 1609 / 729 }[p];
      const gh = p === 'ready' ? h * 1.25 : p === 'high' ? h * 1.05 : h * .72, gw = gh * ratio;
      const cx = p === 'ready' ? (g.l + g.r) / 2 : (side === 'R' ? g.l + w * .62 : g.l + w * .38);
      img.style.height = gh + 'px'; img.style.left = (cx - gw / 2) + 'px'; img.style.top = (g.b - gh) + 'px';
      img.style.transform = side === 'L' ? 'scaleX(-1)' : 'none';
      img.classList.remove('hide');
    }, p === 'ready' ? 0 : 60);
  }
  function layout() {
    const g = goal(), w = g.r - g.l, h = g.b - g.t;
    $('qb').style.top = Math.max(170, g.t - h * .25 - 150) + 'px';
    document.querySelectorAll('.zone').forEach(z => { const c = z.dataset.c;
      z.style.left = (c[1] === 'L' ? g.l : g.l + w / 2) + 'px'; z.style.top = (c[0] === 'T' ? g.t : g.t + h / 2) + 'px';
      z.style.width = w / 2 + 'px'; z.style.height = h / 2 + 'px'; });
    if (!busy) pose('ready');
  }
  addEventListener('resize', layout);

  const marks = () => { $('sh').innerHTML = [0, 1, 2, 3, 4].map(i => `<i class="${res[i] === 1 ? 'g' : res[i] === 0 ? 's' : i === qi ? 'now' : ''}">${res[i] === 1 ? '●' : res[i] === 0 ? '✕' : ''}</i>`).join(''); $('sc').textContent = `${goals} / 5`; };

  ICE_LOAD().then(() => {
    const LS = window.ICE_LESSONS || {};
    const pool = Object.values(LS).flatMap(L => (L.tasks || []).filter(t => t.type === 'choice' && t.text && t.options && t.options.length <= 4));
    Q = shuffle(pool).slice(0, 5);
    $('panel').innerHTML = `<span class="kick bar">Ежедневная минутка</span><h2>Буллиты дня</h2>
      <p>Ты один на один с вратарём. Ответы — в углах ворот. Бросай туда, где правильный ответ.</p>
      <div class="rules"><div><b>5 бросков</b>вопросы из уроков, которые ты прошёл</div><div><b>60 секунд</b>на всю серию</div><div><b>Верно — гол</b>неверно — вратарь ловит</div></div>
      <p style="font-size:14px;margin-bottom:16px">${counts ? 'Первая серия сегодня идёт в зачёт.' : 'Зачётная серия сегодня уже сыграна — эта для тренировки.'} Можно бросать клавишами 1–4.</p>
      <button class="btn" id="go">На лёд →</button>`;
    $('go').onclick = start; marks(); layout();
  });

  function start() {
    $('dim').style.display = 'none'; $('panel').style.display = 'none'; $('qb').style.display = '';
    timer = setInterval(() => { left--; $('tm').textContent = `0:${String(left).padStart(2, '0')}`; $('tm').classList.toggle('low', left <= 10); if (left <= 0) end(); }, 1000);
    show();
  }
  function show() {
    if (qi >= Q.length) return end();
    busy = false; marks(); pose('ready');
    const t = Q[qi], opts = shuffle(t.options), corners = shuffle(['TL', 'TR', 'BL', 'BR']);
    $('qb').innerHTML = `<div class="k">Бросок ${qi + 1} из 5 · ${t.prompt}</div><div class="q">${t.text.replace('___', '<u>&nbsp;</u>')}</div>`;
    $('zones').innerHTML = '';
    opts.forEach((o, k) => {
      const z = document.createElement('button'); z.className = 'zone'; z.dataset.c = corners[k]; z.dataset.k = k + 1;
      z.innerHTML = `<span class="pill"><i>${k + 1}</i>${o.t}</span>`;
      z.onclick = () => shoot(z, !!(o.ok || o.alt));
      $('zones').appendChild(z);
    });
    layout();
  }
  addEventListener('keydown', e => { const z = document.querySelector(`.zone[data-k="${e.key}"]:not([disabled])`); if (z) z.click(); });

  function shoot(z, ok) {
    if (busy) return; busy = true;
    document.querySelectorAll('.zone').forEach(x => x.disabled = true);
    const c = z.dataset.c, r = z.getBoundingClientRect(), g = goal();
    // точка удара: угол зоны ближе к штанге
    const tx = c[1] === 'L' ? r.left + r.width * .3 : r.left + r.width * .7, ty = c[0] === 'T' ? r.top + r.height * .32 : r.top + r.height * .7;
    // вратарь: при верном ответе прыгает в противоположную сторону, при неверном — ловит
    const side = ok ? (c[1] === 'L' ? 'R' : 'L') : c[1], high = ok ? c[0] !== 'T' : c[0] === 'T';
    const pk = $('pk'); 
    pk.animate([{ left: innerWidth / 2 - 22 + 'px', top: innerHeight - 70 + 'px', opacity: 1, transform: 'scale(2.2)' },
                { left: tx - 22 + 'px', top: ty - 13 + 'px', opacity: 1, transform: 'scale(.7)' }], { duration: 380, easing: 'cubic-bezier(.25,.1,.3,1)', fill: 'forwards' });
    setTimeout(() => pose(high ? 'high' : 'low', side), 120);
    setTimeout(() => {
      z.classList.add(ok ? 'ok' : 'bad');
      $('fx').style.setProperty('--fx', tx + 'px'); $('fx').style.setProperty('--fy', ty + 'px');
      $('fx').className = 'flash'; void $('fx').offsetWidth; $('fx').className = 'flash ' + (ok ? 'goal' : 'save');
      const b = $('big'); b.className = 'big2'; b.textContent = ok ? 'ГОЛ!' : 'СЭЙВ'; void b.offsetWidth; b.className = 'big2 on ' + (ok ? 'goal' : 'save');
      if (!ok) pk.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });
      res[qi] = ok ? 1 : 0; if (ok) goals++; qi++; marks();
      if (!ok) { const right = [...document.querySelectorAll('.zone')].find(x => Q[qi - 1].options.find(o => (o.ok || o.alt) && x.textContent.endsWith(o.t))); if (right) right.classList.add('ok'); }
    }, 400);
    setTimeout(() => { pk.style.opacity = 0; pk.getAnimations().forEach(a => a.cancel()); show(); }, ok ? 1500 : 2300);
  }
  function end() {
    clearInterval(timer); if ($('panel').dataset.end) return; $('panel').dataset.end = 1;
    while (res.length < 5) res.push(0); marks(); $('qb').style.display = 'none'; $('zones').innerHTML = ''; pose('ready');
    const s2 = ICE_STORE.load(); s2.shoot = s2.shoot || {}; if (counts) s2.shoot[today] = goals; ICE_STORE.save(s2);
    $('dim').style.display = ''; $('panel').style.display = '';
    $('panel').innerHTML = `<span class="kick bar">Серия буллитов${counts ? ' · в зачёт' : ' · тренировка'}</span><h2>${goals === 5 ? 'Снайпер!' : goals >= 3 ? 'Хорошая серия' : 'Вратарь в ударе'}</h2>
      <div class="bigres"><b>${goals}</b> / 5</div>
      <p>${goals === 5 ? 'Пять из пяти — ни одного шанса вратарю.' : goals >= 3 ? 'Больше половины бросков — в сетке.' : 'Ничего страшного — завтра новая серия. Повтори уроки, и вратарь не устоит.'}</p>
      <div class="row3"><button class="btn dark" onclick="location.reload()">Ещё серия</button><a class="btn" href="hub.html" data-go>В раздевалку</a></div>`;
    document.querySelectorAll('[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); UI2.go(a.getAttribute('href')); });
  }
  UI2.ready();
})();
</script>
</body></html>
