<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICE ENGLISH · Буллиты дня</title>
<link rel="stylesheet" href="fonts.css?v=38"><link rel="stylesheet" href="ui2.css?v=39">
<style>
html,body{height:100%;overflow:hidden}
.sc-over{font-size:12px!important;letter-spacing:.42em!important;color:var(--ink-2)!important;opacity:.9!important}
.so-bar{position:fixed;z-index:20;left:50%;top:13vh;transform:translateX(-50%) skewX(-10deg);display:flex;align-items:stretch;height:64px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#1d3048,#0f1c2b);color:#fff;box-shadow:0 16px 34px rgba(10,20,34,.3)}
.so-bar > *{transform:skewX(10deg);display:flex;align-items:center;gap:10px;padding:0 22px}
.so-bar .t{background:linear-gradient(135deg,#e63a42,#b51c24);font-family:var(--head);font-size:40px;min-width:120px;justify-content:center}
.so-bar .t.low{animation:blink 1s infinite}@keyframes blink{50%{opacity:.55}}
.so-bar .sh{gap:10px}
.so-bar .sh i{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;font-style:normal;font-size:14px}
.so-bar .sh i.g{background:#2aa860;border-color:#2aa860}.so-bar .sh i.s{background:var(--red);border-color:var(--red)}.so-bar .sh i.now{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.so-bar .sc{font-family:var(--head);font-size:34px}
.card5{position:fixed;z-index:12;left:8vw;width:46vw;top:calc(13vh + 100px);border-radius:26px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(20,44,70,.15);padding:clamp(20px,3vh,34px) clamp(22px,2.2vw,40px)}
.card5 .q{font-size:clamp(22px,2vw,34px);font-weight:800;line-height:1.3;margin:10px 0 18px}
.card5 .q u{text-decoration:none;display:inline-block;min-width:90px;border-bottom:3px solid var(--red)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid rgba(36,55,77,.12);background:#fff;border-radius:16px;padding:14px 18px;font-size:18px;font-weight:700;cursor:pointer;transition:translate .2s}
.opt:hover{translate:4px 0}.opt.ok{background:var(--ink);color:#fff}.opt.bad{border-color:var(--red);color:var(--red)}
.opt .puck3d{width:34px;height:auto}
.who{position:fixed;z-index:9;pointer-events:none;right:1vw;bottom:6vh;width:min(46vw,calc((100vh - 200px) * 1.87))}
.who img{width:100%;display:block}
.lower2{position:fixed;z-index:45;left:50%;bottom:4vh;transform:translateX(-50%) skewX(-12deg);display:flex;border-radius:10px;overflow:hidden;box-shadow:0 22px 50px rgba(10,20,30,.35);clip-path:inset(0 100% 0 0);transition:clip-path .45s var(--ease);pointer-events:none}
.lower2.show{clip-path:inset(0 0 0 0)}.lower2 > div{transform:skewX(12deg)}
.lower2 .l1{background:linear-gradient(135deg,#e63a42,#b51c24);color:#fff;font-family:var(--head);font-size:clamp(40px,4vw,70px);padding:6px 30px;font-style:italic;line-height:1}
.lower2 .l2{background:linear-gradient(135deg,#1d3048,#0f1c2b);color:#fff;font-family:var(--head);font-size:22px;padding:0 26px;display:flex;align-items:center;font-style:italic}
.lower2.post .l1{background:linear-gradient(135deg,#2c4560,#1d3048)}.lower2.post .l2{background:#fff;color:var(--ink)}
.res{text-align:center}.res .big{font-family:var(--head);font-size:clamp(70px,7vw,120px);line-height:.9}.res .big b{color:var(--red);font-weight:400}
.res .row3{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
</style></head>
<body>
<div id="stage"></div>
<div class="who"><img src="img/pl_shot.webp" alt=""></div>
<div class="so-bar" id="bar"><span class="t" id="tm">1:00</span><span class="sh" id="sh"></span><span class="sc" id="sc">0 / 5</span></div>
<section class="card5" id="card"></section>
<div class="lower2" id="lw"><div class="l1" id="l1"></div><div class="l2" id="l2"></div></div>
<div class="veil2"></div>
<script src="data.js?v=38"></script><script src="ui2.js?v=39"></script>
<script>
(() => {
  const $ = id => document.getElementById(id), st = ICE_STORE.load(), today = new Date().toISOString().slice(0, 10);
  UI2.header('hub');
  const sc = UI2.scene($('stage'), { horizon: .58, size: .3, sink: .3, fitW: .5, left: () => innerWidth * .075 }); sc.set('БУЛЛИТЫ', '', true);
  const counts = !(st.shoot || {})[today];   // первая серия дня идёт в зачёт
  const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
  let Q = [], qi = 0, goals = 0, res = [], left = 60, timer = null;
  const lower = (k, a, b) => { const l = $('lw'); l.className = 'lower2 ' + k; $('l1').textContent = a; $('l2').textContent = b; requestAnimationFrame(() => l.classList.add('show')); clearTimeout(l.t); l.t = setTimeout(() => l.classList.remove('show'), 1600); };
  const marks = () => { $('sh').innerHTML = [0, 1, 2, 3, 4].map(i => `<i class="${res[i] === 1 ? 'g' : res[i] === 0 ? 's' : i === qi ? 'now' : ''}">${res[i] === 1 ? '●' : res[i] === 0 ? '✕' : ''}</i>`).join(''); $('sc').textContent = `${goals} / 5`; };
  ICE_LOAD().then(() => {
    const LS = window.ICE_LESSONS || {};
    const pool = Object.values(LS).flatMap(L => (L.tasks || []).filter(t => t.type === 'choice' && t.text && t.options));
    Q = shuffle(pool).slice(0, 5);
    $('card').innerHTML = `<span class="kick bar">Ежедневная минутка · 5 бросков</span><h2 class="h" style="font-size:clamp(34px,3vw,52px);margin:8px 0">Буллиты дня</h2>
      <p style="font-size:16px;line-height:1.5;color:var(--ink-2);margin:0 0 18px">60 секунд на 5 вопросов из уроков, которые ты уже видел. Верно — гол, неверно — вратарь отбил. ${counts ? 'Первая серия сегодня идёт в зачёт.' : 'Сегодня зачётная серия уже сыграна — эта для тренировки.'}</p>
      <button class="btn" id="go">На бросок →</button>`;
    $('go').onclick = start; marks();
  });
  function start() { timer = setInterval(() => { left--; $('tm').textContent = `0:${String(left).padStart(2, '0')}`; $('tm').classList.toggle('low', left <= 10); if (left <= 0) end(); }, 1000); show(); }
  function show() {
    if (qi >= Q.length) return end(); marks();
    const t = Q[qi];
    $('card').innerHTML = `<span class="kick bar">Бросок ${qi + 1} из 5 · ${t.prompt}</span><p class="q">${t.text.replace('___', '<u>&nbsp;</u>')}</p><div class="opts" id="opts"></div>`;
    shuffle(t.options).forEach(o => { const b = document.createElement('button'); b.className = 'opt'; b.innerHTML = `${UI2.puck(34, 'off')}${o.t}`;
      b.onclick = () => { const ok = !!(o.ok || o.alt); document.querySelectorAll('.opt').forEach(x => x.disabled = true); b.classList.add(ok ? 'ok' : 'bad');
        res[qi] = ok ? 1 : 0; if (ok) { goals++; UI2.SFX.goal(); lower('', 'ГОЛ!', 'Точный бросок'); } else { UI2.SFX.post(); lower('post', 'СЭЙВ', 'Вратарь отбил'); }
        qi++; marks(); setTimeout(show, 900); };
      $('opts').appendChild(b); });
  }
  function end() {
    clearInterval(timer); if ($('card').dataset.end) return; $('card').dataset.end = 1;
    while (res.length < 5) res.push(0); marks();
    const s2 = ICE_STORE.load(); s2.shoot = s2.shoot || {}; if (counts) s2.shoot[today] = goals; ICE_STORE.save(s2);
    if (goals >= 4) UI2.SFX.horn();
    $('card').innerHTML = `<div class="res"><span class="kick">Серия буллитов${counts ? ' · в зачёт' : ' · тренировка'}</span><div class="big"><b>${goals}</b> / 5</div>
      <p style="font-size:17px">${goals === 5 ? 'Пять из пяти — снайпер!' : goals >= 3 ? 'Хорошая серия!' : 'Вратарь сегодня в ударе. Завтра — новая серия.'}</p>
      <div class="row3"><a class="btn" href="hub.html" data-go>В раздевалку</a><button class="btn dark" onclick="location.reload()">Ещё серия</button></div></div>`;
    document.querySelectorAll('[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); UI2.go(a.getAttribute('href')); });
  }
  UI2.ready();
})();
</script>
</body></html>
